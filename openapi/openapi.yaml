  /external-connectors/changes:
    post:
      tags:
        - External Connectors
      summary: Propose registering or revoking an external connector
      operationId: proposeExternalConnectorChange
      description: >
        Proposes registering an external connector (action register: a
        capability, the HTTPS endpoint to release it to, the policy that
        governs it, the parameters to forward, and optionally a timeout) or
        revoking the active one for a capability (action revoke). Nothing
        changes until a different person approves the proposal. Requires a
        human credential. A capability in a built in connector's namespace
        (paytm, hubspot, github, slack, test) is refused. The endpoint must
        be https, name a host with a domain (not an IP address, not
        localhost), carry no user name, password or fragment, and resolve
        only to public addresses; the address is checked again when the
        change is approved. To move a capability to a new endpoint, revoke
        the registration, then register the new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/propose-external-connector-change-request.schema.json"
            examples:
              register:
                summary: Real captured request
                value:
                  {
                    "action": "register",
                    "capability": "erp:create-invoice",
                    "endpointUrl": "https://erp.example.com/parmana/release",
                    "policy": "erp-invoice",
                    "allowedParameters": ["amount", "currency", "customerId"],
                    "timeoutMs": 10000,
                    "reason": "Finance creates invoices in the ERP through Parmana from October.",
                  }
              revoke:
                summary: Real captured request
                value:
                  {
                    "action": "revoke",
                    "capability": "erp:create-invoice",
                    "reason": "The ERP endpoint moves to a new host.",
                  }
      responses:
        "201":
          description: Proposed, PENDING_APPROVAL.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/external-connector-change-response.schema.json"
              examples:
                register:
                  summary: Real captured response
                  value:
                    {
                      "changeId": "1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37",
                      "action": "register",
                      "capability": "erp:create-invoice",
                      "endpointUrl": "https://erp.example.com/parmana/release",
                      "policy": "erp-invoice",
                      "allowedParameters": ["amount", "currency", "customerId"],
                      "timeoutMs": 10000,
                      "reason": "Finance creates invoices in the ERP through Parmana from October.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T17:25:46.316Z",
                      "status": "PENDING_APPROVAL",
                    }
                revoke:
                  summary: Real captured response
                  value:
                    {
                      "changeId": "5bdbfd6a-babf-4977-b090-d561ddcee0d7",
                      "action": "revoke",
                      "capability": "erp:create-invoice",
                      "reason": "The ERP endpoint moves to a new host.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T17:25:46.418Z",
                      "status": "PENDING_APPROVAL",
                    }
        "400":
          description: INVALID_EXTERNAL_CONNECTOR (a field is missing or malformed, the namespace belongs to a built in connector, or a revoke carries registration fields) or EXTERNAL_ENDPOINT_ADDRESS_REFUSED (the endpoint is not https, names an IP address or localhost, or resolves to an address that is not public, or does not resolve).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                builtInNamespace:
                  summary: Real captured response
                  value:
                    {
                      "error": "The namespace 'paytm' belongs to a built in connector. Use another namespace.",
                      "code": "INVALID_EXTERNAL_CONNECTOR",
                    }
                privateAddress:
                  summary: Real captured response
                  value:
                    {
                      "error": "The endpoint host 'erp-internal.example.com' resolves to an address that is not public (10.0.0.7).",
                      "code": "EXTERNAL_ENDPOINT_ADDRESS_REFUSED",
                    }
                badCapability:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "capability must be namespace:verb, at most 128 characters, matching ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$.",
                      "code": "INVALID_EXTERNAL_CONNECTOR",
                    }
                badTimeout:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "timeoutMs must be an integer from 1000 to 30000; it defaults to 10000.",
                      "code": "INVALID_EXTERNAL_CONNECTOR",
                    }
                duplicateParameter:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "allowedParameters must be an array of at most 64 distinct names, each matching ^[A-Za-z_][A-Za-z0-9_]{0,63}$.",
                      "code": "INVALID_EXTERNAL_CONNECTOR",
                    }
                revokeWithRegistrationFields:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "A revoke takes only action, capability and reason.",
                      "code": "INVALID_EXTERNAL_CONNECTOR",
                    }
                plainHttp:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "endpointUrl must use https.",
                      "code": "EXTERNAL_ENDPOINT_ADDRESS_REFUSED",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not a human credential (NON_HUMAN_CALLER_DENIED).
          content:
            application/json:
