  /execution-intents/{businessTransactionId}/finalize:
    post:
      tags:
        - Execution Intents
      summary: Rebuild the signed Trust Record for a released action
      operationId: finalizeExecutionIntent
      description: >
        Rebuilds the signed Execution Trust Record for an action that was
        released but whose record was never produced (ADR-0012). It NEVER calls
        a connector: it reads the execution context that was saved right after
        release and runs the same record building step the runtime uses, then
        verifies the record and generates its receipt, so a repaired record
        ends in the same state as an ordinary one. It is idempotent: if a
        Trust Record already exists it returns that record with outcome
        `ALREADY_FINALIZED` and builds nothing, so running it twice, or twice
        at once, produces one record. It refuses with `409` when no execution
        result was saved, because a record cannot be rebuilt from nothing.
        Requires a credential provisioned as a verified human
        (`credentialHolderType: USER`), otherwise `403` with code
        `NON_HUMAN_CALLER_DENIED`. This is the only supported way to create a
        Trust Record after the fact.
      parameters:
        - name: businessTransactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The Trust Record exists. `outcome` says whether this call rebuilt it (`FINALIZED`) or it already existed (`ALREADY_FINALIZED`).
