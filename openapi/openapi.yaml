  /execution-intents/{businessTransactionId}/resolve:
    post:
      tags:
        - Execution Intents
      summary: Close an intent you reconciled by hand
      operationId: resolveExecutionIntent
      description: >
        Closes an Execution Intent in state `PREPARED` or `ERRORED` after a
        verified human reconciled it at the connector (G-54). Those are the
        intents whose outcome only an operator can establish, because no
        execution result was saved. The body records what you found
        (`NOT_EXECUTED` or `EXECUTED`) and a required note. The intent moves to
        `RESOLVED` and leaves `GET /execution-intents/unfinalized`. It never
        calls a connector. It is idempotent: resolving an intent that is
        already `RESOLVED` changes nothing and returns `ALREADY_RESOLVED` with
        the original resolution, note and author. It refuses a `RELEASED`
        intent, because its execution result is saved and `finalize` is the
        right operation, and it refuses a `FINALIZED` intent, or any intent
        whose transaction already has a signed Trust Record. **The resolution is
        an attributed, timestamped statement by an operator, stored in the
        intent's unsigned status. It is not tamper evident and it is not a
        Trust Record.** Requires a credential provisioned as a verified human
        (`credentialHolderType: USER`), otherwise `403` with code
        `NON_HUMAN_CALLER_DENIED`.
      parameters:
        - name: businessTransactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/execution-intent-resolve-request.schema.json"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The intent is closed. `outcome` says whether this call closed it (`RESOLVED`) or it was already closed (`ALREADY_RESOLVED`).
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/execution-intent-resolve-response.schema.json"
              examples:
                resolved:
                  summary: "Real captured response, this call closed the intent"
                  value:
                    {
                      "outcome": "RESOLVED",
                      "businessTransactionId": "40dd71a7-d627-4e8a-8935-2ba35d5060f7",
                      "intent":
                        {
                          "intentId": "6fbdabeb-65c5-4264-976d-cc0db7c75dfe",
                          "businessTransactionId": "40dd71a7-d627-4e8a-8935-2ba35d5060f7",
