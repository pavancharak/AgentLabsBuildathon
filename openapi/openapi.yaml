        change since the proposal cannot point it at a private address.
        Requires, in order: a human credential, not the proposer (403
        SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE), and a step up authorization
        signed with the checker step up key for this change id and action
        approve, used once (403 STEP_UP_AUTHORIZATION_INVALID). It is the
        same step up authorization policy changes use, with the change id
        in payload.pendingPolicyChangeId.
      parameters:
        - name: id
          in: path
          required: true
          description: The changeId.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/approve-policy-change-request.schema.json"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  {
                    "stepUpAuthorization":
                      {
                        "payload":
                          {
                            "version": 1,
                            "nonce": "a11a41c1-651e-431e-82ef-5199791a6428",
                            "pendingPolicyChangeId": "1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37",
                            "action": "approve",
                            "authorizedAt": "2026-09-30T17:25:46.377Z",
                            "expiresAt": "2026-09-30T17:27:46.377Z",
                          },
                        "signature": "f7L+V1mwISUMWPZ85KqGJ2s1TaPfBiPHhwfsWjwhu2/1cSCJjP06MvgJ6eM6F01uR1T6/qT2FcHPpD/ETa+bDA==",
                        "keyId": "human-checker-step-up-key",
                        "algorithm": "ed25519",
                      },
                  }
      responses:
        "200":
          description: Approved and applied.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/external-connector-change-response.schema.json"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    {
                      "changeId": "1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37",
                      "action": "register",
                      "capability": "erp:create-invoice",
                      "endpointUrl": "https://erp.example.com/parmana/release",
                      "policy": "erp-invoice",
                      "allowedParameters": ["amount", "currency", "customerId"],
                      "timeoutMs": 10000,
                      "reason": "Finance creates invoices in the ERP through Parmana from October.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T17:25:46.316Z",
                      "status": "APPROVED",
                      "resolvedBy": "human-checker",
                      "resolvedAt": "2026-09-30T17:25:46.385Z",
                    }
                revokeApproved:
                  summary: "Real captured response, a revoke"
                  value:
                    {
                      "changeId": "d1164799-36e9-4281-878a-93d666befd42",
                      "action": "revoke",
                      "capability": "erp:create-invoice",
                      "reason": "The ERP endpoint moves to a new host.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T19:03:21.551Z",
                      "status": "APPROVED",
                      "resolvedBy": "human-checker",
                      "resolvedAt": "2026-09-30T19:03:21.554Z",
                    }
        "400":
          description: EXTERNAL_ENDPOINT_ADDRESS_REFUSED. The endpoint now resolves to an address that is not public, or does not resolve. The change stays pending; reject it or fix the DNS and approve again with a new step up authorization.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                addressChanged:
                  summary: "Real captured response, the host moved to a private address after the proposal"
                  value:
                    {
                      "error": "The endpoint host 'crm.example.com' resolves to an address that is not public (10.0.0.7).",
                      "code": "EXTERNAL_ENDPOINT_ADDRESS_REFUSED",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    {
                      "error": "External connector change '1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37' was proposed by this same caller — the proposer (maker) may not also approve or reject it (checker).",
                      "code": "SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE",
                    }
        "404":
          description: No external connector change has this id (EXTERNAL_CONNECTOR_CHANGE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    {
                      "error": "External connector change '00000000-0000-0000-0000-000000000000' not found.",
                      "code": "EXTERNAL_CONNECTOR_CHANGE_NOT_FOUND",
                    }
        "409":
          description: CONFLICT. The change is already resolved, the capability to register now has an active registration, or the capability to revoke no longer has one. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                alreadyResolved:
                  summary: "Real captured response, the same change approved twice"
                  value:
                    {
                      "error": "External connector change 'd1164799-36e9-4281-878a-93d666befd42' is already APPROVED.",
                      "code": "CONFLICT",
                    }

  /external-connectors/changes/{id}/reject:
    post:
      tags:
        - External Connectors
      summary: Reject an external connector change
      operationId: rejectExternalConnectorChange
      description: >
        Rejects an external connector change. No registration changes. The
        same checks as approve, with a step up authorization for action
        reject, and a rejectionReason.
      parameters:
        - name: id
          in: path
          required: true
          description: The changeId.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/reject-policy-change-request.schema.json"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/external-connector-change-response.schema.json"
              examples:
                rejected:
                  summary: Real captured response
                  value:
                    {
                      "changeId": "5bdbfd6a-babf-4977-b090-d561ddcee0d7",
                      "action": "revoke",
                      "capability": "erp:create-invoice",
                      "reason": "The ERP endpoint moves to a new host.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T17:25:46.418Z",
                      "status": "REJECTED",
                      "resolvedBy": "human-checker",
                      "resolvedAt": "2026-09-30T17:25:46.439Z",
                      "rejectionReason": "Keep the current endpoint until the new host is live.",
                    }
                rejectedRegister:
                  summary: "Real captured response, a register"
                  value:
                    {
                      "changeId": "1b618590-af7a-4196-8f8b-a4344873e2d6",
                      "action": "register",
                      "capability": "crm:create-lead",
                      "endpointUrl": "https://crm.example.com/parmana/release",
                      "policy": "crm-lead",
                      "allowedParameters": ["email", "company"],
                      "timeoutMs": 10000,
                      "reason": "Sales creates leads in the CRM through Parmana.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-30T19:03:21.542Z",
                      "status": "REJECTED",
                      "resolvedBy": "human-checker",
                      "resolvedAt": "2026-09-30T19:03:21.549Z",
                      "rejectionReason": "The CRM host moved inside the office network.",
                    }
        "400":
          description: rejectionReason is missing, empty, or longer than 2000 characters.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                emptyReason:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "rejectionReason is required, at most 2000 characters.",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                sameActor:
                  summary: "Real captured response, the maker rejecting their own change"
                  value:
                    {
                      "error": "External connector change 'f25d72fd-c6da-4223-b614-3658af8d02d2' was proposed by this same caller — the proposer (maker) may not also approve or reject it (checker).",
                      "code": "SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE",
                    }
        "404":
          description: No external connector change has this id (EXTERNAL_CONNECTOR_CHANGE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                unknownChange:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "External connector change '7d5f8a52-0000-4000-8000-000000000000' not found.",
                      "code": "EXTERNAL_CONNECTOR_CHANGE_NOT_FOUND",
                    }
        "409":
          description: CONFLICT. The change is already resolved.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                alreadyResolved:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "External connector change 'f25d72fd-c6da-4223-b614-3658af8d02d2' is already REJECTED.",
                      "code": "CONFLICT",
                    }

components:
  schemas:
    Error:
      $ref: "../schemas/common/error.schema.json"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Caller API key issued by scripts/generate-api-key.ts. Sent as
        Authorization: Bearer <key>. Verified against a stored SHA-256 hash
        in constant time by packages/api/src/auth/StaticKeyAuthenticator.ts.
        Required on every route not listed as exempt in this document's
        top-level description. See /api-reference/authentication.

  responses:
    Unauthorized:
      description: >-
        Missing or invalid caller credential (StaticKeyAuthenticator returned
        no identity). Real captured response, packages/api/src/middleware/caller-auth.ts.
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error.schema.json"
          examples:
            authRequired:
              summary: Real captured response, missing or invalid Authorization header
              value:
                error: authentication required
    RateLimited:
      description: >-
        The caller exceeded the per minute limit on this route
        (RATE_LIMIT_EXECUTE_PER_MINUTE, default 30 per authenticated caller,
        on /execute; RATE_LIMIT_HEALTH_PER_MINUTE, default 300 per IP address,
        on /health and /ready; RATE_LIMIT_PUBLIC_PER_MINUTE, default 60 per IP
        address, shared by the unauthenticated verify routes and /handbook).
        The request never reached the handler, so nothing was recorded or
        executed. Wait the number of seconds in the Retry-After header, then
        retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error.schema.json"
          examples:
            rateLimited:
              summary: Rate limit exceeded
              value:
                error: Rate limit exceeded. Try again later.
                code: RATE_LIMITED
    SigningUnavailable:
      description: >-
        The action was refused BEFORE it was released, so nothing was
        executed. Code SIGNING_UNAVAILABLE: the runtime could not prove it can
        sign an Execution Trust Record. Code AUDIT_UNAVAILABLE: the caller
        authentication audit trail could not be written. In both cases retry
        later with a new businessTransactionId, because the original was
        already accepted. Code CONNECTOR_NOT_REGISTERED: no connector is
        registered for the action on this deployment, usually because its
        credentials were never configured. The operator must configure the
        connector first, then retry with a new businessTransactionId. Code
        EXECUTION_INTENT_UNAVAILABLE: the signed Execution Intent for this
        transaction could not be signed and stored, so nothing was released
        (ADR-0012). Retry later with a new businessTransactionId.
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error.schema.json"
          examples:
            executionIntentUnavailable:
              summary: The signed Execution Intent could not be stored, nothing was executed (real captured response)
              value:
                error: >-
                  The signed Execution Intent for business transaction
                  '2c3cae0f-fd3c-4962-8147-83f3710a2fc9' could not be created
                  and stored; refusing to release the action. Nothing was
                  executed. Cause: new row for relation "execution_intents"
                  violates check constraint "sbx_block_intents"
                code: EXECUTION_INTENT_UNAVAILABLE
            signingUnavailable:
              summary: Evidence signing is unhealthy, nothing was executed
              value:
                error: >-
                  Evidence signing is unavailable; refusing to release the
                  action because a signed Execution Trust Record could not be
                  produced. Nothing was executed.
                code: SIGNING_UNAVAILABLE
            auditUnavailable:
              summary: The caller audit trail could not be written
              value:
                error: >-
                  Caller authentication audit trail is unavailable; refusing to
                  proceed without an audit record.
                code: AUDIT_UNAVAILABLE
            connectorNotRegistered:
              summary: No connector is registered for the action, nothing was executed
              value:
                error: >-
                  No connector is registered for capability 'paytm:refund' on
                  this deployment. Nothing was executed. The operator must
                  configure the connector.
                code: CONNECTOR_NOT_REGISTERED
