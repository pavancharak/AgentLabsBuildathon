        '400':
          description: businessTransactionId missing/malformed, or a Business Transaction trust-chain invariant failed (BusinessTransactionValidationError).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                badUuid:
                  summary: Real captured response, malformed businessTransactionId
                  value:
                    error: businessTransactionId must be a valid UUID.

        '403':
          description: >-
            transaction.authority.principalId is missing/empty, or the
            authenticated caller is not permitted to assert it:
            isPrincipalAllowed (packages/api/src/auth/isPrincipalAllowed.ts)
            requires principalId to equal the caller's own callerId when no
            allowedPrincipalIds is configured for that key, or to appear in
            allowedPrincipalIds when one is. Checked immediately after
            caller authentication, before metadata.submittedBy is
            server-set and before any Policy evaluation. Skipped entirely
            (no 403 possible) when caller authentication itself is
            disabled. Identical check on POST /transactions, live-verified
            on both routes.
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                principalNotAllowed:
                  summary: Real captured response, principalId not permitted for this caller
                  value:
                    error: Caller is not permitted to assert this authority.principalId.

        '404':
          description: >-
            transaction.policy.name/version does not match any published
            Policy (PolicyNotFoundError, thrown by PolicyRouter.load during
            Runtime execution, reachable identically from POST /transactions,
            since both share the same application.execute() pipeline).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                policyNotFound:
                  summary: Real captured response, unknown policy referenced by the transaction
                  value:
                    error: "Policy 'does-not-exist' version '9.9.9' was not found."

        '409':
          description: A Business Transaction with this businessTransactionId already exists (DuplicateBusinessTransactionError).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                duplicate:
                  summary: Real captured response
                  value:
                    error: Business Transaction 'eed2a972-1bf5-4166-8472-761f76fbf1b2' already exists.

        '500':
          description: >-
            Uncategorized failure. Covers three distinct, verified conditions:
            a policy REJECTED decision (RuntimeError, no explicit status,
            defaulting to 500, carries code RUNTIME_ERROR), no Connector
            registered for the request's action, and a structurally incomplete
            request body (a valid-UUID businessTransactionId but missing
            required nested fields, e.g. metadata).


            **Regression, re-verified this pass:** the "no Connector
            registered" case previously reached the client as a coded
            RuntimeError (`{"error":"No connector registered for action:
            <action>.","code":"RUNTIME_ERROR"}`). Live-triggered against the
            current server it no longer does. `ConnectorSdkRegistry.resolveCapability`
            (packages/connector-sdk/src/ConnectorRegistry.ts) now throws a raw,
            uncaught `Error: No connector registered for capability '<action>'.`
            that the shared error handler's `instanceof RuntimeError` check does
            not match, so it falls through to the generic 500 branch: the caller
            sees only `{"error":"Internal Server Error"}`, no code, and the real
            message and capability name are visible only in the server's own
            log. This is the same failure shape as the structurally-incomplete-body
            case below, not the previously documented one. See the
            noConnectorRegistered example, and the accompanying report: this is
            listed as a product regression to fix in
            packages/connector-sdk/execution-control, not something this docs
            pass changes in code.
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                policyRejected:
                  summary: Real captured response, policy REJECTED the transaction
                  value:
                    error: >-
                      Execution rejected: Vendor payment rejected because the
                      assessed payment risk exceeds the maximum permitted threshold.
                    code: RUNTIME_ERROR
                noConnectorRegistered:
                  summary: >-
                    Real captured response, action has no registered Connector.
                    Regression: previously a coded RuntimeError, now an uncaught
                    error collapsed into the generic 500 handler, see the
                    description above.
                  value:
                    error: Internal Server Error
                malformedBody:
                  summary: >-
                    Real captured response, valid UUID but missing required
                    nested fields (e.g. metadata); no code field, this is the
                    generic 500 handler, not a typed RuntimeError
                  value:
                    error: Internal Server Error

  /transactions:
    post:
      tags:
        - Transactions
      summary: Create (execute) a Business Transaction
      operationId: createTransaction
      description: >
        A second, independent entry point into the identical
        application.execute() pipeline as POST /execute. See
        packages/api/src/routes/transactions.ts. Constructs the Business
        Transaction identically to POST /execute: businessTransactionId must
        be a valid UUID (v1-v5) or the request fails before any persistence
        with a 400, and BusinessTransactionMapper.fromRequest rebuilds the
        transaction field by field, so status and createdAt supplied by the
        client are always ignored (Parmana assigns RECEIVED and the current
        time) and any top-level field not in the request schema is silently
