  /verify:
    post:
      tags:
        - Verification
      summary: Verify an Execution Trust Record
      operationId: verifyTransaction
      description: >
        Deterministically re-validates the complete Execution Trust Record for
        businessTransactionId: recomputed hash vs. stored hash, signature
        verification, and authorization binding on every APPROVED Execution. All
        checks always run; failures are joined into one message. Appends a new
        immutable Verification to the record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/verification-request.schema.json"
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Verification completed (status VERIFIED or FAILED, see the response schema; a 200 does not by itself mean verification succeeded).
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verification-response.schema.json"
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    verificationId: 63aac300-e0a8-47e9-9bb1-fd4b7d6cfdce
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    status: VERIFIED
                    message: Execution Trust Record verified successfully.
                    verifiedAt: "2026-07-13T17:42:11.002Z"
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f

        "400":
          description: businessTransactionId missing or not a valid UUID.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                badUuid:
                  summary: Real captured response
                  value:
                    error: businessTransactionId must be a valid UUID.

        "404":
          description: Execution Trust Record not found (VerificationFailedError, mapped through the generic RuntimeError branch, carries a code field, unlike most other 404s in this API).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED

  /verification/{businessTransactionId}:
    get:
      tags:
        - Verification
      summary: Get latest Verification
      operationId: getLatestVerification
      description: >
        Returns the most recent Verification for the Execution Trust Record
        identified by businessTransactionId. Registered from
        packages/api/src/routes/verify-get.ts, whose own internal comment
        (misleadingly) says "GET /verify/:id"; the real mounted path, per
        packages/api/src/app.ts, is /verification/:id.
      parameters:
        - name: businessTransactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Verification found.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verification-response.schema.json"
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    verificationId: 63aac300-e0a8-47e9-9bb1-fd4b7d6cfdce
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    status: VERIFIED
                    message: Execution Trust Record verified successfully.
                    verifiedAt: "2026-07-13T17:42:11.002Z"
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f

        "404":
          description: >-
            Execution Trust Record not found, OR found but has no Verification
            yet; both return this exact shape ("Execution Trust Record not
            found." / "Verification not found.", no code field, unlike POST /verify's 404).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                trustRecordNotFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.

  /refusal/verify:
    post:
      tags:
        - Refusal Records
      summary: Verify a Refusal Record's signature
      operationId: verifyRefusalRecord
      description: >
        Verifies a Refusal Record's signature (RFC-0021). Deliberately
        mounted before this app's caller-auth middleware, see
        packages/api/src/app.ts: no caller authentication or API key is
        required, by design. This is the capability that makes a refusal
        independently third-party verifiable. It takes the record itself,
        not a lookup by ID, no database access, no ownership check, nothing
        but the artifact and Parmana's public key.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/refusal-verify-request.schema.json"
      responses:
        "200":
          description: Verification completed. A 200 does not by itself mean the signature verified, see the valid field.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verify-result-response.schema.json"
              examples:
                valid:
                  summary: Real captured response
                  value:
                    valid: true
        "400":
          description: Request body is not a structurally plausible Refusal Record.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                malformed:
                  summary: Real captured response
                  value:
                    error: Request body must be a Refusal Record (refusalRecordId, businessTransactionId, decision, refusalRecordHash, signature required).

  /refusal/{businessTransactionId}:
    get:
      tags:
        - Refusal Records
      summary: Get a Refusal Record by transaction ID
      operationId: getRefusalRecord
      description: >
        Looks up a Refusal Record by businessTransactionId from Parmana's
        own storage. Unlike POST /refusal/verify, this route stays behind
        caller authentication and ownership scoping identically to
        GET /verify, GET /verification/{businessTransactionId}, and
        GET /trust-records/{businessTransactionId}: the underlying
        transaction content (signals, intent parameters) may be sensitive,
        so lookup is scoped even though independent signature verification
        (the other route) is not.
      parameters:
        - name: businessTransactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Refusal Record found.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/refusal-record-response.schema.json"
        "404":
          description: No Refusal Record exists for this businessTransactionId, or it belongs to a different caller (ownership-scoped, same 404-not-403 convention as every other scoped lookup in this API).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Refusal Record not found.

  /audit/verify:
    post:
      tags:
        - Audit
      summary: Verify a signed caller-authentication audit event
      operationId: verifyAuditEvent
      description: >
        Verifies a signed caller-authentication audit event's signature, the
        same unauthenticated, third-party-verifiable capability as
        POST /refusal/verify, over the durable caller_audit_events audit
        trail instead of Refusal Records. No database lookup involved,
        pure signature-over-bytes verification against the event and
        signature supplied in the request body. Only production
        (Supabase) audit sinks sign; in-memory test sinks never produce a
        genuinely valid signature for this route to confirm.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/audit-verify-request.schema.json"
      responses:
        "200":
          description: Verification completed. A 200 does not by itself mean the signature verified, see the valid field.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verify-result-response.schema.json"
              examples:
                invalid:
                  summary: Real captured response (this environment's in-memory audit sink never signs, so no genuinely valid signature is capturable here)
                  value:
                    valid: false
        "400":
          description: Request body is not a structurally plausible { event, signature } pair.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                malformed:
                  summary: Real captured response
                  value:
                    error: "Request body must be { event, signature } (event: type, occurredAt, route; signature: algorithm, keyId, value required)."

  /receipt:
    post:
      tags:
        - Receipts
      summary: Generate a Receipt
      operationId: generateReceipt
      description: >
        Generates a cryptographically signed Receipt for businessTransactionId.
        If no Execution Trust Record exists for businessTransactionId, this
        fails with a 404 (VerificationFailedError, the same not-found error
        used by POST /verify and POST /replay). If the record exists but its
        latest Verification does not have status VERIFIED, this fails with a
        409 (ReceiptGenerationError) instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/receipt-request.schema.json"
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Receipt generated.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/receipt-response.schema.json"
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    receiptId: ec0e71e6-e5af-4e14-8f65-13949fca9c6d
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f
                    receiptHash: d443df31a6ad94e8d9758d5143afd0859984b935f3209c35a7d93aaf8cd9f0d0
                    issuedAt: "2026-07-13T17:42:11.094Z"
