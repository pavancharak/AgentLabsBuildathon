  /replay:
    post:
      tags:
        - Replay
      summary: Replay an Execution Trust Record
      operationId: replayTransaction
      description: >
        Re-verifies the stored signature on the Execution Trust Record for
        businessTransactionId and returns its hash alongside the verification
        result. Does not re-run Policy evaluation or re-execute anything. See
        ExecutionTrustApplication.replay. When businessTransactionId does not
        correspond to any Execution Trust Record, this throws
        VerificationFailedError (the same not-found error used by POST
        /verify), which the shared error handler maps to a 404 naming the
        missing resource. See the 404 response and its notFound example.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/replay-request.schema.json"
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Replay completed.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/replay-response.schema.json"
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f
                    verified: true

        "400":
          description: businessTransactionId missing.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    error: businessTransactionId is required.

        "404":
          description: >-
            businessTransactionId does not correspond to any Execution Trust
            Record (VerificationFailedError, the same not-found error used by
            POST /verify).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED

  /policies/in-effect:
    get:
      tags:
        - Policies
      summary: Get the policy a capability's requests must declare right now
      operationId: getPolicyInEffect
      description: >
        Returns the policy bound to a capability and the version a request
        for it must declare right now. Where policy governance decides the
        version (production), it is the version most recently approved for
        the policy name, so approving a new version changes the answer with
        no deploy. An agent reads it before sending instead of writing a
        version into its code. It is the same rule POST /execute enforces,
        so a request declaring this policy passes that check; the request is
        still checked. The answer also says what a request must carry,
        without the rules: the policy's description and its signal
        requirements (every fact the rules read, their declared types, the
        facts that must equal a value of the Intent, and the facts that need
        a signed approval with what that approval names). Rule conditions
        are not returned; the description is the policy author's text. Allowed for a caller whose key may
        invoke the capability, and for human callers. See
        packages/api/src/routes/policy-in-effect.ts.
      parameters:
        - name: capability
          in: query
          required: true
          description: The capability, the Intent action, for example paytm:refund.
          schema:
            type: string
          example: "paytm:refund"
      responses:
        "200":
          description: The policy to declare.
          content:
            application/json:
              schema:
                type: object
                required:
                  - capability
                  - policy
                  - description
                  - signals
                properties:
                  capability:
                    type: string
                  policy:
                    type: object
                    required:
                      - name
                      - version
                      - schemaVersion
                    properties:
                      name:
                        type: string
                      version:
                        type: string
                      schemaVersion:
                        type: string
                  description:
                    type:
                      - string
                      - "null"
                    description: The policy author's description for people, or null.
                  signals:
                    type: object
                    description: What a request under this policy must carry.
                    required:
                      - facts
                      - schema
                      - bound
                      - approval
                    properties:
                      facts:
                        type: array
                        items:
                          type: string
                        description: Every fact the policy's rules read, sorted. Send each in the request's signals.
                      schema:
                        type: object
                        additionalProperties:
                          type: string
                        description: The declared type of each signal (boolean, number, string).
                      bound:
                        type: object
                        additionalProperties:
                          type: string
                        description: >
                          Signals that must equal a value of the Intent, as signal name to path
                          (for example refundAmount to parameters.amount). A mismatch is refused.
                      approval:
                        type: object
                        additionalProperties:
                          type: object
                          required:
                            - resourceId
                          properties:
                            resourceId:
                              type: string
                              description: Where the resource the approval names is in the request, target or a parameters path.
                            value:
                              type: string
                              description: Where the amount the approval must cover is, when there is one.
                        description: >
                          Signals that count as true only with a signed approval in
                          signals.approvalArtifact, and what that approval must name.
              examples:
                refund:
                  summary: The refund capability under customer-refund 1.2.0
                  value:
                    capability: "paytm:refund"
                    policy:
                      name: customer-refund
                      version: "1.2.0"
                      schemaVersion: "1.0.0"
                    description: "Authorizes customer refunds. Every refund above 0 and up to 100000 needs a signed manager approval for that order, covering that amount."
                    signals:
                      facts:
                        [
                          fraudCheckPassed,
                          managerApproved,
                          refundAmount,
                          refundEligible,
                        ]
                      schema:
                        refundEligible: boolean
                        managerApproved: boolean
                        fraudCheckPassed: boolean
                        refundAmount: number
                      bound:
                        refundAmount: parameters.amount
                      approval:
                        managerApproved:
                          resourceId: parameters.orderId
                          value: parameters.amount
        "400":
          description: The capability query parameter is missing.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                missingCapability:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "capability is required, for example ?capability=paytm:refund.",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The key may not invoke this capability (code CAPABILITY_NOT_ALLOWED).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                capabilityNotAllowed:
                  summary: "Real captured response, a key allowed only slack:post-message"
                  value:
                    {
                      "error": "Caller is not permitted to invoke this capability.",
                      "code": "CAPABILITY_NOT_ALLOWED",
                    }
        "404":
          description: No policy is bound to this capability (code CAPABILITY_NOT_BOUND).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                capabilityNotBound:
                  summary: "Real captured response"
                  value:
                    {
                      "error": 'No policy is bound to capability "test:fixture-execute".',
                      "code": "CAPABILITY_NOT_BOUND",
                    }
        "409":
          description: No version of the bound policy has been approved, so every request for the capability is refused (code NO_APPROVED_POLICY_VERSION).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                noApprovedVersion:
                  summary: "Real captured response"
                  value:
                    {
                      "error": 'Every request for "paytm:refund" is refused right now: no version of policy "customer-refund", which capability "paytm:refund" requires, has been approved through policy governance.',
                      "code": "NO_APPROVED_POLICY_VERSION",
                    }
        "503":
          description: The version in effect, or the policy itself, could not be read, so every request for the capability is refused meanwhile (code POLICY_VERSION_UNAVAILABLE).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                lookupFailed:
                  summary: "Real captured response, the policy version store was unreachable"
                  value:
                    {
                      "error": 'Every request for "paytm:refund" is refused right now: the version of policy "customer-refund" in effect for capability "paytm:refund" could not be looked up: database unreachable.',
                      "code": "POLICY_VERSION_UNAVAILABLE",
                    }

  /policies/validate:
    post:
      tags:
        - Policies
      summary: Validate that a Policy exists and is readable
      operationId: validatePolicy
      description: >
        Checks that policies/{policyId}/{policyVersion}/policy.json exists and
        parses. Does NOT use the shared Error envelope for its failure
        responses: every status code (200, 400, 404) returns the same
        {valid, errors} shape. Field checks run in order: policyId first, then
        policyVersion; the first missing/empty field short-circuits with its
        own message. The one exception is 401: caller authentication runs in
        middleware, before this handler is ever reached, so a rejected caller
        gets the shared Error envelope ({"error": "authentication required"}),
        not {valid, errors}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/policy-validate-request.schema.json"
            examples:
              vendor-payment:
                summary: Real captured request
                value:
                  policyId: vendor-payment
                  policyVersion: 2.0.0
              notFound:
                summary: Real captured request, unknown policy
                value:
                  policyId: does-not-exist
                  policyVersion: 9.9.9
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Policy exists and is readable.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                vendor-payment:
                  summary: Real captured response
                  value:
                    valid: true
                    errors: []

        "400":
          description: policyId or policyVersion missing/empty.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - policyVersion is required.

        "404":
          description: No policy.json exists at the requested name/version (PolicyNotFoundError, caught locally and re-shaped, not routed through the shared error handler).
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - "Policy 'does-not-exist' version '9.9.9' was not found."

  /policies/{name}/{version}/pending-changes:
    post:
      tags:
        - Policy Governance
      summary: Propose a policy change (maker)
      operationId: proposePolicyChange
      description: >
        Proposes a change to a policy's content (Policy Governance,
        maker-checker). {version} is the existing version this proposal is a
        change against ("the version being replaced"); proposedContent's own
        policyVersion may equal it (an in-place content patch) or differ (a
        version bump). Requires a human-authenticated caller
        (credentialHolderType USER); a SERVICE-credentialed or unverified
        caller is denied with 403 NON_HUMAN_CALLER_DENIED, and a signed
        caller.non_human_denied audit event is recorded. proposedContent is
        validated with the same rules POST /policies/validate checks, plus:
        proposedContent.policyId must equal {name}, and
        proposedContent.policyVersion must match ^[A-Za-z0-9._-]+$.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
        - name: version
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/propose-policy-change-request.schema.json"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Pending Policy Change created.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/pending-policy-change-response.schema.json"
              examples:
                proposed:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition: { always: true }
                          outcome:
                            {
                              action: approve,
                              reason: OpenAPI spec capture fixture,
                            }
                    proposedBy: human-maker
                    proposedAt: "2026-09-15T03:47:13.920Z"
                    status: PENDING_APPROVAL
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
        "400":
          description: name/version pattern invalid, reason missing, proposedContent malformed, or proposedContent fails Policy validation.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                missingReason:
                  summary: Real captured response
                  value:
                    error: reason is required.
        "403":
          description: Caller is not human-credentialed (NON_HUMAN_CALLER_DENIED).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                nonHuman:
                  summary: Shape, derived from NonHumanCallerDeniedError source (not independently captured in this run)
                  value:
                    error: "This action requires a caller credential provisioned as a verified human (credentialHolderType: USER)."
                    code: NON_HUMAN_CALLER_DENIED

