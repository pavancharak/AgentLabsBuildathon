  /execution-intents/verify:
    post:
      tags:
        - Execution Intents
      summary: Verify an Execution Intent's signature
      operationId: verifyExecutionIntent
      description: >
        Verifies an Execution Intent's hash and signature (ADR-0012).
        Deliberately mounted before this app's caller-auth middleware, see
        packages/api/src/app.ts: no caller authentication or API key is
        required, by design, the same as POST /refusal/verify. It takes the
        intent itself, reads no storage, and needs nothing but the artifact
        and Parmana's public key. A `valid: true` result proves the intent
        was signed by the holder of the key and has not been altered. It does
        NOT prove the action was released, or what its result was, because an
        intent is written BEFORE release. To check the outcome, look for the
        signed Execution Trust Record for the same businessTransactionId.
        For a check that needs no call to this API at all, use
        scripts/verify-execution-intent.ts with the public key from
        GET /keys/{keyId}.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/execution-intent-verify-request.schema.json"
      responses:
        "200":
          description: Verification completed. A 200 does not by itself mean the signature verified, see the valid field.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/verify-result-response.schema.json"
              examples:
                valid:
                  summary: Real captured response
                  value:
                    valid: true
                altered:
                  summary: The same intent with its target changed after signing (real captured response)
                  value:
                    valid: false
        "400":
          description: Request body is not a structurally plausible Execution Intent.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                malformed:
                  summary: Message text from the source
                  value:
                    error: Request body must be an Execution Intent (intentId, businessTransactionId, authorizationId, intentHash, signature required).
        "429":
          $ref: "#/components/responses/RateLimited"

  /execution-intents/unfinalized:
    get:
      tags:
        - Execution Intents
      summary: List Execution Intents that never reached a signed Trust Record
      operationId: listUnfinalizedExecutionIntents
      description: >
        Lists Execution Intents that never reached a signed Execution Trust
        Record and were not closed by hand, oldest first (ADR-0012). Each one
        is an action that may have been released with no signed record, or
        whose outcome nobody has reconciled yet, and needs an operator. Entries
        in state RELEASED are repaired with POST
        /execution-intents/{businessTransactionId}/finalize. Entries in state
        PREPARED or ERRORED are reconciled at the connector and then closed with
        POST /execution-intents/{businessTransactionId}/resolve, after which
        they no longer appear here. Requires a credential provisioned as a verified
        human (`credentialHolderType: USER`), because the list spans every
        caller's transactions. Any other credential gets `403` with code
        `NON_HUMAN_CALLER_DENIED`. The saved release context used to rebuild a
        record is internal and is never returned.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of intents to return. Default 50, maximum 200. A value that is not a positive integer uses the default.
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: The unfinalized intents, oldest first. May be empty.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/execution-intents-unfinalized-response.schema.json"
              examples:
