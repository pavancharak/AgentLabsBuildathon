                          "submittedBy": "operator-maker",
                          "grantedCapability": "test:fixture-execute",
                          "createdAt": "2026-10-01T10:14:05.140Z",
                          "intentHash": "6bf3d216b31f8ca056743ee847f9259acc78b5014669411b6936bffa40ea39ff",
                          "signature":
                            {
                              "algorithm": "ed25519",
