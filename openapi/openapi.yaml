      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Execution Trust pipeline completed. The Execution Trust Record reflects whatever the Decision outcome was. This status code does not by itself mean the payment was approved.
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/execution-trust-record-response.schema.json'
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    trustRecordId: 65fee934-532c-4feb-88d9-72c0cd912a81
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    transaction:
                      businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                      metadata:
                        businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                        correlationId: cc1ca975-4935-4e9a-a591-8897af6b56fb
                        sourceSystem: vendor-payment-service
                        submittedBy: ap-automation
                        submittedAt: '2026-07-13T17:36:00.835Z'
                      authority:
                        authorityId: db5c5260-bb4c-40a2-a081-2928b5fe7720
