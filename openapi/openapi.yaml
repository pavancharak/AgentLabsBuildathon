  /execution-intents/{businessTransactionId}:
    get:
      tags:
        - Execution Intents
      summary: Get an Execution Intent and its status
      operationId: getExecutionIntent
      description: >
        Returns the signed Execution Intent for a businessTransactionId and its
        operational status (ADR-0012). The state tells you where the request
        got to. PREPARED: the intent is signed and stored, and the action may
        or may not have been released. RELEASED: the release stage returned and
        the execution context was saved. FINALIZED: a signed Execution Trust
        Record exists. ERRORED: the release stage raised an error, the action
        may still have been executed. RESOLVED: a verified human reconciled a
        PREPARED or ERRORED intent at the connector and closed it (the status
        carries `resolution`, `resolutionNote`, `resolvedBy` and `resolvedAt`,
        an unsigned operator statement). Stays behind caller authentication and
        ownership scoping, identically to GET /trust-records/{businessTransactionId}
        and GET /refusal/{businessTransactionId}. Transactions created before
