openapi: 3.1.0

info:
  title: Parmana API
  version: 1.0.0
  description: >
    Parmana is an Execution Trust Infrastructure that ensures there is no gap
    between what humans decide and what AI systems do. The API enables creation,
    execution, verification, replay, and auditing of Business Transactions
    through cryptographically verifiable Execution Trust Records.


    **Every route requires a caller bearer key**, except the liveness/readiness
    probes and documentation/verification routes that must be reachable with no
    credential: GET /health, GET /ready, GET /openapi.yaml, GET /documentation,
    GET /reference, POST /refusal/verify, POST /audit/verify, GET /keys/{keyId},
    and GET /.well-known/jwks.json. Send `Authorization: Bearer <key>` on every
    other request. Keys are issued by `scripts/generate-api-key.ts` and
    configured server-side via `PARMANA_API_KEYS`; only a hash of each key is
    ever held by the server, verified in constant time. A missing or invalid
    credential returns 401 before a Business Transaction is even constructed,
    independent of Policy evaluation and gateway attestation, see
    `packages/api/src/middleware/caller-auth.ts` and
    [Authentication](/api-reference/authentication). Local development may set
    `PARMANA_AUTH_DISABLED=true` to skip this middleware entirely; that flag
    must never be set in a real deployment.

  contact:
    name: Parmana
    email: support@parmana.ai

  license:
    name: Apache-2.0
    identifier: Apache-2.0

servers:
  - url: http://localhost:3000
    description: Local (packages/api, PORT env var, default 3000)

security:
  - bearerAuth: []

tags:
  - name: Execution
    description: Executes a Business Transaction through the complete Execution Trust pipeline

  - name: Transactions
    description: Business Transaction creation and retrieval

  - name: Verification
    description: Deterministic verification of an Execution Trust Record

  - name: Receipts
    description: Cryptographically signed Execution Trust Receipts

  - name: Trust Records
    description: Execution Trust Record retrieval

  - name: Replay
    description: Deterministic replay of a recorded Execution Trust Record

  - name: Policies
    description: Policy existence/readability check

  - name: Policy Governance
    description: Maker-checker proposal, listing, approval, and rejection of policy changes

  - name: Refusal Records
    description: Durable, signed evidence that a policy decision rejected a transaction (RFC-0021)

  - name: Audit
    description: Signed caller-authentication audit events, independently third-party-verifiable

  - name: System
    description: Operational endpoints

paths:
  /:
    get:
      tags:
        - System
      summary: Root
      operationId: getRoot
      description: >
        Minimal liveness response. Not registered under any router file, defined
        directly in packages/api/src/app.ts, ahead of every mounted route.
        Requires caller authentication, like every route not listed as exempt
        in this document's top-level description. See the security scheme above.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Service is responding.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/root-response.schema.json"
              examples:
                root:
                  summary: Real captured response
                  value:
                    name: Parmana
                    status: UP

  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      description: >
        Returns the operational health of the Parmana service. Always returns
        status: "UP" unconditionally. See the response schema description for
        exactly what this endpoint does and does not check.


        One of several routes exempt from caller authentication, see the top
        of this document for the full list. Liveness probes must be able to
        reach it with no credential, see packages/api/src/app.ts (mounted
        ahead of the caller-auth middleware).
      security: []
      responses:
        "200":
          description: Service health information.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/health-response.schema.json"
              examples:
                health:
                  summary: Real captured response
                  value:
                    status: UP

  /ready:
    get:
      tags:
        - System
      summary: Readiness check
      operationId: getReady
      description: >
        Readiness probe, distinct from GET /health's pure liveness check:
        when storage is Supabase-backed, this one actually queries Postgres
        (SELECT 1, no table rows transferred) so an orchestrator can tell a
        process that is up but backed by dead storage apart from one that is
        genuinely ready to serve traffic. When storage is not Supabase-backed
        (NODE_ENV=test, or PARMANA_STORAGE=memory outside test), there is no
        external dependency to probe, so this reports READY unconditionally.
        Exempt from caller authentication for the same reason GET /health is,
        see packages/api/src/routes/ready.ts.
      security: []
      responses:
        "200":
          description: Storage reachable, or not Supabase-backed.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/ready-response.schema.json"
              examples:
                authEnabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: false
                authDisabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: true
                    warning: "PARMANA_AUTH_DISABLED=true -- this deployment is accepting requests with no caller authentication. Must never be set in a real deployment."
        "503":
          description: Supabase-backed storage is configured but Postgres could not be reached. Shape derived from packages/api/src/routes/ready.ts's catch branch, not independently reproducible outside a real Supabase-backed deployment.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/ready-response.schema.json"
              examples:
                notReady:
                  summary: Shape, not a live capture
                  value:
                    status: NOT_READY
                    reason: "connect ECONNREFUSED 127.0.0.1:5432"
                    authDisabled: false

  /openapi.yaml:
    get:
      tags:
        - System
      summary: Get the OpenAPI spec
      operationId: getOpenApiSpec
      description: >
        Serves the bundled, self-contained OpenAPI document
        (openapi/openapi.bundled.yaml, produced by `npm run bundle:openapi`
        from openapi/openapi.yaml + schemas/*.json) as a static file, see
        packages/api/src/routes/openapi.ts. Exempt from caller authentication
        for the same reason GET /health is: a caller cannot discover how to
        get a key from a spec it isn't allowed to read. See [Deploy
        patterns](/guides/deploy-patterns#the-openapi-spec-endpoint) for the
        tradeoff of exposing this in production versus disabling it.
      security: []
      responses:
        "200":
          description: The complete OpenAPI 3.1 document, YAML, self-contained (no external $ref).
          content:
            application/yaml:
              schema:
                type: string

  /version:
    get:
      tags:
        - System
      summary: Service version
      operationId: getVersion
      description: >
        Returns hardcoded deployment identifiers. See the response schema
        description: these three literals are not read from package.json,
        environment variables, or build metadata. Requires caller
        authentication, like every route not listed as exempt in this
        document's top-level description.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Service version information.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/version-response.schema.json"
              examples:
                version:
                  summary: Real captured response
                  value:
                    name: Parmana
                    version: 0.4.0
                    api: v1

  /keys/{keyId}:
    get:
      tags:
        - System
      summary: Fetch a public signing key for independent, offline verification
      operationId: getKey
      description: >
        Deliberately unauthenticated, like GET /audit/verify and GET
        /refusal/verify. A third party (regulator, auditor, customer tool)
        fetching the key it needs to independently verify a signature cannot
        be required to already hold a Parmana credential to reach it. Returns
        the current or any still-retained historical key's public half; a
        keyId whose private key was rotated away from is still resolvable
        here as long as its files were not deleted. See
        packages/crypto/src/OfflineVerifier.ts
        (and its Python counterpart, python/parmana/crypto/
        offline_verifier.py) for a reference verifier that consumes exactly
        this response's `pem` field with zero further network calls.
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "404":
          description: No key exists for the given keyId.
        "200":
          description: The requested public key.
          content:
            application/json:
              schema:
                type: object
                required: [keyId, algorithm, use, pem]
                properties:
                  keyId:
                    type: string
                  algorithm:
                    type: string
                    description: >
                      The key's actual algorithm, derived from the key
                      material itself (asymmetricKeyType), not a global
                      config value.
                  use:
                    type: string
                    enum: [sig]
                  pem:
                    type: string
                    description: PEM-encoded SPKI public key (RFC 7468).
                  jwk:
                    type: object
                    description: >
                      Node's native JWK export for this key's algorithm, when
                      available. Ed25519 exports as kty "OKP"; ML-DSA-65
                      exports as kty "AKP" (the IETF JOSE/COSE key type for
                      ML-DSA, not an identifier this codebase invented).
                      Omitted, not null, when unavailable.

  /.well-known/jwks.json:
    get:
      tags:
        - System
      summary: List every public signing key this deployment can currently produce
      operationId: getJwks
      description: >
        Same unauthenticated, third-party-verification purpose as GET
        /keys/{keyId}, this is the enumeration form. Not a standards-pure
        RFC 7517 JWK Set (not every entry necessarily has a `jwk` field), but
        a superset any consumer that only wants `.jwk` per entry can filter
        down to.
      responses:
        "200":
          description: Every key this deployment can currently produce a public key for.
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required: [keyId, algorithm, use, pem]
                      properties:
                        keyId:
                          type: string
                        algorithm:
                          type: string
                        use:
                          type: string
                          enum: [sig]
                        pem:
                          type: string
                        jwk:
                          type: object

  /callers/me:
    get:
      tags:
        - System
      summary: Get the authenticated caller's identity and resolved scope
      operationId: getCallerMe
      description: >
        The proof artifact a security review asks for: "show me this agent's
        identity and exactly what it's authorized to do." Read-only,
        self-lookup only, an authenticated caller sees its own record, never
        another caller's, and this never returns key material. Values are
        resolved (the effective scope after defaults are applied), not the
        raw configured entry: allowedPrincipalIds defaults to [callerId] and
        allowedCapabilities defaults to an empty array when unset on the key,
        see packages/api/src/routes/callers-me.ts. Requires caller
        authentication, like every route not listed as exempt in this
        document's top-level description.


        Returns 404 with {"error":"No authenticated caller identity
        available."} when no caller identity is present on the request, which
        in practice only happens when caller authentication is disabled
        (PARMANA_AUTH_DISABLED=true, local development only). Under normal,
        authenticated operation this route always has a callerId by the time
        it runs.
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No authenticated caller identity on the request (caller auth disabled).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                noCallerIdentity:
                  summary: Real captured response when caller-auth is disabled
                  value:
                    error: No authenticated caller identity available.
        "200":
          description: The authenticated caller's identity and resolved scope.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/callers-me-response.schema.json"
              examples:
                callerMe:
                  summary: Real captured response
                  value:
                    callerId: demo
                    allowedPrincipalIds:
                      - demo
                    allowedCapabilities:
                      - "test:fixture-execute"
                    unrestrictedCapabilities: false

  /execute:
    post:
      tags:
        - Execution
      summary: Execute a Business Transaction
      operationId: executeTransaction
      description: >
        Runs the complete Execution Trust pipeline synchronously: accepts the
        Business Transaction, executes it through the Runtime, verifies the
        resulting Execution Trust Record, generates a Receipt, then returns the
        complete, updated Execution Trust Record. businessTransactionId must be
        a valid UUID (v1-v5) or the request fails before any persistence with a
        400. See BusinessTransactionMapper.fromRequest and
        isValidBusinessTransactionId in packages/api/src/routes/execute.ts.
        The mapper reconstructs the transaction field by field, so status and
        createdAt supplied by the client are always ignored (Parmana assigns
        RECEIVED and the current time), and any top-level field not in the
        request schema is silently dropped. POST /transactions applies the
        identical UUID check and mapper. See that endpoint below.


        If Policy evaluation REJECTs the transaction, this endpoint currently
        responds 500 with a RUNTIME_ERROR-coded error envelope naming the
        rejection reason. See the 500 response below and the executeRejected
        example. This is real, observed behavior, not a designed contract; it is
        documented here because the spec must describe the API as implemented.


        `hubspot:deal-update` and `hubspot:deal-fetch` are the real,
        currently-registered capabilities reachable through this same
        endpoint by this capability-based routing mechanism today.
        Registration is conditional on `HUBSPOT_PRIVATE_APP_TOKEN` being
        configured; if it is not, the connector is never registered and this
        action falls into the "no Connector registered" case documented
        under 500 below. See
        packages/api/tests/integration/hubspot-deal-update.integration.test.ts
        for the executable, real-request proof of the hubspot flow.


        **`payments:execute` (`vendor-payment`), shown in the
        vendor-payment-flow example below, was removed from the repository
        entirely.** That example is a real request/response pair captured before the
        removal; resubmitting it against a current server no longer produces
        the shown APPROVED result; it falls into the "no Connector
        registered" case instead, since no connector (production or test)
        registers `payments:execute` any longer. It is retained here as a
        real, historical illustration of the response shape, not as a
        currently-runnable example. The `vendor-payment/2.0.0` policy file
        itself is unaffected and still loads (see PolicyValidate below); only
        the connector that would have executed against it is gone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/transaction-create-request.schema.json"
            examples:
              test-fixture-flow:
                summary:
                  Real captured request, currently runnable (test:fixture-execute,
                  the generic NODE_ENV=test-only capability, APPROVED). Click Try It with
