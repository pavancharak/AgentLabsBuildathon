  /verify:
    post:
      tags:
        - Verification
      summary: Verify an Execution Trust Record
      operationId: verifyTransaction
      description: >
        Deterministically re-validates the complete Execution Trust Record for
        businessTransactionId: recomputed hash vs. stored hash, signature
        verification, and authorization binding on every APPROVED Execution. All
        checks always run; failures are joined into one message. Appends a new
        immutable Verification to the record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/requests/verification-request.schema.json'
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Verification completed (status VERIFIED or FAILED, see the response schema; a 200 does not by itself mean verification succeeded).
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/verification-response.schema.json'
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    verificationId: 63aac300-e0a8-47e9-9bb1-fd4b7d6cfdce
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    status: VERIFIED
                    message: Execution Trust Record verified successfully.
                    verifiedAt: '2026-07-13T17:42:11.002Z'
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f

        '400':
          description: businessTransactionId missing or not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                badUuid:
                  summary: Real captured response
                  value:
                    error: businessTransactionId must be a valid UUID.

        '404':
          description: Execution Trust Record not found (VerificationFailedError, mapped through the generic RuntimeError branch, carries a code field, unlike most other 404s in this API).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED

  /verification/{businessTransactionId}:
    get:
      tags:
        - Verification
      summary: Get latest Verification
      operationId: getLatestVerification
      description: >
        Returns the most recent Verification for the Execution Trust Record
        identified by businessTransactionId. Registered from
        packages/api/src/routes/verify-get.ts, whose own internal comment
        (misleadingly) says "GET /verify/:id"; the real mounted path, per
        packages/api/src/app.ts, is /verification/:id.
      parameters:
        - name: businessTransactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Verification found.
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/verification-response.schema.json'
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    verificationId: 63aac300-e0a8-47e9-9bb1-fd4b7d6cfdce
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    status: VERIFIED
                    message: Execution Trust Record verified successfully.
                    verifiedAt: '2026-07-13T17:42:11.002Z'
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f

        '404':
          description: >-
            Execution Trust Record not found, OR found but has no Verification
            yet; both return this exact shape ("Execution Trust Record not
            found." / "Verification not found.", no code field, unlike POST /verify's 404).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                trustRecordNotFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.

  /receipt:
    post:
      tags:
        - Receipts
      summary: Generate a Receipt
      operationId: generateReceipt
      description: >
        Generates a cryptographically signed Receipt for businessTransactionId.
        If no Execution Trust Record exists for businessTransactionId, this
        fails with a 404 (VerificationFailedError, the same not-found error
        used by POST /verify and POST /replay). If the record exists but its
        latest Verification does not have status VERIFIED, this fails with a
        409 (ReceiptGenerationError) instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/requests/receipt-request.schema.json'
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Receipt generated.
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/receipt-response.schema.json'
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    receiptId: ec0e71e6-e5af-4e14-8f65-13949fca9c6d
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f
                    receiptHash: d443df31a6ad94e8d9758d5143afd0859984b935f3209c35a7d93aaf8cd9f0d0
                    issuedAt: '2026-07-13T17:42:11.094Z'
                    algorithm: ed25519
                    signature: uchgXRFJnByGu3F+NZSoq1Hwt6bBr3rRJjQGpLOULKJ7jR4NfE/P4g7loD4L5aADdYxUqLh6Yn7ngfnz2peCCA==

        '400':
          description: businessTransactionId missing or not a valid UUID.
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                badUuid:
                  summary: Real captured response
                  value:
                    error: businessTransactionId must be a valid UUID.

        '404':
          description: >-
            businessTransactionId does not correspond to any Execution Trust
            Record (VerificationFailedError, the same not-found error used by
            POST /verify and POST /replay).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED

        '409':
          description: >-
            The Execution Trust Record exists but its latest Verification
            does not have status VERIFIED (ReceiptGenerationError).
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                notYetVerified:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record must be successfully verified before a Receipt can be generated.
                    code: RECEIPT_GENERATION_FAILED

  /receipt/latest/{businessTransactionId}:
    get:
      tags:
        - Receipts
      summary: Get latest Receipt
      operationId: getLatestReceipt
      description: >
        Returns the most recent Receipt for the Execution Trust Record
        identified by businessTransactionId. Registered from
        packages/api/src/routes/receipt-get.ts, whose own internal comment
        (misleadingly) says "GET /receipt/:id"; the real mounted path, per
        packages/api/src/app.ts, is /receipt/latest/:id.
      parameters:
        - name: businessTransactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Receipt found.
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/receipt-response.schema.json'
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    receiptId: ec0e71e6-e5af-4e14-8f65-13949fca9c6d
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f
                    receiptHash: d443df31a6ad94e8d9758d5143afd0859984b935f3209c35a7d93aaf8cd9f0d0
                    issuedAt: '2026-07-13T17:42:11.094Z'
                    algorithm: ed25519
                    signature: uchgXRFJnByGu3F+NZSoq1Hwt6bBr3rRJjQGpLOULKJ7jR4NfE/P4g7loD4L5aADdYxUqLh6Yn7ngfnz2peCCA==

        '404':
          description: >-
            Execution Trust Record not found, OR found but has no Receipt yet;
            both return this exact shape ("Execution Trust Record not found."
            / "Receipt not found.").
          content:
            application/json:
              schema:
                $ref: '../schemas/common/error.schema.json'
              examples:
                trustRecordNotFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.

  /trust-records:
    get:
      tags:
        - Trust Records
      summary: Bulk-export Execution Trust Records (compliance/audit)
      operationId: listTrustRecords
      description: >
        Returns the full, signed Execution Trust Record (transaction,
        executions, verifications, receipts, authorization) for every
        transaction on the requested page -- the periodic full-export
        capability for external audit/compliance review, distinct from
        GET /trust-records/{businessTransactionId} (single-record
        lookup) and GET /transactions (raw Business Transaction only,
        no execution/verification/receipt history). Scoping and
        pagination mirror GET /transactions exactly: an authenticated
        caller sees only transactions they submitted, page/pageSize
        page over the same storage-provider listing GET /transactions
        uses, and the response is a bare array with no pagination
        metadata. since/until (ISO 8601) additionally filter by
        transaction.createdAt for a bounded date-range export.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 25
        - name: since
          in: query
          required: false
          description: Only include records whose transaction.createdAt is on or after this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          required: false
          description: Only include records whose transaction.createdAt is on or before this ISO 8601 timestamp.
          schema:
            type: string
            format: date-time
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Every Execution Trust Record on the requested page (after ownership and date-range filtering).
          content:
            application/json:
              schema:
                $ref: '../schemas/responses/trust-records-list-response.schema.json'

