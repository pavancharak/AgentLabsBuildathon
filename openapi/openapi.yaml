  /replay:
    post:
      tags:
        - Replay
      summary: Replay an Execution Trust Record
      operationId: replayTransaction
      description: >
        Re-verifies the stored signature on the Execution Trust Record for
        businessTransactionId and returns its hash alongside the verification
        result. Does not re-run Policy evaluation or re-execute anything. See
        ExecutionTrustApplication.replay. When businessTransactionId does not
        correspond to any Execution Trust Record, this throws
        VerificationFailedError (the same not-found error used by POST
        /verify), which the shared error handler maps to a 404 naming the
        missing resource. See the 404 response and its notFound example.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/replay-request.schema.json"
            examples:
              vendor-payment-flow:
                summary: Real captured request
                value:
                  businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Replay completed.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/replay-response.schema.json"
              examples:
                vendor-payment-flow:
                  summary: Real captured response
                  value:
                    businessTransactionId: 44b34a79-e0f2-49d7-a48e-e52fff88182e
                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f
                    verified: true

        "400":
          description: businessTransactionId missing.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    error: businessTransactionId is required.

        "404":
          description: >-
            businessTransactionId does not correspond to any Execution Trust
            Record (VerificationFailedError, the same not-found error used by
            POST /verify).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED

  /policies/validate:
    post:
      tags:
        - Policies
      summary: Validate that a Policy exists and is readable
      operationId: validatePolicy
      description: >
        Checks that policies/{policyId}/{policyVersion}/policy.json exists and
        parses. Does NOT use the shared Error envelope for its failure
        responses: every status code (200, 400, 404) returns the same
        {valid, errors} shape. Field checks run in order: policyId first, then
        policyVersion; the first missing/empty field short-circuits with its
        own message. The one exception is 401: caller authentication runs in
        middleware, before this handler is ever reached, so a rejected caller
        gets the shared Error envelope ({"error": "authentication required"}),
        not {valid, errors}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/policy-validate-request.schema.json"
            examples:
              vendor-payment:
                summary: Real captured request
                value:
                  policyId: vendor-payment
                  policyVersion: 2.0.0
              notFound:
                summary: Real captured request, unknown policy
                value:
                  policyId: does-not-exist
                  policyVersion: 9.9.9
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Policy exists and is readable.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                vendor-payment:
                  summary: Real captured response
                  value:
                    valid: true
                    errors: []

        "400":
          description: policyId or policyVersion missing/empty.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - policyVersion is required.

        "404":
          description: No policy.json exists at the requested name/version (PolicyNotFoundError, caught locally and re-shaped, not routed through the shared error handler).
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/policy-validate-response.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - "Policy 'does-not-exist' version '9.9.9' was not found."

  /policies/{name}/{version}/pending-changes:
    post:
      tags:
        - Policy Governance
      summary: Propose a policy change (maker)
      operationId: proposePolicyChange
      description: >
        Proposes a change to a policy's content (Policy Governance,
        maker-checker). {version} is the existing version this proposal is a
        change against ("the version being replaced"); proposedContent's own
        policyVersion may equal it (an in-place content patch) or differ (a
        version bump). Requires a human-authenticated caller
        (credentialHolderType USER); a SERVICE-credentialed or unverified
        caller is denied with 403 NON_HUMAN_CALLER_DENIED, and a signed
        caller.non_human_denied audit event is recorded. proposedContent is
        validated with the same rules POST /policies/validate checks, plus:
        proposedContent.policyId must equal {name}, and
        proposedContent.policyVersion must match ^[A-Za-z0-9._-]+$.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
        - name: version
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]+$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/propose-policy-change-request.schema.json"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "201":
          description: Pending Policy Change created.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/pending-policy-change-response.schema.json"
              examples:
                proposed:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition: { always: true }
                          outcome:
                            {
                              action: approve,
                              reason: OpenAPI spec capture fixture,
                            }
                    proposedBy: human-maker
                    proposedAt: "2026-09-15T03:47:13.920Z"
                    status: PENDING_APPROVAL
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
        "400":
          description: name/version pattern invalid, reason missing, proposedContent malformed, or proposedContent fails Policy validation.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                missingReason:
                  summary: Real captured response
                  value:
                    error: reason is required.
        "403":
          description: Caller is not human-credentialed (NON_HUMAN_CALLER_DENIED).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                nonHuman:
                  summary: Shape, derived from NonHumanCallerDeniedError source (not independently captured in this run)
                  value:
                    error: "This action requires a caller credential provisioned as a verified human (credentialHolderType: USER)."
                    code: NON_HUMAN_CALLER_DENIED

  /policies/pending-changes:
    get:
      tags:
        - Policy Governance
      summary: List pending policy changes (maker-checker)
      operationId: listPendingPolicyChanges
      description: >
        Lists Pending Policy Changes, each alongside a diff view: current
        (the live content at (policyName, policyVersion) today, or null if
        that version has never been published) and proposed (the change's
        own proposedContent). Requires a human-authenticated caller, the
        same discipline as POST .../pending-changes.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING_APPROVAL, APPROVED, REJECTED]
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Pending Policy Changes, with diff.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/pending-changes-list-response.schema.json"
              examples:
                oneOpen:
                  summary: Real captured response
                  value:
                    changes:
                      - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                        policyName: openapi-capture-demo
                        policyVersion: 1.0.0
                        proposedContent:
                          policyId: openapi-capture-demo
                          policyVersion: 1.0.0
                          schemaVersion: 1.0.0
                          rules:
                            - id: always-approve
                              condition: { always: true }
                              outcome:
                                {
                                  action: approve,
                                  reason: OpenAPI spec capture fixture,
                                }
                        proposedBy: human-maker
                        proposedAt: "2026-09-15T03:47:13.920Z"
                        status: PENDING_APPROVAL
                        reason: Capture a real Pending Policy Change for the OpenAPI spec
                        diff:
                          current: null
                          proposed:
                            policyId: openapi-capture-demo
                            policyVersion: 1.0.0
                            schemaVersion: 1.0.0
                            rules:
                              - id: always-approve
                                condition: { always: true }
                                outcome:
                                  {
                                    action: approve,
                                    reason: OpenAPI spec capture fixture,
                                  }
        "400":
          description: status query param is not one of PENDING_APPROVAL, APPROVED, REJECTED.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
        "403":
          description: Caller is not human-credentialed (NON_HUMAN_CALLER_DENIED).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"

  /policies/pending-changes/{id}/approve:
    post:
      tags:
        - Policy Governance
      summary: Approve a pending policy change (checker)
      operationId: approvePolicyChange
      description: >
        Approves a Pending Policy Change (checker). Requires, in order, all
        fail-closed: a human-authenticated caller distinct from the proposer
        (maker != checker, 403 SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
        otherwise), and a valid step-up authorization envelope proving fresh,
        explicit intent (403 STEP_UP_AUTHORIZATION_INVALID on a missing,
        malformed, expired, replayed, wrong-id, wrong-action, or
        wrong-key-signed envelope). Once both pass, this writes the live
        policies/{policyName}/{policyVersion}/policy.json file and records a
        signed PolicyChangeApprovalRecord BEFORE marking the change APPROVED,
        so a failure partway through never leaves a pending change falsely
        resolved with no corresponding live effect. Per-check step-up
        diagnostic detail is logged server-side only, never in this response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/approve-policy-change-request.schema.json"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Approved. The live policy.json file has been written.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/pending-policy-change-response.schema.json"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition: { always: true }
                          outcome:
                            {
                              action: approve,
                              reason: OpenAPI spec capture fixture,
                            }
                    proposedBy: human-maker
                    proposedAt: "2026-09-15T03:47:13.920Z"
                    status: APPROVED
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
                    resolvedBy: human-checker
                    resolvedAt: "2026-09-15T03:48:03.586Z"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: "Pending Policy Change '307d8265-1171-49a4-b13f-fc3d3ae323e3' was proposed by this same caller — the proposer (maker) may not also approve or reject it (checker)."
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
                stepUpInvalid:
                  summary: Real captured response
                  value:
                    error: The step-up authorization envelope is missing, invalid, expired, replayed, or does not match this request.
                    code: STEP_UP_AUTHORIZATION_INVALID
        "404":
          description: No Pending Policy Change exists for this id.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: "Pending Policy Change '00000000-0000-0000-0000-000000000000' not found."
                    code: PENDING_POLICY_CHANGE_NOT_FOUND
        "500":
          description: Server misconfigured, no PolicyChangeApprovalService provided. Fails closed, never marks the change APPROVED without applying its live effect.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"

  /policies/pending-changes/{id}/reject:
    post:
      tags:
        - Policy Governance
      summary: Reject a pending policy change (checker)
      operationId: rejectPolicyChange
      description: >
        Rejects a Pending Policy Change (checker). Same discipline as
        approve (human, maker != checker, step-up authorization), but never
        touches the live policy file, a rejection is purely a repository
        state transition with no PolicyChangeApprovalRecord of its own.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/reject-policy-change-request.schema.json"
      responses:
        "401":
          $ref: "#/components/responses/Unauthorized"
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/pending-policy-change-response.schema.json"
              examples:
                rejected:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 5617ba3c-fb07-437d-9131-232b84bbb863
                    policyName: openapi-capture-demo-reject
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo-reject
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition: { always: true }
                          outcome:
                            {
                              action: approve,
                              reason: OpenAPI spec capture fixture,
                            }
                    proposedBy: human-maker
                    proposedAt: "2026-09-15T03:48:09.512Z"
                    status: REJECTED
                    reason: Capture a real rejected Pending Policy Change for the OpenAPI spec
                    resolvedBy: human-checker
                    resolvedAt: "2026-09-15T03:48:21.422Z"
                    rejectionReason: Does not meet the bar for this fixture
        "400":
          description: rejectionReason missing or empty.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
        "404":
          description: No Pending Policy Change exists for this id.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"

components:
  schemas:
    Error:
      $ref: "../schemas/common/error.schema.json"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Caller API key issued by scripts/generate-api-key.ts. Sent as
        Authorization: Bearer <key>. Verified against a stored SHA-256 hash
        in constant time by packages/api/src/auth/StaticKeyAuthenticator.ts.
        Required on every route not listed as exempt in this document's
        top-level description. See /api-reference/authentication.

  responses:
    Unauthorized:
      description: >-
        Missing or invalid caller credential (StaticKeyAuthenticator returned
        no identity). Real captured response, packages/api/src/middleware/caller-auth.ts.
      content:
        application/json:
          schema:
            $ref: "../schemas/common/error.schema.json"
          examples:
            authRequired:
              summary: Real captured response, missing or invalid Authorization header
              value:
                error: authentication required
