  /approval-issuers/changes/{id}/approve:
    post:
      tags:
        - Approvers
      summary: Approve an approver change
      operationId: approveApprovalIssuerChange
      description: >
        Approves an approver change and applies it in one step: add trusts
        the key from the next approval checked, revoke refuses every
        approval the key ever signed from the next request on. Requires, in
        order: a human credential, not the proposer (403
        SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE), and a step up authorization
        signed with the checker step up key for this change id and action
        approve, used once (403 STEP_UP_AUTHORIZATION_INVALID). It is the
        same step up authorization policy changes use, with the change id
        in payload.pendingPolicyChangeId.
      parameters:
        - name: id
          in: path
          required: true
          description: The changeId.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "../schemas/requests/approve-policy-change-request.schema.json"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  {
                    "stepUpAuthorization":
                      {
                        "payload":
                          {
                            "version": 1,
                            "nonce": "0b6081da-cd57-4519-ae36-71eb1bb62432",
                            "pendingPolicyChangeId": "ba7c5827-5844-4069-94fc-9b438ef08f78",
                            "action": "approve",
                            "authorizedAt": "2026-09-28T19:05:59.733Z",
                            "expiresAt": "2026-09-28T19:07:59.733Z",
                          },
                        "signature": "Nv94Q62/g4IQ0zFxDqF621Stz+JBy/4KOvLJ9+RfJO8xMw6hw06X4gzdDNEh2DxJt9xmL7VTF9TxDd9s9qmkCg==",
                        "keyId": "human-checker-step-up-key",
                        "algorithm": "ed25519",
                      },
                  }
      responses:
        "200":
          description: Approved and applied.
          content:
            application/json:
              schema:
                $ref: "../schemas/responses/approval-issuer-change-response.schema.json"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    {
                      "changeId": "ba7c5827-5844-4069-94fc-9b438ef08f78",
                      "action": "add",
                      "approverId": "manager-priya",
                      "keyId": "manager-priya-key-1",
                      "publicKeyPem": "-----BEGIN PUBLIC KEY-----\nMCowBQYDK2VwAyEAEDuWHf+bbRY7J/Mr0RVmAKYHH5CDijTWhdnISXWLD6Y=\n-----END PUBLIC KEY-----\n",
                      "reason": "Priya approves refunds for the West region from October.",
                      "proposedBy": "human-maker",
                      "proposedAt": "2026-09-28T19:05:59.726Z",
                      "status": "APPROVED",
                      "resolvedBy": "human-checker",
                      "resolvedAt": "2026-09-28T19:05:59.738Z",
                    }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    {
                      "error": "Approver change 'ba7c5827-5844-4069-94fc-9b438ef08f78' was proposed by this same caller — the proposer (maker) may not also approve or reject it (checker).",
                      "code": "SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE",
                    }
                stepUpReused:
                  summary: Real captured response, the same step up sent twice
                  value:
                    {
                      "error": "The step-up authorization envelope is missing, invalid, expired, replayed, or does not match this request.",
                      "code": "STEP_UP_AUTHORIZATION_INVALID",
                    }
        "404":
          description: No approver change has this id (APPROVAL_ISSUER_CHANGE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    {
                      "error": "Approver change '00000000-0000-0000-0000-000000000000' not found.",
                      "code": "APPROVAL_ISSUER_CHANGE_NOT_FOUND",
                    }
        "409":
          description: CONFLICT. The change is already resolved, the key to add now exists, or the key to revoke is no longer active. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "../schemas/common/error.schema.json"
              examples:
                alreadyApproved:
                  summary: "Real captured response"
                  value:
                    {
                      "error": "Approver change 'e0292192-c75b-45eb-89e2-c14bae0f8751' is already APPROVED.",
                      "code": "CONFLICT",
                    }

