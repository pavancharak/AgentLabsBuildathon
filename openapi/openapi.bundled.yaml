    post:
      tags:
        - Policy Governance
      summary: Approve a pending policy change (checker)
      operationId: approvePolicyChange
      description: >
        Approves a Pending Policy Change (checker). Requires, in order, all
        fail-closed: a human-authenticated caller distinct from the proposer
        (maker != checker, 403 SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE otherwise),
        and a valid step-up authorization envelope proving fresh, explicit
        intent (403 STEP_UP_AUTHORIZATION_INVALID on a missing, malformed,
        expired, replayed, wrong-id, wrong-action, or wrong-key-signed
        envelope). Once both pass, this writes the live
        policies/{policyName}/{policyVersion}/policy.json file and records a
        signed PolicyChangeApprovalRecord BEFORE marking the change APPROVED, so
        a failure partway through never leaves a pending change falsely resolved
        with no corresponding live effect. Per-check step-up diagnostic detail
        is logged server-side only, never in this response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
      responses:
        "200":
          description: Approved. The live policy.json file has been written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pending-policy-change.schema"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition:
                            always: true
                          outcome:
                            action: approve
                            reason: OpenAPI spec capture fixture
                    proposedBy: human-maker
                    proposedAt: 2026-09-15T03:47:13.920Z
                    status: APPROVED
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
                    resolvedBy: human-checker
                    resolvedAt: 2026-09-15T03:48:03.586Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or
            STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: Pending Policy Change '307d8265-1171-49a4-b13f-fc3d3ae323e3' was proposed
                      by this same caller — the proposer (maker) may not also
                      approve or reject it (checker).
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
                stepUpInvalid:
                  summary: Real captured response
                  value:
                    error: The step-up authorization envelope is missing, invalid, expired,
                      replayed, or does not match this request.
                    code: STEP_UP_AUTHORIZATION_INVALID
        "404":
          description: No Pending Policy Change exists for this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Pending Policy Change '00000000-0000-0000-0000-000000000000' not found.
                    code: PENDING_POLICY_CHANGE_NOT_FOUND
        "500":
          description: Server misconfigured, no PolicyChangeApprovalService provided.
            Fails closed, never marks the change APPROVED without applying its
            live effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                misconfigured:
                  summary: Real captured response, a deployment with no
                    PolicyChangeApprovalService
                  value:
                    error: Internal Server Error
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            # Sign the step up authorization on your own machine first:
            #   npx tsx scripts/sign-policy-change-step-up.ts --private-key-file step-up.private.pem \
            #     --key-id checker-step-up-1 --pending-policy-change-id ba7c5827-5844-4069-94fc-9b438ef08f78 --action approve > step-up.json
            curl -X POST https://parmana-api-real.vercel.app/policies/pending-changes/ba7c5827-5844-4069-94fc-9b438ef08f78/approve \
              -H "Authorization: Bearer $PARMANA_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"stepUpAuthorization\": $(cat step-up.json)}"
        - lang: typescript
          label: TypeScript
          source: >-
            import { ParmanaClient, signPolicyChangeStepUp } from
            "@parmana/sdk";

            import { readFileSync } from "node:fs";


            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });


            const stepUp = signPolicyChangeStepUp({
              pendingPolicyChangeId: "ba7c5827-5844-4069-94fc-9b438ef08f78",
              action: "approve",
