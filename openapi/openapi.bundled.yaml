  /external-connectors/changes/{id}/approve:
    post:
      tags:
        - External Connectors
      summary: Approve an external connector change
      operationId: approveExternalConnectorChange
      description: >
        Approves an external connector change and applies it in one step:
        register makes the registration active, revoke ends it. For a register,
        the endpoint's address is checked again first, so a DNS change since the
        proposal cannot point it at a private address. Requires, in order: a
        human credential, not the proposer (403
        SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE), and a step up authorization
        signed with the checker step up key for this change id and action
        approve, used once (403 STEP_UP_AUTHORIZATION_INVALID). It is the same
        step up authorization policy changes use, with the change id in
        payload.pendingPolicyChangeId.
      parameters:
        - name: id
          in: path
          required: true
          description: The changeId.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  stepUpAuthorization:
                    payload:
                      version: 1
                      nonce: a11a41c1-651e-431e-82ef-5199791a6428
                      pendingPolicyChangeId: 1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37
                      action: approve
                      authorizedAt: 2026-09-30T17:25:46.377Z
                      expiresAt: 2026-09-30T17:27:46.377Z
                    signature: f7L+V1mwISUMWPZ85KqGJ2s1TaPfBiPHhwfsWjwhu2/1cSCJjP06MvgJ6eM6F01uR1T6/qT2FcHPpD/ETa+bDA==
                    keyId: human-checker-step-up-key
                    algorithm: ed25519
      responses:
        "200":
          description: Approved and applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/external-connector-change.schema"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    changeId: 1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37
                    action: register
                    capability: erp:create-invoice
                    endpointUrl: https://erp.example.com/parmana/release
                    policy: erp-invoice
                    allowedParameters:
                      - amount
                      - currency
                      - customerId
                    timeoutMs: 10000
                    reason: Finance creates invoices in the ERP through Parmana from October.
                    proposedBy: human-maker
                    proposedAt: 2026-09-30T17:25:46.316Z
                    status: APPROVED
                    resolvedBy: human-checker
                    resolvedAt: 2026-09-30T17:25:46.385Z
                revokeApproved:
                  summary: Real captured response, a revoke
                  value:
                    changeId: d1164799-36e9-4281-878a-93d666befd42
                    action: revoke
                    capability: erp:create-invoice
                    reason: The ERP endpoint moves to a new host.
                    proposedBy: human-maker
                    proposedAt: 2026-09-30T19:03:21.551Z
                    status: APPROVED
                    resolvedBy: human-checker
                    resolvedAt: 2026-09-30T19:03:21.554Z
        "400":
          description: EXTERNAL_ENDPOINT_ADDRESS_REFUSED. The endpoint now resolves to an
            address that is not public, or does not resolve. The change stays
            pending; reject it or fix the DNS and approve again with a new step
            up authorization.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                addressChanged:
                  summary: Real captured response, the host moved to a private address after the
                    proposal
                  value:
                    error: The endpoint host 'crm.example.com' resolves to an address that is not
                      public (10.0.0.7).
                    code: EXTERNAL_ENDPOINT_ADDRESS_REFUSED
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or
            STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: External connector change '1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37' was
                      proposed by this same caller — the proposer (maker) may
                      not also approve or reject it (checker).
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
        "404":
          description: No external connector change has this id
            (EXTERNAL_CONNECTOR_CHANGE_NOT_FOUND).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: External connector change '00000000-0000-0000-0000-000000000000' not
                      found.
                    code: EXTERNAL_CONNECTOR_CHANGE_NOT_FOUND
        "409":
          description: CONFLICT. The change is already resolved, the capability to
            register now has an active registration, or the capability to revoke
            no longer has one. Nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                alreadyResolved:
                  summary: Real captured response, the same change approved twice
                  value:
                    error: External connector change 'd1164799-36e9-4281-878a-93d666befd42' is
                      already APPROVED.
                    code: CONFLICT
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            # Sign the step up authorization on your own machine first:
            #   npx tsx scripts/sign-policy-change-step-up.ts --private-key-file step-up.private.pem \
            #     --key-id checker-step-up-1 --pending-policy-change-id ba7c5827-5844-4069-94fc-9b438ef08f78 --action approve > step-up.json
            curl -X POST https://parmana-api-real.vercel.app/external-connectors/changes/ba7c5827-5844-4069-94fc-9b438ef08f78/approve \
              -H "Authorization: Bearer $PARMANA_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{\"stepUpAuthorization\": $(cat step-up.json)}"
        - lang: typescript
          label: TypeScript
          source: >-
            import { readFileSync } from "node:fs";


            import { signPolicyChangeStepUp } from "@parmana/sdk";


            // Not in the SDK yet: call the route directly.

            const stepUp = signPolicyChangeStepUp({
              pendingPolicyChangeId: "ba7c5827-5844-4069-94fc-9b438ef08f78",
              action: "approve",
              privateKeyPem: readFileSync("step-up.private.pem", "utf8"),
              keyId: "checker-step-up-1",
            });


            const response = await fetch(
              "https://parmana-api-real.vercel.app/external-connectors/changes/ba7c5827-5844-4069-94fc-9b438ef08f78/approve",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${process.env.PARMANA_API_KEY}`,
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ stepUpAuthorization: stepUp }),
              },
            );


            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: >-
            import os

            from pathlib import Path


            import requests


            from parmana.crypto import sign_policy_change_step_up


            # Not in the SDK yet: call the route directly.

            step_up = sign_policy_change_step_up(
                pending_policy_change_id="ba7c5827-5844-4069-94fc-9b438ef08f78",
                action="approve",
                private_key_pem=Path("step-up.private.pem").read_text(),
                key_id="checker-step-up-1",
            )


            response = requests.post(
                "https://parmana-api-real.vercel.app/external-connectors/changes/ba7c5827-5844-4069-94fc-9b438ef08f78/approve",
                headers={"Authorization": f"Bearer {os.environ['PARMANA_API_KEY']}"},
                json={"stepUpAuthorization": step_up},
                timeout=30,
            )


            print(response.status_code, response.json())
