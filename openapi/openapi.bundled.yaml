          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                alreadyExists:
                  summary: Real captured response
                  value:
                    error: Approver 'manager-priya' key 'manager-priya-key-1' already exists. Use a
