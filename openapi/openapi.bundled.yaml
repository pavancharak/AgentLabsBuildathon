        key from the next approval checked, revoke refuses every approval the
        key ever signed from the next request on. Requires, in order: a human
        credential, not the proposer (403 SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE),
        and a step up authorization signed with the checker step up key for this
        change id and action approve, used once (403
        STEP_UP_AUTHORIZATION_INVALID). It is the same step up authorization
        policy changes use, with the change id in payload.pendingPolicyChangeId.
      parameters:
        - name: id
          in: path
          required: true
          description: The changeId.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
            examples:
              stepUp:
                summary: Real captured request
                value:
                  stepUpAuthorization:
                    payload:
                      version: 1
                      nonce: 0b6081da-cd57-4519-ae36-71eb1bb62432
                      pendingPolicyChangeId: ba7c5827-5844-4069-94fc-9b438ef08f78
                      action: approve
