  /api-manifest.json:
    get:
      tags:
        - System
      summary: Machine-readable SDK and discovery manifest
      operationId: getApiManifest
      description: >
        A single machine-readable index for coding agents and tooling: the
        OpenAPI spec locations, the rendered documentation views, the
        authentication scheme, and both official SDKs (TypeScript and Python)
        with their real, current package name, registry, and version, read
        directly from each package's own manifest at startup, see
        packages/api/src/routes/api-manifest.ts. Go and Java are reported as
        null: no SDK exists for those languages in this repository (see
        /sdks/other-languages on the documentation site). Exempt from caller
        authentication for the same reason GET /openapi.json is.
      security: []
      responses:
        "200":
          description: The manifest, JSON.
          content:
            application/json:
              schema:
                type: object
              examples:
                liveCapture:
                  summary: Real captured response
                  value:
                    name: Parmana
                    apiVersion: v1
                    buildVersion: 0.4.0
                    openapi:
                      json: /openapi.json
                      yaml: /openapi.yaml
                    documentation:
                      site: https://docs.parmanasystems.com
                      swaggerUi: /documentation
                      redoc: /reference
                    authentication:
                      type: bearer
                      header: "Authorization: Bearer <key>"
                      docs: https://docs.parmanasystems.com/api-reference/authentication
                    sdks:
                      typescript:
                        package: "@parmana/sdk"
                        registry: npm
                        version: 1.1.2
                        install: npm install @parmana/sdk
                        docs: https://docs.parmanasystems.com/sdks/typescript
                        reference: https://docs.parmanasystems.com/sdks/reference/typescript/classes/ParmanaClient
                      python:
                        package: parmana
                        registry: pypi
                        version: 1.1.4
                        install: pip install parmana
                        docs: https://docs.parmanasystems.com/sdks/python
                        reference: https://docs.parmanasystems.com/sdks/reference/python/client
                      go: null
                      java: null
                    connectorSdks:
                      typescript:
                        package: "@parmana/connector-sdk"
                        registry: npm
                        version: 0.1.0
                        install: npm install @parmana/connector-sdk
                        docs: https://docs.parmanasystems.com/reference/connector-sdk
                      python:
                        package: parmana-connector-sdk
                        registry: pypi
                        version: 0.1.0
                        install: pip install parmana-connector-sdk
                        docs: https://docs.parmanasystems.com/reference/connector-sdk-python
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/api-manifest.json
        - lang: typescript
          label: TypeScript
          source: |-
            const response = await fetch(
              "https://parmana-api-real.vercel.app/api-manifest.json",
            );

            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get(
                "https://parmana-api-real.vercel.app/api-manifest.json",
                timeout=30,
            )

            print(response.status_code, response.json())
