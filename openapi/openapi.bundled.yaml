    execution-intent-finalize-response.schema:
      title: Finalize Execution Intent Response
      description: "Response returned by POST
        /execution-intents/{businessTransactionId}/finalize. The finalize
        operation never calls a connector. It is safe to run more than once:
        FINALIZED means a Trust Record was rebuilt by this call,
        ALREADY_FINALIZED means one already existed and nothing was built."
      type: object
      additionalProperties: false
      required:
        - outcome
        - businessTransactionId
        - trustRecordId
        - trustRecord
      properties:
        outcome:
          type: string
          enum:
            - FINALIZED
            - ALREADY_FINALIZED
        businessTransactionId:
          type: string
        trustRecordId:
          type: string
          description: Identifier of the Execution Trust Record. Equal to
            trustRecord.trustRecordId.
        trustRecord:
          $ref: "#/components/schemas/execution-trust-record.schema"
    execution-intent-resolve-request.schema:
      title: Resolve Execution Intent Request
      description: Request body for POST
        /execution-intents/{businessTransactionId}/resolve. Both fields are
        required. The note is required on purpose, because it is the only record
        of what the operator found at the connector.
      type: object
      additionalProperties: false
      required:
        - resolution
        - note
      properties:
        resolution:
          type: string
          enum:
            - NOT_EXECUTED
            - EXECUTED
          description: "What you established at the connector. NOT_EXECUTED: the action
            did not run. EXECUTED: it did run."
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: What you checked and found, for example the connector and the
            reference you looked at. Surrounding space is trimmed.
      examples:
        - resolution: NOT_EXECUTED
          note: Checked the Paytm dashboard for this order. No refund exists.
    execution-intent-resolve-response.schema:
      title: Resolve Execution Intent Response
      description: "Response returned by POST
        /execution-intents/{businessTransactionId}/resolve. RESOLVED means this
        call closed the intent. ALREADY_RESOLVED means it was already closed and
        nothing was changed: the original resolution, note and author are
        returned, never the new request's."
      type: object
      additionalProperties: false
      required:
        - outcome
        - businessTransactionId
        - intent
        - status
      properties:
        outcome:
          type: string
          enum:
            - RESOLVED
            - ALREADY_RESOLVED
        businessTransactionId:
          type: string
        intent:
          $ref: "#/components/schemas/execution-intent.schema"
        status:
          $ref: "#/components/schemas/execution-intent-status.schema"
    audit-verify-request.schema:
      title: Audit Verify Request
      description: "Request body for POST /audit/verify: the signed
        caller-authentication audit event and its stored signature, not a lookup
        by ID. Checked structurally on the server before signature verification
        runs. Verification operates on canonical bytes and the signature alone,
        never on event.type."
      type: object
      additionalProperties: false
      required:
        - event
        - signature
      properties:
        event:
          type: object
          description: The caller-authentication audit event as stored. Only type,
            occurredAt, and route are structurally required; the event may carry
            further fields depending on what produced it.
          additionalProperties: true
          required:
            - type
            - occurredAt
            - route
          properties:
            type:
              type: string
            occurredAt:
              type: string
              format: date-time
            route:
              type: string
        signature:
          type: object
          description: The signature stored alongside the event. Only production
            (Supabase) audit sinks sign; in-memory test sinks never produce a
            genuine one of these.
          additionalProperties: true
          required:
            - algorithm
            - keyId
            - value
          properties:
            algorithm:
              type: string
              examples:
                - ed25519
            keyId:
              type: string
            value:
              type: string
              description: Base64-encoded signature value.
      examples:
        - event:
            type: caller_authenticated
            occurredAt: 2026-09-15T03:00:00.000Z
            route: /version
          signature:
            algorithm: ed25519
            keyId: default
            value: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
    receipt-request.schema:
      title: Receipt Request
      description: Request payload for POST /receipt. businessTransactionId is
        required and must be a valid UUID; both are rejected with a 400, with
        distinct messages depending on which check fails.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Business Transaction to generate a Receipt for. Its Execution Trust
            Record must already have a successful (VERIFIED) Verification, or
            the request fails with a 409.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    trust-records-list-response.schema:
      title: Trust Records List Response
      description: Response returned by GET /trust-records (bulk/compliance export). A
        bare array, no pagination envelope (no page/pageSize/totalItems
        metadata) -- the same shape convention as GET /transactions. Each item
        is a full Execution Trust Record, the same shape GET
        /trust-records/{businessTransactionId} returns for one.
      type: array
      items:
        $ref: "#/components/schemas/execution-trust-record.schema"
    replay-request.schema:
      title: Replay Request
      description: Request payload for POST /replay. businessTransactionId is required
        (rejected with a 400 if missing or empty), unlike POST /verify and POST
        /receipt, this route does not additionally validate UUID format.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          description: Business Transaction to replay.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    replay-response.schema:
      title: Replay Response
      description: "Response returned by POST /replay. A deliberately small shape
        distinct from the Execution Trust Record it replays: it re-verifies the
        record's stored signature via VerificationCrypto and reports only
        whether that succeeded, alongside the hash it checked."
      type: object
      additionalProperties: false
      required:
        - businessTransactionId
        - trustRecordHash
        - verified
      properties:
        businessTransactionId:
          type: string
          description: Business Transaction that was replayed.
        trustRecordHash:
          type: string
          description: Hash of the Execution Trust Record that was replayed.
        verified:
          type: boolean
          description: Whether the Execution Trust Record's stored signature verified
            successfully.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          trustRecordHash: 989aef83d595202ec02bb338ac00461abec0541098ea065f965b5cde342d3b25
          verified: true
    policy-validate-request.schema:
      title: Policy Validate Request
      description: Request payload for POST /policies/validate. policyId and
        policyVersion are each required non-empty strings, checked in that
        order; each missing/empty field is rejected with its own 400 and a
        distinct message.
      type: object
      additionalProperties: true
      required:
        - policyId
        - policyVersion
      properties:
        policyId:
          type: string
          minLength: 1
          description: Policy name, matching the directory name under the configured
            policy directory.
        policyVersion:
          type: string
          minLength: 1
          description: Policy version, matching the version subdirectory.
      examples:
        - policyId: vendor-payment
          policyVersion: 2.0.0
    policy-validate-response.schema:
      title: Policy Validate Response
      description: Response returned by POST /policies/validate on every status code
        (200, 400, and 404 all use this exact shape). This endpoint does NOT use
        the shared Error envelope (../common/error.schema.json) for its failure
        responses.
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
      properties:
        valid:
          type: boolean
          description: Whether the referenced policy exists and is readable.
        errors:
          type: array
          description: Empty when valid is true; otherwise exactly one human-readable
            message.
          items:
            type: string
      examples:
        - valid: true
          errors: []
        - valid: false
          errors:
            - Policy 'does-not-exist' version '9.9.9' was not found.
        - valid: false
          errors:
            - policyVersion is required.
    propose-policy-change-request.schema:
      title: Propose Policy Change Request
      description: Request body for POST /policies/{name}/{version}/pending-changes.
      type: object
      additionalProperties: false
      required:
        - proposedContent
        - reason
      properties:
        proposedContent:
          type: object
          description: The full proposed policy.json content, in its entirety. Its
            policyId must equal the {name} path parameter, and its policyVersion
            must match ^[A-Za-z0-9._-]+$. Validated against the same rules POST
            /policies/validate checks.
          additionalProperties: true
        reason:
          type: string
          description: Free-text justification. Required, non-empty.
      examples:
        - proposedContent:
            policyId: openapi-capture-demo
            policyVersion: 1.0.0
            schemaVersion: 1.0.0
            rules:
              - id: always-approve
                condition:
                  always: true
                outcome:
                  action: approve
                  reason: OpenAPI spec capture fixture
          reason: Capture a real Pending Policy Change for the OpenAPI spec
    pending-policy-change.schema:
      title: Pending Policy Change
      description: A proposed change to a policy's content, held in a durable pending
        state until a second, distinct human explicitly approves or rejects it
        (Policy Governance, maker-checker). Only ever moves from
        PENDING_APPROVAL to APPROVED or REJECTED, exactly once.
      type: object
      additionalProperties: true
      required:
        - pendingPolicyChangeId
        - policyName
        - policyVersion
        - proposedContent
        - proposedBy
        - proposedAt
        - status
        - reason
      properties:
        pendingPolicyChangeId:
          type: string
          description: Unique Pending Policy Change identifier.
        policyName:
          type: string
          description: The policy this proposal targets, same identifier as Policy.policyId.
        policyVersion:
          type: string
          description: "The existing version this proposal is a change against (\"the
            version being replaced\"). Not necessarily equal to
            proposedContent's own declared version: an in-place patch and a
            version bump are both legitimate."
        proposedContent:
          type: object
          description: The full proposed policy.json content, in its entirety, not a diff
            or patch.
          additionalProperties: true
        proposedBy:
          type: string
          description: Identity of the proposer (maker). Always a human-authenticated
            (credentialHolderType USER) caller.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
        reason:
          type: string
          description: Free-text justification from the proposer, required at creation.
        resolvedBy:
          type: string
          description: Identity of the resolver (checker). Absent while PENDING_APPROVAL.
            Never equal to proposedBy.
        resolvedAt:
          type: string
          format: date-time
          description: Absent while PENDING_APPROVAL.
        rejectionReason:
          type: string
          description: Present only when status is REJECTED.
        coverageWarnings:
          type: array
          description: "Present only when non-empty: uncovered-fact warnings from
            PolicyValidator.findUncoveredFacts against proposedContent."
          items:
            type: string
        ruleConflicts:
          type: array
          description: "Present only when non-empty: advisory rule-conflict warnings from
            PolicyValidator.findRuleConflicts against proposedContent, never
            blocking."
          items:
            type: string
      examples:
        - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
          policyName: openapi-capture-demo
          policyVersion: 1.0.0
          proposedContent:
            policyId: openapi-capture-demo
            policyVersion: 1.0.0
            schemaVersion: 1.0.0
            rules:
              - id: always-approve
                condition:
                  always: true
                outcome:
                  action: approve
                  reason: OpenAPI spec capture fixture
          proposedBy: human-maker
          proposedAt: 2026-09-15T03:47:13.920Z
          status: APPROVED
          reason: Capture a real Pending Policy Change for the OpenAPI spec
          resolvedBy: human-checker
          resolvedAt: 2026-09-15T03:48:03.586Z
    pending-changes-list-response.schema:
      title: Pending Changes List Response
      description: "Response returned by GET /policies/pending-changes. Each entry is
        a Pending Policy Change plus a diff view: current (the live content at
        (policyName, policyVersion) today, or null if that version has never
        been published) and proposed (the change's own proposedContent)."
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/pending-policy-change.schema"
              - type: object
                required:
                  - diff
                properties:
                  diff:
                    type: object
                    additionalProperties: false
                    required:
                      - current
                      - proposed
                    properties:
                      current:
                        description: The live policy.json content today, or null if this version has
                          never been published.
                      proposed:
                        description: The same value as this entry's own proposedContent.
      examples:
        - changes:
            - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
              policyName: openapi-capture-demo
              policyVersion: 1.0.0
              proposedContent:
                policyId: openapi-capture-demo
                policyVersion: 1.0.0
                schemaVersion: 1.0.0
                rules:
                  - id: always-approve
                    condition:
                      always: true
                    outcome:
                      action: approve
                      reason: OpenAPI spec capture fixture
              proposedBy: human-maker
              proposedAt: 2026-09-15T03:47:13.920Z
              status: PENDING_APPROVAL
              reason: Capture a real Pending Policy Change for the OpenAPI spec
              diff:
                current: null
                proposed:
                  policyId: openapi-capture-demo
                  policyVersion: 1.0.0
                  schemaVersion: 1.0.0
                  rules:
                    - id: always-approve
                      condition:
                        always: true
                      outcome:
                        action: approve
                        reason: OpenAPI spec capture fixture
    policy-change-step-up-authorization.schema:
      title: Policy Change Step-Up Authorization
      description: "Signed envelope proving a checker's explicit, fresh intent to
        approve or reject one specific Pending Policy Change (Policy Governance,
        Layer 4). Produced by PolicyChangeStepUpAuthorizationSigner
        (@parmana/crypto) using the checker's own step-up private key, never the
        bearer API key. Verified server-side against: the checker's registered
        stepUpPublicKey, payload.pendingPolicyChangeId matching the URL's {id},
        payload.action matching the endpoint (approve vs reject),
        payload.expiresAt not yet passed, and payload.nonce not previously seen
        (single-use, replay-rejected on a second attempt with the same
        envelope)."
      type: object
      additionalProperties: true
      required:
        - payload
        - signature
        - keyId
        - algorithm
      properties:
        payload:
          type: object
          additionalProperties: true
          required:
            - version
            - nonce
            - pendingPolicyChangeId
            - action
            - authorizedAt
            - expiresAt
          properties:
            version:
              type: integer
            nonce:
              type: string
              description: Single-use value; a second request replaying the same envelope is
                rejected.
            pendingPolicyChangeId:
              type: string
            action:
              type: string
              enum:
                - approve
                - reject
            authorizedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
        signature:
          type: string
          description: Base64-encoded signature over the canonical payload, signed with
            the checker's step-up private key.
        keyId:
          type: string
        algorithm:
          type: string
          examples:
            - ed25519
      examples:
        - payload:
            version: 1
            nonce: 343ee454-92c6-4ef9-9cfe-e98329e51f53
            pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
            action: approve
            authorizedAt: 2026-09-15T03:47:51.939Z
            expiresAt: 2026-09-15T03:49:51.939Z
          signature: keOXnzUk8KcGrQTkpXC4Ki8ps3GTvMANwqq96b+toxba07gjkcmpyL/vaPZ7+pPZ1HAOJOOy3rj5XfhcwOTnAw==
          keyId: human-checker-step-up-key
          algorithm: ed25519
    approve-policy-change-request.schema:
      title: Approve Policy Change Request
      description: Request body for POST /policies/pending-changes/{id}/approve.
      type: object
      additionalProperties: false
      required:
        - stepUpAuthorization
      properties:
        stepUpAuthorization:
          $ref: "#/components/schemas/policy-change-step-up-authorization.schema"
      examples:
        - stepUpAuthorization:
            payload:
              version: 1
              nonce: 343ee454-92c6-4ef9-9cfe-e98329e51f53
              pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
              action: approve
              authorizedAt: 2026-09-15T03:47:51.939Z
              expiresAt: 2026-09-15T03:49:51.939Z
            signature: keOXnzUk8KcGrQTkpXC4Ki8ps3GTvMANwqq96b+toxba07gjkcmpyL/vaPZ7+pPZ1HAOJOOy3rj5XfhcwOTnAw==
            keyId: human-checker-step-up-key
            algorithm: ed25519
    reject-policy-change-request.schema:
      title: Reject Policy Change Request
      description: Request body for POST /policies/pending-changes/{id}/reject.
      type: object
      additionalProperties: false
      required:
        - rejectionReason
        - stepUpAuthorization
      properties:
        rejectionReason:
          type: string
          description: Free-text reason. Required, non-empty.
        stepUpAuthorization:
          $ref: "#/components/schemas/policy-change-step-up-authorization.schema"
      examples:
        - rejectionReason: Does not meet the bar for this fixture
          stepUpAuthorization:
            payload:
              version: 1
              nonce: 4807fe45-0379-415b-9455-b8cb84eb5554
              pendingPolicyChangeId: 5617ba3c-fb07-437d-9131-232b84bbb863
              action: reject
              authorizedAt: 2026-09-15T03:48:16.755Z
              expiresAt: 2026-09-15T03:50:16.755Z
            signature: Wu5/oibGCjvkTklGQPiDMDemqxCVbSyuoVT7WHW63rGq8Av5KFTW6vMkUCP03pANv8bDu60bZVuVcTDVmLXpDA==
            keyId: human-checker-step-up-key
            algorithm: ed25519
    approval-issuer.schema:
      title: Approver Key
      description: An approver key the server trusts, or trusted, to sign approvals.
        source is code for keys listed in the server's code, and governed for
        keys added through approver changes.
      type: object
      additionalProperties: false
      required:
        - approverId
        - keyId
        - publicKeyPem
        - revoked
        - source
      properties:
        approverId:
          type: string
        keyId:
          type: string
        publicKeyPem:
          type: string
          description: Ed25519 public key, PEM (SPKI).
        revoked:
          type: boolean
          description: "true: every approval signed with this key is refused."
        source:
          type: string
          enum:
            - code
            - governed
          description: "code: listed in createApprovalIssuerRegistry.ts, changed only by a
            deploy. governed: added through POST /approval-issuers/changes."
        addedByChangeId:
          type: string
          description: "governed only: the approved change that added it."
        addedAt:
          type: string
          format: date-time
          description: governed only.
        revokedByChangeId:
          type: string
          description: "governed and revoked only: the approved change that revoked it."
        revokedAt:
          type: string
          format: date-time
          description: governed and revoked only.
    approval-issuers-list-response.schema:
      title: Approver Keys List Response
      description: "Response of GET /approval-issuers: keys in code first, then keys
        added through approver changes, revoked ones included."
      type: object
      additionalProperties: false
      required:
        - issuers
      properties:
        issuers:
          type: array
          items:
            $ref: "#/components/schemas/approval-issuer.schema"
    approval-issuer-change.schema:
      title: Approver Change
      description: A proposal to add an approver key, or to revoke one added this way,
        and its resolution. One person proposes it; a different person approves
        or rejects it with a step up authorization. Only an approved change
        affects which approvals verify.
      type: object
      additionalProperties: false
      required:
        - changeId
        - action
        - approverId
        - keyId
        - reason
        - proposedBy
        - proposedAt
        - status
      properties:
        changeId:
          type: string
          description: Unique id of the change, a UUID. The step up authorization for
            approve or reject names it in payload.pendingPolicyChangeId.
        action:
          type: string
          enum:
            - add
            - revoke
          description: add trusts a new key; revoke stops trusting a key added this way,
            and every approval it ever signed.
        approverId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: The approver, as named in the payload.issuer.approverId of the
            approvals they sign.
        keyId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
          description: "The approver's key, as named in payload.issuer.keyId. A key id is
            used once: a revoked key id cannot be added again."
        publicKeyPem:
          type: string
          description: The approver's Ed25519 public key, PEM (SPKI), as the server stored
            it. Present on add, absent on revoke.
        reason:
          type: string
          maxLength: 2000
          description: Why, from the proposer.
        proposedBy:
          type: string
          description: The proposer's caller id. Always a human credential.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
          description: PENDING_APPROVAL until a second person approves or rejects it; then
            APPROVED or REJECTED, once.
        resolvedBy:
          type: string
          description: Who approved or rejected it. Never the proposer.
        resolvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
          description: Present when REJECTED.
      examples:
        - changeId: ba7c5827-5844-4069-94fc-9b438ef08f78
          action: add
          approverId: manager-priya
          keyId: manager-priya-key-1
          publicKeyPem: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAEDuWHf+bbRY7J/Mr0RVmAKYHH5CDijTWhdnISXWLD6Y=
            -----END PUBLIC KEY-----
          reason: Priya approves refunds for the West region from October.
          proposedBy: human-maker
          proposedAt: 2026-09-28T19:05:59.726Z
          status: APPROVED
          resolvedBy: human-checker
          resolvedAt: 2026-09-28T19:05:59.738Z
    approval-issuer-changes-list-response.schema:
      title: Approver Changes List Response
      description: Response of GET /approval-issuers/changes, newest first.
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/approval-issuer-change.schema"
    propose-approval-issuer-change-request.schema:
      title: Propose Approver Change Request
      description: Request body for POST /approval-issuers/changes.
      type: object
      additionalProperties: true
      required:
        - action
        - approverId
        - keyId
        - reason
      properties:
        action:
          type: string
          enum:
            - add
            - revoke
        approverId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
        keyId:
          type: string
          pattern: ^[A-Za-z0-9._-]{1,128}$
        publicKeyPem:
          type: string
          description: Required for add, not allowed for revoke. The .public.pem file
            scripts/generate-approver-key.ts writes.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      examples:
        - action: add
          approverId: manager-priya
          keyId: manager-priya-key-1
          publicKeyPem: |
            -----BEGIN PUBLIC KEY-----
            MCowBQYDK2VwAyEAEDuWHf+bbRY7J/Mr0RVmAKYHH5CDijTWhdnISXWLD6Y=
            -----END PUBLIC KEY-----
          reason: Priya approves refunds for the West region from October.
        - action: revoke
          approverId: manager-priya
          keyId: manager-priya-key-1
          reason: Priya moved to another team.
    external-connector.schema:
      title: External Connector
      description: "A capability bound to an HTTPS endpoint an operator runs, and to
        the policy that governs it, registered through external connector
        changes (ADR-0013). Nothing is deleted: a revoked registration stays
        listed."
      type: object
      additionalProperties: false
      required:
        - registrationId
        - capability
        - endpointUrl
        - policy
        - allowedParameters
        - timeoutMs
        - status
        - registeredAt
      properties:
        registrationId:
          type: string
          description: The changeId of the approved register change that created it.
        capability:
          type: string
        endpointUrl:
          type: string
        policy:
          type: string
        allowedParameters:
          type: array
          items:
            type: string
        timeoutMs:
          type: integer
        status:
          type: string
          enum:
            - active
            - revoked
          description: At most one active registration per capability.
        registeredAt:
          type: string
          format: date-time
        revokedByChangeId:
          type: string
          description: "revoked only: the approved change that revoked it."
        revokedAt:
          type: string
          format: date-time
          description: revoked only.
    external-connectors-list-response.schema:
      title: External Connectors List Response
      description: "Response of GET /external-connectors: every registration, active
        and revoked."
      type: object
      additionalProperties: false
      required:
        - connectors
      properties:
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/external-connector.schema"
    external-connector-change.schema:
      title: External Connector Change
      description: A proposal to register an external connector, or to revoke the
        active one for a capability, and its resolution (ADR-0013). One person
        proposes it; a different person approves or rejects it with a step up
        authorization. Only an approved change affects which external connectors
        are registered.
      type: object
      additionalProperties: false
      required:
        - changeId
        - action
        - capability
        - reason
        - proposedBy
        - proposedAt
        - status
      properties:
        changeId:
          type: string
          description: Unique id of the change, a UUID. The step up authorization for
            approve or reject names it in payload.pendingPolicyChangeId. An
            approved register change's id is also the registrationId.
        action:
          type: string
          enum:
            - register
            - revoke
          description: register binds the capability to the endpoint; revoke ends the
            active registration for the capability.
        capability:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$
          maxLength: 128
          description: namespace:verb. Never in a built in connector's namespace (paytm,
            hubspot, github, slack, test).
        endpointUrl:
          type: string
          description: "register only. The endpoint as the server stored it, normalized by
            URL parsing: https, a host name with a domain, no IP literal, no
            localhost, no user name, password or fragment, resolving only to
            public addresses. It is the audience of every release to this
            endpoint."
        policy:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,127}$
          description: register only. The name of the policy that governs the capability.
            The version in effect is decided by policy governance.
        allowedParameters:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          description: register only. The only parameter names Parmana will forward to the
            endpoint.
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 30000
          description: register only. How long Parmana waits for the endpoint's answer.
            Defaults to 10000.
        reason:
          type: string
          maxLength: 2000
          description: Why, from the proposer.
        proposedBy:
          type: string
          description: The proposer's caller id. Always a human credential.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
          description: PENDING_APPROVAL until a second person approves or rejects it; then
            APPROVED or REJECTED, once.
        resolvedBy:
          type: string
          description: Who approved or rejected it. Never the proposer.
        resolvedAt:
          type: string
          format: date-time
        rejectionReason:
          type: string
          description: Present when REJECTED.
      examples:
        - changeId: 1aa68ad8-ab5c-4beb-9ff3-7a6b1fc1ff37
          action: register
          capability: erp:create-invoice
          endpointUrl: https://erp.example.com/parmana/release
          policy: erp-invoice
          allowedParameters:
            - amount
            - currency
            - customerId
          timeoutMs: 10000
          reason: Finance creates invoices in the ERP through Parmana from October.
          proposedBy: human-maker
          proposedAt: 2026-09-30T17:25:46.316Z
          status: APPROVED
          resolvedBy: human-checker
          resolvedAt: 2026-09-30T17:25:46.385Z
    external-connector-changes-list-response.schema:
      title: External Connector Changes List Response
      description: Response of GET /external-connectors/changes, newest first.
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/external-connector-change.schema"
    propose-external-connector-change-request.schema:
      title: Propose External Connector Change Request
      description: Request body for POST /external-connectors/changes. A register
        carries endpointUrl, policy, allowedParameters and optionally timeoutMs;
        a revoke carries none of them.
      type: object
      additionalProperties: true
      required:
        - action
        - capability
        - reason
      properties:
        action:
          type: string
          enum:
            - register
            - revoke
        capability:
          type: string
          pattern: ^[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*:[a-z][a-z0-9]*(?:[-_][a-z0-9]+)*$
          maxLength: 128
        endpointUrl:
          type: string
          maxLength: 2048
          description: Required for register. https only, a public host name.
        policy:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,127}$
          description: Required for register.
        allowedParameters:
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          description: Required for register. May be empty.
        timeoutMs:
          type: integer
          minimum: 1000
          maximum: 30000
          default: 10000
        reason:
          type: string
          minLength: 1
          maxLength: 2000
      examples:
        - action: register
          capability: erp:create-invoice
          endpointUrl: https://erp.example.com/parmana/release
          policy: erp-invoice
          allowedParameters:
            - amount
            - currency
            - customerId
          timeoutMs: 10000
          reason: Finance creates invoices in the ERP through Parmana from October.
        - action: revoke
          capability: erp:create-invoice
          reason: The ERP endpoint moves to a new host.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        Caller API key issued by scripts/generate-api-key.ts. Sent as
        Authorization: Bearer <key>. Verified against a stored SHA-256 hash in
        constant time by packages/api/src/auth/StaticKeyAuthenticator.ts.
        Required on every route not listed as exempt in this document's
        top-level description. See /api-reference/authentication.
  responses:
    Unauthorized:
      description: Missing or invalid caller credential (StaticKeyAuthenticator
        returned no identity). Real captured response,
        packages/api/src/middleware/caller-auth.ts.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error.schema"
          examples:
            authRequired:
              summary: Real captured response, missing or invalid Authorization header
              value:
                error: authentication required
    RateLimited:
      description: The caller exceeded the per minute limit on this route
        (RATE_LIMIT_EXECUTE_PER_MINUTE, default 30 per authenticated caller, on
        /execute; RATE_LIMIT_HEALTH_PER_MINUTE, default 300 per IP address, on
        /health and /ready; RATE_LIMIT_PUBLIC_PER_MINUTE, default 60 per IP
        address, shared by the unauthenticated verify routes and /handbook). The
        request never reached the handler, so nothing was recorded or executed.
        Wait the number of seconds in the Retry-After header, then retry.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error.schema"
          examples:
            rateLimited:
              summary: Rate limit exceeded
              value:
                error: Rate limit exceeded. Try again later.
                code: RATE_LIMITED
    SigningUnavailable:
      description: "The action was refused BEFORE it was released, so nothing was
        executed. Code SIGNING_UNAVAILABLE: the runtime could not prove it can
        sign an Execution Trust Record. Code AUDIT_UNAVAILABLE: the caller
        authentication audit trail could not be written. In both cases retry
        later with a new businessTransactionId, because the original was already
        accepted. Code CONNECTOR_NOT_REGISTERED: no connector is registered for
        the action on this deployment, usually because its credentials were
        never configured. The operator must configure the connector first, then
        retry with a new businessTransactionId. Code
        EXECUTION_INTENT_UNAVAILABLE: the signed Execution Intent for this
        transaction could not be signed and stored, so nothing was released
        (ADR-0012). Retry later with a new businessTransactionId."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error.schema"
          examples:
            executionIntentUnavailable:
              summary: The signed Execution Intent could not be stored, nothing was executed
                (real captured response)
              value:
                error: "The signed Execution Intent for business transaction
                  '2c3cae0f-fd3c-4962-8147-83f3710a2fc9' could not be created
                  and stored; refusing to release the action. Nothing was
                  executed. Cause: new row for relation \"execution_intents\"
                  violates check constraint \"sbx_block_intents\""
                code: EXECUTION_INTENT_UNAVAILABLE
            signingUnavailable:
              summary: Evidence signing is unhealthy, nothing was executed
              value:
                error: Evidence signing is unavailable; refusing to release the action because a
                  signed Execution Trust Record could not be produced. Nothing
                  was executed.
                code: SIGNING_UNAVAILABLE
            auditUnavailable:
              summary: The caller audit trail could not be written
              value:
                error: Caller authentication audit trail is unavailable; refusing to proceed
                  without an audit record.
                code: AUDIT_UNAVAILABLE
            connectorNotRegistered:
              summary: No connector is registered for the action, nothing was executed
              value:
                error: No connector is registered for capability 'paytm:refund' on this
                  deployment. Nothing was executed. The operator must configure
                  the connector.
                code: CONNECTOR_NOT_REGISTERED
