                    reason: Priya moved to another team.
                    proposedBy: human-maker
                    proposedAt: 2026-09-28T19:05:59.750Z
                    status: PENDING_APPROVAL
        "400":
          description: action is not add or revoke; approverId or keyId does not match
            ^[A-Za-z0-9._-]{{1,128}}$; reason is missing or longer than 2000
            characters; publicKeyPem is not an Ed25519 public key (add) or is
            present (revoke).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                badKey:
                  summary: Real captured response
                  value:
                    error: publicKeyPem must be an Ed25519 public key in PEM, as made by
                      scripts/generate-approver-key.ts.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The caller is not a human credential (NON_HUMAN_CALLER_DENIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                service:
