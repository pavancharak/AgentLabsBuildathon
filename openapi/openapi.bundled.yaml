          description: "Server failure. Covers these conditions. Code
            EXECUTION_RECORD_INCOMPLETE: the action was released to the
            execution system but its signed Execution Trust Record could not be
            produced or persisted, so do not resubmit under a new
            businessTransactionId and reconcile against the connector and the
            execution audit events instead. A structurally incomplete request
            body (a valid-UUID businessTransactionId but missing required nested
            fields, e.g. metadata). A policy rejection is NOT a 500, it is a 403
            with code POLICY_DENIED, and a failed connector call is a 502 with
            code EXECUTION_OUTCOME_UNKNOWN."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                executionRecordIncomplete:
                  summary: The action was released but its signed record could not be produced
                  value:
                    error: "The action for business transaction
                      'e54187e6-431f-4e1c-9c0e-ff2cb5d6d40a' was released to the
                      execution system, but its signed Execution Trust Record
                      could not be produced. Do not retry as a new transaction:
                      reconcile against the connector and the execution audit
                      events for this businessTransactionId. authorizationId:
                      381ef27a-0955-4085-9e5d-e4223fef2986."
                    code: EXECUTION_RECORD_INCOMPLETE
                malformedBody:
                  summary: Real captured response, valid UUID but missing required nested fields
                    (e.g. metadata); no code field, this is the generic 500
                    handler, not a typed RuntimeError
                  value:
                    error: Internal Server Error
        "502":
          description: "Code EXECUTION_OUTCOME_UNKNOWN: the action was released to the
            execution system and the call failed, typically a connector that
            could not be reached, timed out or answered with an error, so
            whether the action was performed is unknown. The Execution Intent
            for this businessTransactionId is in state ERRORED. Do not resubmit
            under a new businessTransactionId: check the target system, then
            close the intent with POST
            /execution-intents/{businessTransactionId}/resolve. The message
            carries the businessTransactionId and authorizationId, never the
            connector's own error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                executionOutcomeUnknown:
                  summary: The action was released and the connector call failed
                  value:
                    error: "The action for business transaction
                      '38dcf000-99ed-43af-8666-46c63c8ada74' was released to the
                      execution system, but the call failed, so whether it was
                      performed is unknown. Do not retry as a new transaction:
                      check the target system, then close the Execution Intent
                      with POST
                      /execution-intents/38dcf000-99ed-43af-8666-46c63c8ada74/r\
                      esolve. authorizationId:
                      4d291c90-9e93-4a8a-b214-8cc6526fe2e3."
                    code: EXECUTION_OUTCOME_UNKNOWN
        "503":
          $ref: "#/components/responses/SigningUnavailable"
