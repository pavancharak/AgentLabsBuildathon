openapi: 3.1.0
info:
  title: Parmana API
  version: 1.0.0
  description: >
    Parmana is an Execution Trust Infrastructure that ensures there is no gap
    between what humans decide and what AI systems do. The API enables creation,
    execution, verification, replay, and auditing of Business Transactions
    through cryptographically verifiable Execution Trust Records.


    **Every route requires a caller bearer key**, except the liveness/readiness
    probes and documentation/verification routes that must be reachable with no
    credential: GET /health, GET /ready, GET /openapi.yaml, GET /documentation,
    GET /reference, POST /refusal/verify, POST /execution-intents/verify, POST
    /audit/verify, GET /keys/{keyId}, and GET /.well-known/jwks.json. Send
    `Authorization: Bearer <key>` on every other request. Keys are issued by
    `scripts/generate-api-key.ts` and configured server-side via
    `PARMANA_API_KEYS`; only a hash of each key is ever held by the server,
    verified in constant time. A missing or invalid credential returns 401
    before a Business Transaction is even constructed, independent of Policy
    evaluation and gateway attestation, see
    `packages/api/src/middleware/caller-auth.ts` and
    [Authentication](/api-reference/authentication). Local development may set
    `PARMANA_AUTH_DISABLED=true` to skip this middleware entirely; that flag
    must never be set in a real deployment.
  contact:
    name: Parmana Systems
    email: founder@parmanasystems.com
  license:
    name: Proprietary, source-available for evaluation only, see LICENSE
    url: https://github.com/pavancharak/AgentLabsBuildathon/blob/main/LICENSE
servers:
  - url: https://parmana-api-real.vercel.app
    description: Production (real, deployed instance -- the docs site playground
      uses this by default)
  - url: http://localhost:3000
    description: Local (packages/api, PORT env var, default 3000)
security:
  - bearerAuth: []
tags:
  - name: Execution
    description: Executes a Business Transaction through the complete Execution
      Trust pipeline
  - name: Transactions
    description: Business Transaction creation and retrieval
  - name: Verification
    description: Deterministic verification of an Execution Trust Record
  - name: Receipts
    description: Cryptographically signed Execution Trust Receipts
  - name: Trust Records
    description: Execution Trust Record retrieval
  - name: Replay
    description: Deterministic replay of a recorded Execution Trust Record
  - name: Policies
    description: Policy existence/readability check
  - name: Policy Governance
    description: Maker-checker proposal, listing, approval, and rejection of policy changes
  - name: Approvers
    description: Maker-checker for the keys trusted to sign approvals, without a deploy
  - name: External Connectors
    description: Maker-checker for binding a capability to an operator's HTTPS
      endpoint and its policy, without a deploy (ADR-0013)
  - name: Refusal Records
    description: Durable, signed evidence that a policy decision rejected a
      transaction (RFC-0021)
  - name: Execution Intents
    description: A signed statement, stored before an action is released, of exactly
      what is about to be released, plus the operator tools to find and repair a
      released action that has no signed Trust Record (ADR-0012)
  - name: Audit
    description: Signed caller-authentication audit events, independently
      third-party-verifiable
  - name: System
    description: Operational endpoints
paths:
  /:
    get:
      tags:
        - System
      summary: Root
      operationId: getRoot
      description: >
        Minimal liveness response. Not registered under any router file, defined
        directly in packages/api/src/app.ts, ahead of every mounted route.
        Requires caller authentication, like every route not listed as exempt in
        this document's top-level description. See the security scheme above.
      responses:
        "200":
          description: Service is responding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/root-response.schema"
              examples:
                root:
                  summary: Real captured response
                  value:
                    name: Parmana
                    status: UP
        "401":
          $ref: "#/components/responses/Unauthorized"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/ \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: >-
            const response = await fetch("https://parmana-api-real.vercel.app/",
            {
              headers: { Authorization: `Bearer ${process.env.PARMANA_API_KEY}` },
            });


            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: >-
            import os


            import requests


            response = requests.get(
                "https://parmana-api-real.vercel.app/",
                headers={"Authorization": f"Bearer {os.environ['PARMANA_API_KEY']}"},
                timeout=30,
            )


            print(response.status_code, response.json())
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      description: >
        Returns the operational health of the Parmana service. Always returns
        status: "UP" unconditionally. See the response schema description for
        exactly what this endpoint does and does not check.


        One of several routes exempt from caller authentication, see the top of
        this document for the full list. Liveness probes must be able to reach
        it with no credential, see packages/api/src/app.ts (mounted ahead of the
        caller-auth middleware).
      security: []
      responses:
        "200":
          description: Service health information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/health-response.schema"
              examples:
                health:
                  summary: Real captured response
                  value:
                    status: UP
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/health
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const health = await client.health();

            console.log(health.status);
        - lang: python
          label: Python
          source: |-
            import os

            from parmana import ParmanaClient

            client = ParmanaClient(
                endpoint="https://parmana-api-real.vercel.app",
                api_key=os.environ["PARMANA_API_KEY"],
            )

            health = client.health()

            print(health["status"])
  /ready:
    get:
      tags:
        - System
      summary: Readiness check
      operationId: getReady
      description: >
        Readiness probe, distinct from GET /health's pure liveness check: when
        storage is Supabase-backed, this one actually queries Postgres (SELECT
        1, no table rows transferred) so an orchestrator can tell a process that
        is up but backed by dead storage apart from one that is genuinely ready
        to serve traffic. When storage is not Supabase-backed (NODE_ENV=test, or
        PARMANA_STORAGE=memory outside test), there is no external dependency to
        probe, so this reports READY unconditionally. Exempt from caller
        authentication for the same reason GET /health is, see
        packages/api/src/routes/ready.ts.
      security: []
      responses:
        "200":
          description: Storage reachable, or not Supabase-backed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ready-response.schema"
              examples:
                authEnabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: false
                authDisabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: true
                    warning: PARMANA_AUTH_DISABLED=true -- this deployment is accepting requests
                      with no caller authentication. Must never be set in a real
                      deployment.
        "503":
          description: Supabase-backed storage is configured but Postgres could not be
            reached. Shape derived from packages/api/src/routes/ready.ts's catch
            branch, not independently reproducible outside a real
            Supabase-backed deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ready-response.schema"
              examples:
                notReady:
                  summary: Shape, not a live capture
                  value:
                    status: NOT_READY
                    reason: connect ECONNREFUSED 127.0.0.1:5432
                    authDisabled: false
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/ready
        - lang: typescript
          label: TypeScript
          source: >-
            const response = await
            fetch("https://parmana-api-real.vercel.app/ready");


            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get(
                "https://parmana-api-real.vercel.app/ready",
                timeout=30,
            )

            print(response.status_code, response.json())
  /openapi.yaml:
    get:
      tags:
        - System
      summary: Get the OpenAPI spec
      operationId: getOpenApiSpec
      description: >
        Serves the bundled, self-contained OpenAPI document
        (openapi/openapi.bundled.yaml, produced by `npm run bundle:openapi` from
        openapi/openapi.yaml + schemas/*.json) as a static file, see
        packages/api/src/routes/openapi.ts. Exempt from caller authentication
        for the same reason GET /health is: a caller cannot discover how to get
        a key from a spec it isn't allowed to read. See [Deploy
        patterns](/guides/deploy-patterns#the-openapi-spec-endpoint) for the
        tradeoff of exposing this in production versus disabling it.
      security: []
      responses:
        "200":
          description: The complete OpenAPI 3.1 document, YAML, self-contained (no
            external $ref).
          content:
            application/yaml:
              schema:
                type: string
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/openapi.yaml
        - lang: typescript
          label: TypeScript
          source: |-
            const response = await fetch(
              "https://parmana-api-real.vercel.app/openapi.yaml",
            );

            console.log(response.status, await response.text());
        - lang: python
          label: Python
          source: |-
            import requests

            response = requests.get(
                "https://parmana-api-real.vercel.app/openapi.yaml",
                timeout=30,
            )

            print(response.status_code, response.text)
  /openapi.json:
    get:
      tags:
        - System
      summary: Get the OpenAPI spec, as JSON
      operationId: getOpenApiSpecJson
      description: >
        The same bundled spec as GET /openapi.yaml, JSON-serialized instead of
        YAML, see packages/api/src/routes/openapi-json.ts. Exists because some
        tooling, and most AI coding agents, expects a machine-readable spec at a
        .json path by convention. Both routes describe the identical spec; pick
        whichever format your tooling consumes.
      security: []
      responses:
        "200":
          description: The complete OpenAPI 3.1 document, JSON, self-contained (no
            external $ref).
          content:
            application/json:
              schema:
                type: object
      x-codeSamples:
        - lang: bash
          label: cURL
          source: curl https://parmana-api-real.vercel.app/openapi.json
        - lang: typescript
          label: TypeScript
          source: |-
