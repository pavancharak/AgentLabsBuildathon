  /keys/{keyId}:
    get:
      tags:
        - System
      summary: Fetch a public signing key for independent, offline verification
      operationId: getKey
      description: >
        Deliberately unauthenticated, like GET /audit/verify and GET
        /refusal/verify. A third party (regulator, auditor, customer tool)
        fetching the key it needs to independently verify a signature cannot be
        required to already hold a Parmana credential to reach it. Returns the
        current or any still-retained historical key's public half; a keyId
        whose private key was rotated away from is still resolvable here as long
        as its files were not deleted. See
        packages/crypto/src/OfflineVerifier.ts (and its Python counterpart,
        python/parmana/crypto/ offline_verifier.py) for a reference verifier
        that consumes exactly this response's `pem` field with zero further
        network calls.
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested public key.
          content:
            application/json:
              schema:
                type: object
                required:
                  - keyId
                  - algorithm
                  - use
                  - pem
                properties:
                  keyId:
                    type: string
                  algorithm:
                    type: string
                    description: >
                      The key's actual algorithm, derived from the key material
                      itself (asymmetricKeyType), not a global config value.
                  use:
                    type: string
                    enum:
                      - sig
                  pem:
                    type: string
                    description: PEM-encoded SPKI public key (RFC 7468).
                  jwk:
                    type: object
                    description: >
                      Node's native JWK export for this key's algorithm, when
                      available. Ed25519 exports as kty "OKP"; ML-DSA-65 exports
                      as kty "AKP" (the IETF JOSE/COSE key type for ML-DSA, not
                      an identifier this codebase invented). Omitted, not null,
                      when unavailable.
              examples:
                defaultKey:
                  summary: Real captured response
                  value:
                    keyId: default
                    algorithm: ed25519
                    use: sig
                    pem: |
                      -----BEGIN PUBLIC KEY-----
                      MCowBQYDK2VwAyEAQKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI=
                      -----END PUBLIC KEY-----
                    jwk:
                      crv: Ed25519
                      x: QKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI
                      kty: OKP
        "404":
          description: No key exists for the given keyId.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                unknownKey:
                  summary: Real captured response
                  value:
                    error: "Key not found: does-not-exist"
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/keys/default \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const key = await client.publicKey("default");

            console.log(key.pem);
        - lang: python
          label: Python
          source: |-
            import os

            from parmana import ParmanaClient

            client = ParmanaClient(
                endpoint="https://parmana-api-real.vercel.app",
                api_key=os.environ["PARMANA_API_KEY"],
            )

            key = client.public_key("default")

            print(key.pem)
  /.well-known/jwks.json:
    get:
      tags:
        - System
      summary: List every public signing key this deployment can currently produce
      operationId: getJwks
      description: >
        Same unauthenticated, third-party-verification purpose as GET
        /keys/{keyId}, this is the enumeration form. Not a standards-pure RFC
        7517 JWK Set (not every entry necessarily has a `jwk` field), but a
        superset any consumer that only wants `.jwk` per entry can filter down
        to.
      responses:
        "200":
          description: Every key this deployment can currently produce a public key for.
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required:
                        - keyId
                        - algorithm
                        - use
                        - pem
                      properties:
                        keyId:
                          type: string
                        algorithm:
                          type: string
                        use:
                          type: string
                          enum:
                            - sig
                        pem:
                          type: string
                        jwk:
                          type: object
              examples:
                keys:
                  summary: Real captured response
                  value:
                    keys:
                      - keyId: default
                        algorithm: ed25519
                        use: sig
                        pem: |
                          -----BEGIN PUBLIC KEY-----
                          MCowBQYDK2VwAyEAQKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI=
                          -----END PUBLIC KEY-----
                        jwk:
                          crv: Ed25519
                          x: QKyaz9ifANjaew96i34spqhM31mBatJ6TTHaMY7mclI
                          kty: OKP
                      - keyId: gateway
                        algorithm: ed25519
                        use: sig
                        pem: |
                          -----BEGIN PUBLIC KEY-----
                          MCowBQYDK2VwAyEAFIS92deNnIcw9U2ZrLxYo6Uqmt31SN0OKwoFhipfObk=
                          -----END PUBLIC KEY-----
                        jwk:
                          crv: Ed25519
                          x: FIS92deNnIcw9U2ZrLxYo6Uqmt31SN0OKwoFhipfObk
                          kty: OKP
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/.well-known/jwks.json \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: >-
            const response = await fetch(
              "https://parmana-api-real.vercel.app/.well-known/jwks.json",
              {
                headers: { Authorization: `Bearer ${process.env.PARMANA_API_KEY}` },
              },
            );


            console.log(response.status, await response.json());
        - lang: python
          label: Python
          source: >-
            import os


            import requests


            response = requests.get(
                "https://parmana-api-real.vercel.app/.well-known/jwks.json",
                headers={"Authorization": f"Bearer {os.environ['PARMANA_API_KEY']}"},
                timeout=30,
            )


            print(response.status_code, response.json())
  /callers/me:
    get:
      tags:
        - System
      summary: Get the authenticated caller's identity and resolved scope
      operationId: getCallerMe
      description: >
        The proof artifact a security review asks for: "show me this agent's
        identity and exactly what it's authorized to do." Read-only, self-lookup
        only, an authenticated caller sees its own record, never another
        caller's, and this never returns key material. Values are resolved (the
        effective scope after defaults are applied), not the raw configured
        entry: allowedPrincipalIds defaults to [callerId] and
        allowedCapabilities defaults to an empty array when unset on the key,
        see packages/api/src/routes/callers-me.ts. Requires caller
        authentication, like every route not listed as exempt in this document's
        top-level description.


        Returns 404 with {"error":"No authenticated caller identity available."}
        when no caller identity is present on the request, which in practice
        only happens when caller authentication is disabled
        (PARMANA_AUTH_DISABLED=true, local development only). Under normal,
        authenticated operation this route always has a callerId by the time it
        runs.
      responses:
        "200":
          description: The authenticated caller's identity and resolved scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/callers-me-response.schema"
              examples:
                callerMe:
                  summary: Real captured response
                  value:
                    callerId: demo
                    allowedPrincipalIds:
                      - demo
                    allowedCapabilities:
                      - test:fixture-execute
                    unrestrictedCapabilities: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No authenticated caller identity on the request (caller auth
            disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                noCallerIdentity:
                  summary: Real captured response when caller-auth is disabled
                  value:
                    error: No authenticated caller identity available.
      x-codeSamples:
        - lang: bash
          label: cURL
          source: |-
            curl https://parmana-api-real.vercel.app/callers/me \
              -H "Authorization: Bearer $PARMANA_API_KEY"
        - lang: typescript
          label: TypeScript
          source: |-
            import { ParmanaClient } from "@parmana/sdk";

            const client = new ParmanaClient({
              endpoint: "https://parmana-api-real.vercel.app",
              apiKey: process.env.PARMANA_API_KEY!,
            });

            const me = await client.caller();

            console.log(me.callerId, me.allowedCapabilities);
        - lang: python
          label: Python
          source: |-
            import os

            from parmana import ParmanaClient

            client = ParmanaClient(
