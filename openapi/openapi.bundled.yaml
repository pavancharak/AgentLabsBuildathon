                  value:
                    error: Capability 'erp:create-invoice' already has an active external connector.
                      Revoke it first.
                    code: CONFLICT
                revokeUnregistered:
                  summary: Real captured response
                  value:
                    error: Capability 'erp:create-invoice' has no active external connector.
                    code: CONFLICT
