      operationId: proposeApprovalIssuerChange
      description: >
        Proposes adding an approver key (action add, with the approver Ed25519
        public key) or revoking a key added this way (action revoke). Nothing
        changes until a different person approves the proposal. Requires a human
        credential. A key listed in the server code is refused (409): change
        those with a pull request. A key id that already exists, revoked or not,
        cannot be added again: rotate by adding a new key id, then revoking the
        old one.
