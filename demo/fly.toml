# fly.toml app configuration for parmana-exp-demo
#
# Agent Labs Buildathon demo — standalone scoped-credential execution demo.
# See https://fly.io/docs/reference/configuration/ for details.

app = "parmana-exp-demo"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile.fly"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
