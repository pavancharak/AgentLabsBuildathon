          content:
            application/json:
              schema:
                $ref: "#/components/schemas/verify-result-response.schema"
              examples:
                invalid:
                  summary: Real captured response (this environment's in-memory audit sink never
                    signs, so no genuinely valid signature is capturable here)
                  value:
                    valid: false
        "400":
          description: Request body is not a structurally plausible { event, signature }
            pair.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                malformed:
                  summary: Real captured response
                  value:
                    error: "Request body must be { event, signature } (event: type, occurredAt,
                      route; signature: algorithm, keyId, value required)."
