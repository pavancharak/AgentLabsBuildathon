                    trustRecordHash: e20a8861864f1a0a6c5fe00e64abca04de18a7d165a82ef9d7beb458c2096b3f
                    verified: true
        "400":
          description: businessTransactionId missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    error: businessTransactionId is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: businessTransactionId does not correspond to any Execution Trust
            Record (VerificationFailedError, the same not-found error used by
            POST /verify).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Execution Trust Record not found.
                    code: VERIFICATION_FAILED
  /policies/validate:
    post:
      tags:
        - Policies
      summary: Validate that a Policy exists and is readable
      operationId: validatePolicy
      description: >
        Checks that policies/{policyId}/{policyVersion}/policy.json exists and
        parses. Does NOT use the shared Error envelope for its failure
        responses: every status code (200, 400, 404) returns the same {valid,
        errors} shape. Field checks run in order: policyId first, then
        policyVersion; the first missing/empty field short-circuits with its own
        message. The one exception is 401: caller authentication runs in
        middleware, before this handler is ever reached, so a rejected caller
        gets the shared Error envelope ({"error": "authentication required"}),
        not {valid, errors}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/policy-validate-request.schema"
            examples:
              vendor-payment:
                summary: Real captured request
                value:
                  policyId: vendor-payment
                  policyVersion: 2.0.0
              notFound:
                summary: Real captured request, unknown policy
                value:
                  policyId: does-not-exist
                  policyVersion: 9.9.9
      responses:
        "200":
          description: Policy exists and is readable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/policy-validate-response.schema"
              examples:
                vendor-payment:
                  summary: Real captured response
                  value:
                    valid: true
                    errors: []
        "400":
          description: policyId or policyVersion missing/empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/policy-validate-response.schema"
              examples:
                missingField:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - policyVersion is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No policy.json exists at the requested name/version
            (PolicyNotFoundError, caught locally and re-shaped, not routed
            through the shared error handler).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/policy-validate-response.schema"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    valid: false
                    errors:
                      - Policy 'does-not-exist' version '9.9.9' was not found.
  /policies/{name}/{version}/pending-changes:
    post:
      tags:
        - Policy Governance
      summary: Propose a policy change (maker)
      operationId: proposePolicyChange
      description: >
        Proposes a change to a policy's content (Policy Governance,
        maker-checker). {version} is the existing version this proposal is a
        change against ("the version being replaced"); proposedContent's own
        policyVersion may equal it (an in-place content patch) or differ (a
        version bump). Requires a human-authenticated caller
        (credentialHolderType USER); a SERVICE-credentialed or unverified caller
        is denied with 403 NON_HUMAN_CALLER_DENIED, and a signed
        caller.non_human_denied audit event is recorded. proposedContent is
        validated with the same rules POST /policies/validate checks, plus:
        proposedContent.policyId must equal {name}, and
        proposedContent.policyVersion must match ^[A-Za-z0-9._-]+$.
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._-]+$
        - name: version
          in: path
          required: true
          schema:
            type: string
            pattern: ^[A-Za-z0-9._-]+$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/propose-policy-change-request.schema"
      responses:
        "201":
          description: Pending Policy Change created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pending-policy-change.schema"
              examples:
                proposed:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition:
                            always: true
                          outcome:
                            action: approve
                            reason: OpenAPI spec capture fixture
                    proposedBy: human-maker
                    proposedAt: 2026-09-15T03:47:13.920Z
                    status: PENDING_APPROVAL
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
        "400":
          description: name/version pattern invalid, reason missing, proposedContent
            malformed, or proposedContent fails Policy validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                missingReason:
                  summary: Real captured response
                  value:
                    error: reason is required.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not human-credentialed (NON_HUMAN_CALLER_DENIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                nonHuman:
                  summary: Shape, derived from NonHumanCallerDeniedError source (not independently
                    captured in this run)
                  value:
                    error: "This action requires a caller credential provisioned as a verified human
                      (credentialHolderType: USER)."
                    code: NON_HUMAN_CALLER_DENIED
  /policies/pending-changes:
    get:
      tags:
        - Policy Governance
      summary: List pending policy changes (maker-checker)
      operationId: listPendingPolicyChanges
      description: >
        Lists Pending Policy Changes, each alongside a diff view: current (the
        live content at (policyName, policyVersion) today, or null if that
        version has never been published) and proposed (the change's own
        proposedContent). Requires a human-authenticated caller, the same
        discipline as POST .../pending-changes.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING_APPROVAL
              - APPROVED
              - REJECTED
      responses:
        "200":
          description: Pending Policy Changes, with diff.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pending-changes-list-response.schema"
              examples:
                oneOpen:
                  summary: Real captured response
                  value:
                    changes:
                      - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                        policyName: openapi-capture-demo
                        policyVersion: 1.0.0
                        proposedContent:
                          policyId: openapi-capture-demo
                          policyVersion: 1.0.0
                          schemaVersion: 1.0.0
                          rules:
                            - id: always-approve
                              condition:
                                always: true
                              outcome:
                                action: approve
                                reason: OpenAPI spec capture fixture
                        proposedBy: human-maker
                        proposedAt: 2026-09-15T03:47:13.920Z
                        status: PENDING_APPROVAL
                        reason: Capture a real Pending Policy Change for the OpenAPI spec
                        diff:
                          current: null
                          proposed:
                            policyId: openapi-capture-demo
                            policyVersion: 1.0.0
                            schemaVersion: 1.0.0
                            rules:
                              - id: always-approve
                                condition:
                                  always: true
                                outcome:
                                  action: approve
                                  reason: OpenAPI spec capture fixture
        "400":
          description: status query param is not one of PENDING_APPROVAL, APPROVED,
            REJECTED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Caller is not human-credentialed (NON_HUMAN_CALLER_DENIED).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
  /policies/pending-changes/{id}/approve:
    post:
      tags:
        - Policy Governance
      summary: Approve a pending policy change (checker)
      operationId: approvePolicyChange
      description: >
        Approves a Pending Policy Change (checker). Requires, in order, all
        fail-closed: a human-authenticated caller distinct from the proposer
        (maker != checker, 403 SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE otherwise),
        and a valid step-up authorization envelope proving fresh, explicit
        intent (403 STEP_UP_AUTHORIZATION_INVALID on a missing, malformed,
        expired, replayed, wrong-id, wrong-action, or wrong-key-signed
        envelope). Once both pass, this writes the live
        policies/{policyName}/{policyVersion}/policy.json file and records a
        signed PolicyChangeApprovalRecord BEFORE marking the change APPROVED, so
        a failure partway through never leaves a pending change falsely resolved
        with no corresponding live effect. Per-check step-up diagnostic detail
        is logged server-side only, never in this response.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/approve-policy-change-request.schema"
      responses:
        "200":
          description: Approved. The live policy.json file has been written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pending-policy-change.schema"
              examples:
                approved:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
                    policyName: openapi-capture-demo
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition:
                            always: true
                          outcome:
                            action: approve
                            reason: OpenAPI spec capture fixture
                    proposedBy: human-maker
                    proposedAt: 2026-09-15T03:47:13.920Z
                    status: APPROVED
                    reason: Capture a real Pending Policy Change for the OpenAPI spec
                    resolvedBy: human-checker
                    resolvedAt: 2026-09-15T03:48:03.586Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or
            STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                sameActor:
                  summary: Real captured response
                  value:
                    error: Pending Policy Change '307d8265-1171-49a4-b13f-fc3d3ae323e3' was proposed
                      by this same caller — the proposer (maker) may not also
                      approve or reject it (checker).
                    code: SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE
                stepUpInvalid:
                  summary: Real captured response
                  value:
                    error: The step-up authorization envelope is missing, invalid, expired,
                      replayed, or does not match this request.
                    code: STEP_UP_AUTHORIZATION_INVALID
        "404":
          description: No Pending Policy Change exists for this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                notFound:
                  summary: Real captured response
                  value:
                    error: Pending Policy Change '00000000-0000-0000-0000-000000000000' not found.
                    code: PENDING_POLICY_CHANGE_NOT_FOUND
        "500":
          description: Server misconfigured, no PolicyChangeApprovalService provided.
            Fails closed, never marks the change APPROVED without applying its
            live effect.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
  /policies/pending-changes/{id}/reject:
    post:
      tags:
        - Policy Governance
      summary: Reject a pending policy change (checker)
      operationId: rejectPolicyChange
      description: >
        Rejects a Pending Policy Change (checker). Same discipline as approve
        (human, maker != checker, step-up authorization), but never touches the
        live policy file, a rejection is purely a repository state transition
        with no PolicyChangeApprovalRecord of its own.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/reject-policy-change-request.schema"
      responses:
        "200":
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/pending-policy-change.schema"
              examples:
                rejected:
                  summary: Real captured response
                  value:
                    pendingPolicyChangeId: 5617ba3c-fb07-437d-9131-232b84bbb863
                    policyName: openapi-capture-demo-reject
                    policyVersion: 1.0.0
                    proposedContent:
                      policyId: openapi-capture-demo-reject
                      policyVersion: 1.0.0
                      schemaVersion: 1.0.0
                      rules:
                        - id: always-approve
                          condition:
                            always: true
                          outcome:
                            action: approve
                            reason: OpenAPI spec capture fixture
                    proposedBy: human-maker
                    proposedAt: 2026-09-15T03:48:09.512Z
                    status: REJECTED
                    reason: Capture a real rejected Pending Policy Change for the OpenAPI spec
                    resolvedBy: human-checker
                    resolvedAt: 2026-09-15T03:48:21.422Z
                    rejectionReason: Does not meet the bar for this fixture
        "400":
          description: rejectionReason missing or empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: NON_HUMAN_CALLER_DENIED, SAME_ACTOR_CANNOT_APPROVE_OWN_CHANGE, or
            STEP_UP_AUTHORIZATION_INVALID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
        "404":
          description: No Pending Policy Change exists for this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
components:
  schemas:
    Error:
      $ref: "#/components/schemas/error.schema"
    root-response.schema:
      title: Root Response
      description: Response returned by GET / (packages/api/src/app.ts). Distinct
        from, and simpler than, GET /health and GET /version; it is not
        registered under any router file.
      type: object
      additionalProperties: false
      required:
        - name
        - status
      properties:
        name:
          type: string
          enum:
            - Parmana
        status:
          type: string
          enum:
            - UP
      examples:
        - name: Parmana
          status: UP
    error.schema:
      title: Error Response
      description: Shared error envelope produced by
        packages/api/src/middleware/error-handler.ts and by every route's inline
        validation checks. error is always a plain human-readable string (never
        a nested object). code is present only when the failure was a
        RuntimeError subclass reaching the centralized error handler
        (VerificationFailedError, ReceiptGenerationError, or an uncategorized
        RuntimeError); it is absent from every inline route-level check
        (businessTransactionId format/required checks) and from
        BusinessTransactionValidationError, PolicyValidationError,
        SignalValidationError, PolicyNotFoundError,
        DuplicateBusinessTransactionError, and the generic 500 fallback. POST
        /policies/validate does NOT use this envelope at all. See its own
        response schema. For the triggering condition and recommended caller
        action behind any specific error/code/status combination, see the Error
        catalog at /api-reference/error-catalog.
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Stable machine-readable error code. Only present for errors that
            reach the handler as a RuntimeError.
          examples:
            - RUNTIME_ERROR
            - VERIFICATION_FAILED
            - RECEIPT_GENERATION_FAILED
            - POLICY_DENIED
            - CAPABILITY_NOT_ALLOWED
            - RATE_LIMITED
            - AUDIT_UNAVAILABLE
            - SIGNING_UNAVAILABLE
            - CONNECTOR_NOT_REGISTERED
            - EXECUTION_RECORD_INCOMPLETE
      examples:
        - error: businessTransactionId must be a valid UUID.
        - error: Business Transaction 'eed2a972-1bf5-4166-8472-761f76fbf1b2' already
            exists.
        - error: "Execution rejected: Vendor payment rejected because the assessed payment
            risk exceeds the maximum permitted threshold."
          code: RUNTIME_ERROR
    health-response.schema:
      title: Health Response
      description: 'Response returned by GET /health. The route unconditionally
        returns status: "UP"; it does not check storage, policy, or any
        dependent component; a 200 response means only that the Express process
        is handling requests.'
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - UP
      examples:
        - status: UP
    ready-response.schema:
      title: Ready Response
      description: "Response returned by GET /ready on both status codes (200 READY,
        503 NOT_READY). Distinct from GET /health's pure liveness check: when
        storage is Supabase-backed, this one actually queries Postgres (SELECT
        1) so an orchestrator can route around a process that is up but backed
        by dead storage."
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - READY
            - NOT_READY
        storage:
          type: string
          description: "Present only when status is READY and storage is not
            Supabase-backed (NODE_ENV=test, or PARMANA_STORAGE=memory outside
            test): there is no external dependency to probe, so readiness is
            reported unconditionally."
          enum:
            - not-supabase-backed
        reason:
          type: string
          description: "Present only when status is NOT_READY: the underlying Postgres
            error message."
        authDisabled:
          type: boolean
          description: True when this process was started with PARMANA_AUTH_DISABLED=true.
            Surfaced here, not only as a startup log line, so an operator's own
            synthetic checks against GET /ready can alert on it directly.
        warning:
          type: string
          description: Present only when authDisabled is true.
      examples:
        - status: READY
          storage: not-supabase-backed
          authDisabled: false
        - status: READY
          storage: not-supabase-backed
          authDisabled: true
          warning: PARMANA_AUTH_DISABLED=true -- this deployment is accepting requests
            with no caller authentication. Must never be set in a real
            deployment.
    version-response.schema:
      title: Version Response
      description: Response returned by GET /version. All three fields are hardcoded
        literals in packages/api/src/routes/version.ts, not read from
        package.json or any build metadata.
      type: object
      additionalProperties: false
      required:
        - name
        - version
        - api
      properties:
        name:
          type: string
          enum:
            - Parmana
        version:
          type: string
          description: Hardcoded running service version string.
        api:
          type: string
          enum:
            - v1
      examples:
        - name: Parmana
          version: 0.4.0
          api: v1
    callers-me-response.schema:
      title: Callers Me Response
      description: "Response returned by GET /callers/me
        (packages/api/src/routes/callers-me.ts). Resolved, not raw:
        allowedPrincipalIds/allowedCapabilities reflect the effective scope
        after defaults are applied (isPrincipalAllowed.ts /
        isCapabilityAllowed.ts), not the raw ApiKeyEntry configuration. Never
        returns key material."
      type: object
      additionalProperties: false
      required:
        - callerId
        - allowedPrincipalIds
        - allowedCapabilities
        - unrestrictedCapabilities
      properties:
        callerId:
          type: string
          description: The authenticated caller's identity.
        allowedPrincipalIds:
          type: array
          items:
            type: string
          description: Principal IDs this caller may assert as authority.principalId.
            Defaults to [callerId] when the key's allowedPrincipalIds is unset.
        allowedCapabilities:
          type: array
          items:
            type: string
          description: Capabilities (intent.action values) this caller may execute.
            Defaults to an empty array, not all capabilities, when the key's
            allowedCapabilities is unset.
        unrestrictedCapabilities:
          type: boolean
          description: True when allowedCapabilities contains the wildcard "*".
      examples:
        - callerId: demo
          allowedPrincipalIds:
            - demo
          allowedCapabilities:
            - test:fixture-execute
          unrestrictedCapabilities: false
    metadata.schema:
      title: Metadata
      description: Immutable Business Transaction metadata supplied by the calling
        application. Not evaluated by Policy. businessTransactionId is the only
        required field; it must match the top-level businessTransactionId.
        Parmana rejects a mismatch with a 400.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Unique Business Transaction identifier. Must be a valid UUID.
        correlationId:
          type: string
          description: Optional correlation identifier used by the calling application.
        tenantId:
          type: string
          description: Optional tenant identifier for multi-tenant deployments.
        sourceSystem:
          type: string
          description: Originating application or service.
        submittedBy:
          type: string
          description: Identity of the calling application or principal.
        submittedAt:
          type: string
          format: date-time
          description: UTC timestamp when the Business Transaction was submitted.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          correlationId: 6b97caca-1605-4711-bf00-7e5a65434d93
          sourceSystem: vendor-payment-service
          submittedBy: ap-automation
          submittedAt: 2026-07-07T16:38:59.285Z
    authority.schema:
      title: Authority
      description: Entity empowered to authorize execution within a trust domain.
        Immutable once issued.
      type: object
      additionalProperties: true
      required:
        - authorityId
        - authorityType
        - principalId
        - issuedAt
      properties:
        authorityId:
          type: string
          description: Unique Authority identifier.
        authorityType:
          type: string
          description: Type of authority.
          enum:
            - USER
            - ROLE
            - SERVICE
            - ORGANIZATION
        principalId:
          type: string
          description: Principal identifier.
        displayName:
          type: string
          description: Human-readable display name.
        issuedAt:
          type: string
          format: date-time
          description: UTC timestamp when Authority became effective.
      examples:
        - authorityId: c0c01c23-04a2-45f2-a821-ef24bfca02d3
          authorityType: SERVICE
          principalId: ap-automation-svc
          displayName: Accounts Payable Automation
          issuedAt: 2026-07-07T16:38:59.285Z
    authorization.schema:
      title: Authorization
      description: Immutable trust artifact proving that an Authority granted approval
        for an intended execution.
      type: object
      additionalProperties: true
      required:
        - authorizationId
        - authorityId
        - purpose
        - issuedAt
      properties:
        authorizationId:
          type: string
          description: Unique Authorization identifier.
        authorityId:
          type: string
          description: Authority issuing this Authorization. Must match
            authority.authorityId. Parmana rejects a mismatch with a 400.
        purpose:
          type: string
          description: Business purpose for which the Authorization was granted.
        issuedAt:
          type: string
          format: date-time
          description: UTC timestamp when the Authorization was issued.
        expiresAt:
          type: string
          format: date-time
          description: Optional expiration timestamp. After this time the Authorization is
            no longer valid.
      examples:
        - authorizationId: 6e9d6aa6-6d20-40a8-b05d-383516365cc7
          authorityId: c0c01c23-04a2-45f2-a821-ef24bfca02d3
          purpose: Authorize vendor payment disbursement
          issuedAt: 2026-07-07T16:38:59.285Z
    intent.schema:
      title: Intent
      description: Immutable declaration of the action an Authority intends to be
        executed under an Authorization.
      type: object
      additionalProperties: true
      required:
        - intentId
        - authorizationId
        - action
        - target
        - parameters
        - createdAt
      properties:
        intentId:
          type: string
          description: Unique Intent identifier.
        authorizationId:
          type: string
          description: Authorization under which this Intent was created. Must match
            authorization.authorizationId. Parmana rejects a mismatch with a
            400.
        action:
          type: string
          description: Business action being requested. Required and non-empty. Parmana
            rejects an empty action with a 400.
          examples:
            - VendorPayment
            - TransferFunds
            - DeployApplication
        target:
          type: string
          description: Target of the intended action.
          examples:
            - vendor/V-100
            - account/12345
        parameters:
          type: object
          description: Immutable business parameters describing the intended action. Not
            evaluated by policy, see signals.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when the Intent was created.
      examples:
        - intentId: ae5865f6-181b-409a-90ec-1b4b8b8414ba
          authorizationId: 6e9d6aa6-6d20-40a8-b05d-383516365cc7
          action: payments:execute
          target: vendor/V-100
          parameters:
            amount: 4500
            currency: USD
          createdAt: 2026-07-07T16:38:59.285Z
    policy.schema:
      title: Policy Reference
      description: Exact Policy to evaluate. The client explicitly supplies name,
        version, and schemaVersion; Parmana does not automatically discover or
        select a policy. If no matching policy file exists at
        policies/{name}/{version}/policy.json, the request fails with a 404
        (policyId/policyVersion on POST /policies/validate) or a RUNTIME_ERROR
        (name/version elsewhere, from PolicyNotFoundError not otherwise mapped
        by the shared error handler in every route, see the error envelope
        note).
      type: object
      additionalProperties: true
      required:
        - name
        - version
        - schemaVersion
      properties:
        name:
          type: string
          description: Policy name. Required and non-empty. Parmana rejects an empty name
            with a 400.
          minLength: 1
        version:
          type: string
          description: Business policy version. Required and non-empty. Parmana rejects an
            empty version with a 400.
          minLength: 1
          examples:
            - 2.0.0
            - 1.0.0
        schemaVersion:
          type: string
          description: Signals schema version expected by the policy.
          examples:
            - 1.0.0
        contentHash:
          type: string
          description: sha256 of the canonicalized policy.json content actually loaded for
            this decision (G-24). Server-computed, never caller-settable; absent
            on a request-supplied PolicyReference and on a PolicyReference built
            before this field existed. Only present on the copy embedded in an
            Execution Trust Record's transaction.policy.
        governanceAnchor:
          type: object
          description: Whether the policy content above is traceable to a completed Policy
            Governance approval, resolved at decision time (G-45). Absent on a
            PolicyReference built before this field existed. Its presence does
            not imply POLICY_EXECUTION_VERIFICATION_ENFORCED is on -- only that
            the lookup ran and recorded what it found, which may honestly be "no
            approval record exists for this policy yet."
          additionalProperties: false
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - VERIFIED
                - NO_APPROVAL_RECORD
                - SIGNATURE_INVALID
                - CONTENT_MISMATCH
            approvalRecordId:
              type: string
              description: The PolicyChangeApprovalRecord this anchor resolved against.
                Present only when a record was found at all -- absent for
                NO_APPROVAL_RECORD.
      examples:
        - name: vendor-payment
          version: 2.0.0
          schemaVersion: 1.0.0
        - name: vendor-payment
          version: 2.0.0
          schemaVersion: 1.0.0
          contentHash: 3f2504e04f8964e7ad0dbb0cf7fea1b4e0e1e0a3a1e1a4b6c8e0d5f6a7b8c9d0
          governanceAnchor:
            status: NO_APPROVAL_RECORD
    signals.schema:
      title: Signals
      description: Opaque runtime facts evaluated by the resolved Policy's rules.
        Parmana assigns no business meaning to these values and does not
        statically validate them beyond the Policy's own signalsSchema
        declaration (see policies/{name}/{version}/policy.json). Scaled
        integers, not floats, for numeric signals such as amounts (house
        convention across every reference policy).
      type: object
      additionalProperties: true
      examples:
        - vendorVerified: true
          invoiceVerified: true
          paymentApproved: true
          sufficientFunds: true
          paymentAmount: 4500
          riskScore: 10
    transaction-create-request.schema:
      title: Transaction Create Request
      description: "Request payload for POST /execute and POST /transactions. status
        and createdAt are assigned by Parmana and must not be supplied by the
        client. Validation performed identically by both endpoints (each has its
        own inline businessTransactionId UUID check, then shares
        BusinessTransactionMapper.fromRequest and BusinessTransactionValidator):
        metadata.businessTransactionId must equal businessTransactionId;
        authorization.authorityId must equal authority.authorityId;
        intent.authorizationId must equal authorization.authorizationId;
        policy.name, policy.version, and intent.action must each be non-empty.
        No other structural validation is performed: authority, authorization,
        intent, policy, and signals objects are otherwise passed through as
        supplied, including any additional properties."
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
        - metadata
        - authority
        - authorization
        - intent
        - policy
        - signals
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Unique Business Transaction identifier. Must be a valid UUID on
            both POST /execute and POST /transactions (rejected with 400
            otherwise).
        metadata:
          $ref: "#/components/schemas/metadata.schema"
        authority:
          $ref: "#/components/schemas/authority.schema"
        authorization:
          $ref: "#/components/schemas/authorization.schema"
        intent:
          $ref: "#/components/schemas/intent.schema"
        policy:
          $ref: "#/components/schemas/policy.schema"
        signals:
          $ref: "#/components/schemas/signals.schema"
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          metadata:
