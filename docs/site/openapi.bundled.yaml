openapi: 3.1.0
info:
  title: Parmana API
  version: 1.0.0
  description: >
    Parmana is an Execution Trust Infrastructure that ensures there is no gap
    between what humans decide and what AI systems do. The API enables creation,
    execution, verification, replay, and auditing of Business Transactions
    through cryptographically verifiable Execution Trust Records.


    **Every route requires a caller bearer key**, except the liveness/readiness
    probes and documentation/verification routes that must be reachable with no
    credential: GET /health, GET /ready, GET /openapi.yaml, GET /documentation,
    GET /reference, POST /refusal/verify, POST /audit/verify, GET /keys/{keyId},
    and GET /.well-known/jwks.json. Send `Authorization: Bearer <key>` on every
    other request. Keys are issued by `scripts/generate-api-key.ts` and
    configured server-side via `PARMANA_API_KEYS`; only a hash of each key is
    ever held by the server, verified in constant time. A missing or invalid
    credential returns 401 before a Business Transaction is even constructed,
    independent of Policy evaluation and gateway attestation, see
    `packages/api/src/middleware/caller-auth.ts` and
    [Authentication](/api-reference/authentication). Local development may set
    `PARMANA_AUTH_DISABLED=true` to skip this middleware entirely; that flag
    must never be set in a real deployment.
  contact:
    name: Parmana Systems
    email: founder@parmanasystems.com
  license:
    name: Proprietary, source-available for evaluation only, see LICENSE
    url: https://github.com/pavancharak/AgentLabsBuildathon/blob/main/LICENSE
servers:
  - url: https://parmana-api-real.vercel.app
    description: Production (real, deployed instance -- the docs site playground
      uses this by default)
  - url: http://localhost:3000
    description: Local (packages/api, PORT env var, default 3000)
security:
  - bearerAuth: []
tags:
  - name: Execution
    description: Executes a Business Transaction through the complete Execution
      Trust pipeline
  - name: Transactions
    description: Business Transaction creation and retrieval
  - name: Verification
    description: Deterministic verification of an Execution Trust Record
  - name: Receipts
    description: Cryptographically signed Execution Trust Receipts
  - name: Trust Records
    description: Execution Trust Record retrieval
  - name: Replay
    description: Deterministic replay of a recorded Execution Trust Record
  - name: Policies
    description: Policy existence/readability check
  - name: Policy Governance
    description: Maker-checker proposal, listing, approval, and rejection of policy changes
  - name: Refusal Records
    description: Durable, signed evidence that a policy decision rejected a
      transaction (RFC-0021)
  - name: Audit
    description: Signed caller-authentication audit events, independently
      third-party-verifiable
  - name: System
    description: Operational endpoints
paths:
  /:
    get:
      tags:
        - System
      summary: Root
      operationId: getRoot
      description: >
        Minimal liveness response. Not registered under any router file, defined
        directly in packages/api/src/app.ts, ahead of every mounted route.
        Requires caller authentication, like every route not listed as exempt in
        this document's top-level description. See the security scheme above.
      responses:
        "200":
          description: Service is responding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/root-response.schema"
              examples:
                root:
                  summary: Real captured response
                  value:
                    name: Parmana
                    status: UP
        "401":
          $ref: "#/components/responses/Unauthorized"
  /health:
    get:
      tags:
        - System
      summary: Health check
      operationId: getHealth
      description: >
        Returns the operational health of the Parmana service. Always returns
        status: "UP" unconditionally. See the response schema description for
        exactly what this endpoint does and does not check.


        One of several routes exempt from caller authentication, see the top of
        this document for the full list. Liveness probes must be able to reach
        it with no credential, see packages/api/src/app.ts (mounted ahead of the
        caller-auth middleware).
      security: []
      responses:
        "200":
          description: Service health information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/health-response.schema"
              examples:
                health:
                  summary: Real captured response
                  value:
                    status: UP
  /ready:
    get:
      tags:
        - System
      summary: Readiness check
      operationId: getReady
      description: >
        Readiness probe, distinct from GET /health's pure liveness check: when
        storage is Supabase-backed, this one actually queries Postgres (SELECT
        1, no table rows transferred) so an orchestrator can tell a process that
        is up but backed by dead storage apart from one that is genuinely ready
        to serve traffic. When storage is not Supabase-backed (NODE_ENV=test, or
        PARMANA_STORAGE=memory outside test), there is no external dependency to
        probe, so this reports READY unconditionally. Exempt from caller
        authentication for the same reason GET /health is, see
        packages/api/src/routes/ready.ts.
      security: []
      responses:
        "200":
          description: Storage reachable, or not Supabase-backed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ready-response.schema"
              examples:
                authEnabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: false
                authDisabled:
                  summary: Real captured response
                  value:
                    status: READY
                    storage: not-supabase-backed
                    authDisabled: true
                    warning: PARMANA_AUTH_DISABLED=true -- this deployment is accepting requests
                      with no caller authentication. Must never be set in a real
                      deployment.
        "503":
          description: Supabase-backed storage is configured but Postgres could not be
            reached. Shape derived from packages/api/src/routes/ready.ts's catch
            branch, not independently reproducible outside a real
            Supabase-backed deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ready-response.schema"
              examples:
                notReady:
                  summary: Shape, not a live capture
                  value:
                    status: NOT_READY
                    reason: connect ECONNREFUSED 127.0.0.1:5432
                    authDisabled: false
  /openapi.yaml:
    get:
      tags:
        - System
      summary: Get the OpenAPI spec
      operationId: getOpenApiSpec
      description: >
        Serves the bundled, self-contained OpenAPI document
        (openapi/openapi.bundled.yaml, produced by `npm run bundle:openapi` from
        openapi/openapi.yaml + schemas/*.json) as a static file, see
        packages/api/src/routes/openapi.ts. Exempt from caller authentication
        for the same reason GET /health is: a caller cannot discover how to get
        a key from a spec it isn't allowed to read. See [Deploy
        patterns](/guides/deploy-patterns#the-openapi-spec-endpoint) for the
        tradeoff of exposing this in production versus disabling it.
      security: []
      responses:
        "200":
          description: The complete OpenAPI 3.1 document, YAML, self-contained (no
            external $ref).
          content:
            application/yaml:
              schema:
                type: string
  /openapi.json:
    get:
      tags:
        - System
      summary: Get the OpenAPI spec, as JSON
      operationId: getOpenApiSpecJson
      description: >
        The same bundled spec as GET /openapi.yaml, JSON-serialized instead of
        YAML, see packages/api/src/routes/openapi-json.ts. Exists because some
        tooling, and most AI coding agents, expects a machine-readable spec at a
        .json path by convention. Both routes describe the identical spec; pick
        whichever format your tooling consumes.
      security: []
      responses:
        "200":
          description: The complete OpenAPI 3.1 document, JSON, self-contained (no
            external $ref).
          content:
            application/json:
              schema:
                type: object
  /api-manifest.json:
    get:
      tags:
        - System
      summary: Machine-readable SDK and discovery manifest
      operationId: getApiManifest
      description: >
        A single machine-readable index for coding agents and tooling: the
        OpenAPI spec locations, the rendered documentation views, the
        authentication scheme, and both official SDKs (TypeScript and Python)
        with their real, current package name, registry, and version, read
        directly from each package's own manifest at startup, see
        packages/api/src/routes/api-manifest.ts. Go and Java are reported as
        null: no SDK exists for those languages in this repository (see
        /sdks/other-languages on the documentation site). Exempt from caller
        authentication for the same reason GET /openapi.json is.
      security: []
      responses:
        "200":
          description: The manifest, JSON.
          content:
            application/json:
              schema:
                type: object
              examples:
                liveCapture:
                  summary: Real captured response
                  value:
                    name: Parmana
                    apiVersion: v1
                    buildVersion: 0.4.0
                    openapi:
                      json: /openapi.json
                      yaml: /openapi.yaml
                    documentation:
                      site: https://docs.parmanasystems.com
                      swaggerUi: /documentation
                      redoc: /reference
                    authentication:
                      type: bearer
                      header: "Authorization: Bearer <key>"
                      docs: https://docs.parmanasystems.com/api-reference/authentication
                    sdks:
                      typescript:
                        package: "@parmana/sdk"
                        registry: npm
                        version: 1.1.2
                        install: npm install @parmana/sdk
                        docs: https://docs.parmanasystems.com/sdks/typescript
                        reference: https://docs.parmanasystems.com/sdks/reference/typescript/classes/ParmanaClient
                      python:
                        package: parmana
                        registry: pypi
                        version: 1.1.4
                        install: pip install parmana
                        docs: https://docs.parmanasystems.com/sdks/python
                        reference: https://docs.parmanasystems.com/sdks/reference/python/client
                      go: null
                      java: null
                    connectorSdks:
                      typescript:
                        package: "@parmana/connector-sdk"
                        registry: npm
                        version: 0.1.0
                        install: npm install @parmana/connector-sdk
                        docs: https://docs.parmanasystems.com/reference/connector-sdk
                      python:
                        package: parmana-connector-sdk
                        registry: pypi
                        version: 0.1.0
                        install: pip install parmana-connector-sdk
                        docs: https://docs.parmanasystems.com/reference/connector-sdk-python
  /version:
    get:
      tags:
        - System
      summary: Service version
      operationId: getVersion
      description: >
        Returns hardcoded deployment identifiers. See the response schema
        description: these three literals are not read from package.json,
        environment variables, or build metadata. Requires caller
        authentication, like every route not listed as exempt in this document's
        top-level description.
      responses:
        "200":
          description: Service version information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/version-response.schema"
              examples:
                version:
                  summary: Real captured response
                  value:
                    name: Parmana
                    version: 0.4.0
                    api: v1
        "401":
          $ref: "#/components/responses/Unauthorized"
  /keys/{keyId}:
    get:
      tags:
        - System
      summary: Fetch a public signing key for independent, offline verification
      operationId: getKey
      description: >
        Deliberately unauthenticated, like GET /audit/verify and GET
        /refusal/verify. A third party (regulator, auditor, customer tool)
        fetching the key it needs to independently verify a signature cannot be
        required to already hold a Parmana credential to reach it. Returns the
        current or any still-retained historical key's public half; a keyId
        whose private key was rotated away from is still resolvable here as long
        as its files were not deleted. See
        packages/crypto/src/OfflineVerifier.ts (and its Python counterpart,
        python/parmana/crypto/ offline_verifier.py) for a reference verifier
        that consumes exactly this response's `pem` field with zero further
        network calls.
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The requested public key.
          content:
            application/json:
              schema:
                type: object
                required:
                  - keyId
                  - algorithm
                  - use
                  - pem
                properties:
                  keyId:
                    type: string
                  algorithm:
                    type: string
                    description: >
                      The key's actual algorithm, derived from the key material
                      itself (asymmetricKeyType), not a global config value.
                  use:
                    type: string
                    enum:
                      - sig
                  pem:
                    type: string
                    description: PEM-encoded SPKI public key (RFC 7468).
                  jwk:
                    type: object
                    description: >
                      Node's native JWK export for this key's algorithm, when
                      available. Ed25519 exports as kty "OKP"; ML-DSA-65 exports
                      as kty "AKP" (the IETF JOSE/COSE key type for ML-DSA, not
                      an identifier this codebase invented). Omitted, not null,
                      when unavailable.
        "404":
          description: No key exists for the given keyId.
  /.well-known/jwks.json:
    get:
      tags:
        - System
      summary: List every public signing key this deployment can currently produce
      operationId: getJwks
      description: >
        Same unauthenticated, third-party-verification purpose as GET
        /keys/{keyId}, this is the enumeration form. Not a standards-pure RFC
        7517 JWK Set (not every entry necessarily has a `jwk` field), but a
        superset any consumer that only wants `.jwk` per entry can filter down
        to.
      responses:
        "200":
          description: Every key this deployment can currently produce a public key for.
          content:
            application/json:
              schema:
                type: object
                required:
                  - keys
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      required:
                        - keyId
                        - algorithm
                        - use
                        - pem
                      properties:
                        keyId:
                          type: string
                        algorithm:
                          type: string
                        use:
                          type: string
                          enum:
                            - sig
                        pem:
                          type: string
                        jwk:
                          type: object
  /callers/me:
    get:
      tags:
        - System
      summary: Get the authenticated caller's identity and resolved scope
      operationId: getCallerMe
      description: >
        The proof artifact a security review asks for: "show me this agent's
        identity and exactly what it's authorized to do." Read-only, self-lookup
        only, an authenticated caller sees its own record, never another
        caller's, and this never returns key material. Values are resolved (the
        effective scope after defaults are applied), not the raw configured
        entry: allowedPrincipalIds defaults to [callerId] and
        allowedCapabilities defaults to an empty array when unset on the key,
        see packages/api/src/routes/callers-me.ts. Requires caller
        authentication, like every route not listed as exempt in this document's
        top-level description.


        Returns 404 with {"error":"No authenticated caller identity available."}
        when no caller identity is present on the request, which in practice
        only happens when caller authentication is disabled
        (PARMANA_AUTH_DISABLED=true, local development only). Under normal,
        authenticated operation this route always has a callerId by the time it
        runs.
      responses:
        "200":
          description: The authenticated caller's identity and resolved scope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/callers-me-response.schema"
              examples:
                callerMe:
                  summary: Real captured response
                  value:
                    callerId: demo
                    allowedPrincipalIds:
                      - demo
                    allowedCapabilities:
                      - test:fixture-execute
                    unrestrictedCapabilities: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No authenticated caller identity on the request (caller auth
            disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                noCallerIdentity:
                  summary: Real captured response when caller-auth is disabled
                  value:
                    error: No authenticated caller identity available.
  /execute:
    post:
      tags:
        - Execution
      summary: Execute a Business Transaction
      operationId: executeTransaction
      description: >
        Runs the complete pipeline synchronously and returns the finished
        Execution Trust Record. In order, the server accepts and stores the
        Business Transaction, evaluates the policy, signs an authorization for
        an approved action and releases it to the connector, then builds, signs
        and verifies the record and generates a receipt.


        `businessTransactionId` must be a valid UUID (v1 to v5). It is the
        idempotency key: sending the same one again returns `409`. The server
        assigns `status` and `createdAt`, sets `metadata.submittedBy` from the
        authenticated key, and drops any top level field that is not in the
        request schema.


        Which `intent.action` values work depends on the connectors registered
        on the server. An action with no registered connector fails with a
        `500`.


        How each outcome is reported:


        1. `200`: approved and released. The body is the signed Execution Trust
        Record.

        2. `403` with code `POLICY_DENIED`: a policy refused. This is final and
        nothing was released.

        3. `403` with code `CAPABILITY_NOT_ALLOWED`, or with no code: the key
        may not invoke the action, or may not assert that principal.

        4. `429`: rate limited. Nothing was recorded. Wait for the `Retry-After`
        header.

        5. `503` with code `SIGNING_UNAVAILABLE`, `AUDIT_UNAVAILABLE` or
        `CONNECTOR_NOT_REGISTERED`: refused before release. Nothing was
        executed. For `CONNECTOR_NOT_REGISTERED` the operator must configure the
        connector for that action before any retry.

        6. `500` with code `EXECUTION_RECORD_INCOMPLETE`: the action was
        released but its signed record could not be produced. Do not resubmit
        under a new id.


        The examples named `vendor-payment-flow` are historical captures that
        show the response shape. The `payments:execute` action they use no
        longer exists on a current server. See the [Error
        catalog](/api-reference/error-catalog) and [Integrate Parmana:
        specification for AI agents](/agents/integrate).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/transaction-create-request.schema"
            examples:
              test-fixture-flow:
                summary: A request that runs on a server started with NODE_ENV=test, using the
                  test only capability test:fixture-execute. It was captured
                  live on 2026-09-14 and is approved.
                value:
                  businessTransactionId: e54187e6-431f-4e1c-9c0e-ff2cb5d6d40a
                  metadata:
                    businessTransactionId: e54187e6-431f-4e1c-9c0e-ff2cb5d6d40a
                    correlationId: 9c039d73-7fb1-461f-908f-c646c905633c
                    sourceSystem: docs-api-reference
                    submittedBy: docs-example
                    submittedAt: 2026-09-14T17:17:50.000Z
                  authority:
                    authorityId: f10f016f-b7c0-443e-8307-d26f5fa98067
                    authorityType: SERVICE
                    principalId: docs-example-caller
                    displayName: Docs Example Caller
                    issuedAt: 2026-09-14T17:17:50.000Z
                  authorization:
                    authorizationId: 5f112f4c-a43d-41dd-bfee-66a49efe33de
