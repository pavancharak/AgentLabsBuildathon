        "400":
          description: businessTransactionId missing/malformed, or a Business Transaction
            trust-chain invariant failed (BusinessTransactionValidationError),
            identical checks and treatment to POST /execute.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                badUuid:
                  summary: Real captured response, malformed businessTransactionId
                  value:
                    error: businessTransactionId must be a valid UUID.
                invariantMismatch:
                  summary: Real captured response, authorization.authorityId does not match
                    authority.authorityId
                  value:
                    error: authorization.authorityId must match authority.authorityId.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Identical to POST /execute. Three distinct denials share this
            status: code POLICY_DENIED (a policy rejected the transaction, a
            final decision), code CAPABILITY_NOT_ALLOWED (the key may not invoke
            this action), and no code, which is the principal check:
            transaction.authority.principalId is missing/empty, or the
            authenticated caller is not permitted to assert it
            (isPrincipalAllowed). See POST /execute, identical check, same route
            ordering (before metadata.submittedBy is server-set, before Policy
            evaluation), live-verified on both routes."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                principalNotAllowed:
                  summary: Real captured response, principalId not permitted for this caller
                  value:
                    error: Caller is not permitted to assert this authority.principalId.
                capabilityNotAllowed:
                  summary: The key may not invoke this action
                  value:
                    error: Caller is not permitted to invoke this capability.
                    code: CAPABILITY_NOT_ALLOWED
                policyDenied:
                  summary: A policy rejected the transaction, a final decision
                  value:
                    error: "Execution rejected: Vendor payment rejected because the assessed payment
                      risk exceeds the maximum permitted threshold."
                    code: POLICY_DENIED
        "404":
          description: transaction.policy.name/version does not match any published Policy
            (PolicyNotFoundError). See POST /execute, identical pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                policyNotFound:
                  summary: Real captured response, unknown policy referenced by the transaction
                  value:
                    error: Policy 'does-not-exist' version '9.9.9' was not found.
        "409":
          description: A Business Transaction with this businessTransactionId already
            exists (DuplicateBusinessTransactionError).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                duplicate:
                  summary: Real captured response
                  value:
                    error: Business Transaction '1a341e62-18de-408e-9b34-89aec901dae5' already
                      exists.
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Server failure. Code EXECUTION_RECORD_INCOMPLETE (the action was
            released but its signed record could not be produced, do not
            resubmit under a new businessTransactionId), no Connector registered
            for the request's action, and a structurally incomplete body
            throwing an uncaught TypeError. A policy rejection is NOT a 500, it
            is a 403 with code POLICY_DENIED. See the fuller description on POST
            /execute, same pipeline.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error.schema"
              examples:
                executionRecordIncomplete:
                  summary: The action was released but its signed record could not be produced
                  value:
                    error: "The action for business transaction
                      'e54187e6-431f-4e1c-9c0e-ff2cb5d6d40a' was released to the
                      execution system, but its signed Execution Trust Record
                      could not be produced. Do not retry as a new transaction:
                      reconcile against the connector and the execution audit
                      events for this businessTransactionId. authorizationId:
                      381ef27a-0955-4085-9e5d-e4223fef2986."
                    code: EXECUTION_RECORD_INCOMPLETE
        "503":
          $ref: "#/components/responses/SigningUnavailable"
