    transactions-list-response.schema:
      title: Transactions List Response
      description: Response returned by GET /transactions. A bare array, no pagination
        envelope (no page/pageSize/totalItems metadata), even though the
        endpoint accepts page and pageSize query parameters.
      type: array
      items:
        $ref: "#/components/schemas/business-transaction.schema"
    verification-request.schema:
      title: Verification Request
      description: Request payload for POST /verify. businessTransactionId is required
        and must be a valid UUID; both are rejected with a 400, with distinct
        messages depending on which check fails.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Business Transaction to verify.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    verification-response.schema:
      title: Verification Response
      description: "Response returned by POST /verify and GET
        /verification/{businessTransactionId}: a Verification."
      allOf:
        - $ref: "#/components/schemas/verification.schema"
      examples:
        - verificationId: 0ad69d3f-7fd0-4507-ab38-e386146757ae
          businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          status: VERIFIED
          message: Execution Trust Record verified successfully.
          verifiedAt: 2026-07-07T16:38:59.344Z
          trustRecordHash: 989aef83d595202ec02bb338ac00461abec0541098ea065f965b5cde342d3b25
    refusal-record.schema:
      title: Refusal Record
      description: "Durable, signed, independently verifiable evidence that a policy
        decision rejected a transaction (RFC-0021). Scope is deliberately
        narrow: covers PolicyEngine.evaluate REJECTs and SignalIntentBinder
        binding-violation REJECTs only, not caller-authentication failures or
        webhook signature failures, which are a separate, unsigned audit-sink
        capability. At most one Refusal Record exists per
        businessTransactionId."
      type: object
      additionalProperties: true
      required:
        - refusalRecordId
        - businessTransactionId
        - decision
        - evaluatedIntent
        - refusalRecordHash
        - signature
        - createdAt
      properties:
        refusalRecordId:
          type: string
          description: Unique Refusal Record identifier.
        businessTransactionId:
          type: string
          description: Business Transaction this refusal is about.
        decision:
          $ref: "#/components/schemas/decision.schema"
        evaluatedIntent:
          type: object
          description: "The Intent snapshot the signals were evaluated against: target and
            parameters only, present for every refusal, not only binding
            violations."
          additionalProperties: true
          properties:
            target:
              type: string
            parameters:
              type: object
              additionalProperties: true
        bindingViolations:
          type: array
          description: Present only when the rejection came from SignalIntentBinder.
            Absent (not an empty array) for an ordinary PolicyEngine.evaluate
            REJECT that never reached binding-violation logic at all.
          items:
            type: object
            additionalProperties: true
            required:
              - signalKey
              - intentPath
              - signalValue
              - intentValue
            properties:
              signalKey:
                type: string
              intentPath:
                type: string
              signalValue: {}
              intentValue: {}
        submittedBy:
          type: string
          description: Authenticated caller who submitted the rejected request. Absent
            when caller authentication is disabled.
        refusalRecordHash:
          type: string
          description: Canonical hash of this Refusal Record, same convention as
            ExecutionTrustRecord.trustRecordHash.
        signature:
          type: object
          description: Cryptographic signature over the canonical Refusal Record, signed
            with the same key as ExecutionTrustRecord, one root of trust for
            both approvals and refusals.
          additionalProperties: true
          required:
            - algorithm
            - keyId
            - value
            - signedAt
          properties:
            algorithm:
              type: string
              examples:
                - ed25519
            keyId:
              type: string
              description: Identifier of the signing key.
            value:
              type: string
              description: Base64-encoded signature value.
            signedAt:
              type: string
              format: date-time
        createdAt:
          type: string
          format: date-time
          description: UTC timestamp when this Refusal Record was created.
      examples:
        - refusalRecordId: eddc5dd1-a791-4470-9534-11b3fc573ab8
          businessTransactionId: 353c73fb-5e87-4dbe-8bfc-c15c8f18d871
          decision:
            decisionId: 3919f4b6-cbc8-44ec-a6a1-8887ee85f314
            intentId: 4ba6b14a-c593-4f5c-ab58-dcef38a29364
            policy:
              name: vendor-payment
              version: 2.0.0
              schemaVersion: 1.0.0
            signals:
              vendorVerified: false
              invoiceVerified: true
              paymentApproved: true
              sufficientFunds: true
              paymentAmount: 1000
              riskScore: 5
              vendorId: vendor://payments
            outcome: REJECTED
            reason: Vendor payment rejected because the vendor has not been verified.
            evaluatedAt: 2026-09-15T03:27:45.666Z
          evaluatedIntent:
            target: vendor://payments
            parameters:
              amount: 1000
              currency: USD
          createdAt: 2026-09-15T03:27:45.666Z
          refusalRecordHash: 47d8200e839f9b4a1a53dba941e318553c9b024bc64d26c5b613e5ae2aeb65ca
          signature:
            algorithm: ed25519
            keyId: default
            value: tT32/iJ0bEDxjc+/KPeAegTBSrzpRFW14f9Vyv3Ykx+H/rLHcgd7SlFH/BAXut8sEH2mpo0smg82tSoXmZkpDQ==
            signedAt: 2026-09-15T03:27:45.668Z
    verify-result-response.schema:
      title: Verify Result Response
      description: "Response shared by POST /refusal/verify and POST /audit/verify: a
        bare signature-validity result, no wrapper, no partial-failure detail.
        Both routes verify a signature over bytes with no database lookup, so
        there is nothing more specific to report than valid or not."
      type: object
      additionalProperties: false
      required:
        - valid
      properties:
        valid:
          type: boolean
          description: Whether the signature verifies against Parmana's public key for the
            stated algorithm and key ID.
      examples:
        - valid: true
        - valid: false
    audit-verify-request.schema:
      title: Audit Verify Request
      description: "Request body for POST /audit/verify: the signed
        caller-authentication audit event and its stored signature, not a lookup
        by ID. Checked structurally on the server before signature verification
        runs. Verification operates on canonical bytes and the signature alone,
        never on event.type."
      type: object
      additionalProperties: false
      required:
        - event
        - signature
      properties:
        event:
          type: object
          description: The caller-authentication audit event as stored. Only type,
            occurredAt, and route are structurally required; the event may carry
            further fields depending on what produced it.
          additionalProperties: true
          required:
            - type
            - occurredAt
            - route
          properties:
            type:
              type: string
            occurredAt:
              type: string
              format: date-time
            route:
              type: string
        signature:
          type: object
          description: The signature stored alongside the event. Only production
            (Supabase) audit sinks sign; in-memory test sinks never produce a
            genuine one of these.
          additionalProperties: true
          required:
            - algorithm
            - keyId
            - value
          properties:
            algorithm:
              type: string
              examples:
                - ed25519
            keyId:
              type: string
            value:
              type: string
              description: Base64-encoded signature value.
      examples:
        - event:
            type: caller_authenticated
            occurredAt: 2026-09-15T03:00:00.000Z
            route: /version
          signature:
            algorithm: ed25519
            keyId: default
            value: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
    receipt-request.schema:
      title: Receipt Request
      description: Request payload for POST /receipt. businessTransactionId is
        required and must be a valid UUID; both are rejected with a 400, with
        distinct messages depending on which check fails.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          format: uuid
          description: Business Transaction to generate a Receipt for. Its Execution Trust
            Record must already have a successful (VERIFIED) Verification, or
            the request fails with a 409.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    trust-records-list-response.schema:
      title: Trust Records List Response
      description: Response returned by GET /trust-records (bulk/compliance export). A
        bare array, no pagination envelope (no page/pageSize/totalItems
        metadata) -- the same shape convention as GET /transactions. Each item
        is a full Execution Trust Record, the same shape GET
        /trust-records/{businessTransactionId} returns for one.
      type: array
      items:
        $ref: "#/components/schemas/execution-trust-record.schema"
    replay-request.schema:
      title: Replay Request
      description: Request payload for POST /replay. businessTransactionId is required
        (rejected with a 400 if missing or empty), unlike POST /verify and POST
        /receipt, this route does not additionally validate UUID format.
      type: object
      additionalProperties: true
      required:
        - businessTransactionId
      properties:
        businessTransactionId:
          type: string
          description: Business Transaction to replay.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
    replay-response.schema:
      title: Replay Response
      description: "Response returned by POST /replay. A deliberately small shape
        distinct from the Execution Trust Record it replays: it re-verifies the
        record's stored signature via VerificationCrypto and reports only
        whether that succeeded, alongside the hash it checked."
      type: object
      additionalProperties: false
      required:
        - businessTransactionId
        - trustRecordHash
        - verified
      properties:
        businessTransactionId:
          type: string
          description: Business Transaction that was replayed.
        trustRecordHash:
          type: string
          description: Hash of the Execution Trust Record that was replayed.
        verified:
          type: boolean
          description: Whether the Execution Trust Record's stored signature verified
            successfully.
      examples:
        - businessTransactionId: eed2a972-1bf5-4166-8472-761f76fbf1b2
          trustRecordHash: 989aef83d595202ec02bb338ac00461abec0541098ea065f965b5cde342d3b25
          verified: true
    policy-validate-request.schema:
      title: Policy Validate Request
      description: Request payload for POST /policies/validate. policyId and
        policyVersion are each required non-empty strings, checked in that
        order; each missing/empty field is rejected with its own 400 and a
        distinct message.
      type: object
      additionalProperties: true
      required:
        - policyId
        - policyVersion
      properties:
        policyId:
          type: string
          minLength: 1
          description: Policy name, matching the directory name under the configured
            policy directory.
        policyVersion:
          type: string
          minLength: 1
          description: Policy version, matching the version subdirectory.
      examples:
        - policyId: vendor-payment
          policyVersion: 2.0.0
    policy-validate-response.schema:
      title: Policy Validate Response
      description: Response returned by POST /policies/validate on every status code
        (200, 400, and 404 all use this exact shape). This endpoint does NOT use
        the shared Error envelope (../common/error.schema.json) for its failure
        responses.
      type: object
      additionalProperties: false
      required:
        - valid
        - errors
      properties:
        valid:
          type: boolean
          description: Whether the referenced policy exists and is readable.
        errors:
          type: array
          description: Empty when valid is true; otherwise exactly one human-readable
            message.
          items:
            type: string
      examples:
        - valid: true
          errors: []
        - valid: false
          errors:
            - Policy 'does-not-exist' version '9.9.9' was not found.
        - valid: false
          errors:
            - policyVersion is required.
    propose-policy-change-request.schema:
      title: Propose Policy Change Request
      description: Request body for POST /policies/{name}/{version}/pending-changes.
      type: object
      additionalProperties: false
      required:
        - proposedContent
        - reason
      properties:
        proposedContent:
          type: object
          description: The full proposed policy.json content, in its entirety. Its
            policyId must equal the {name} path parameter, and its policyVersion
            must match ^[A-Za-z0-9._-]+$. Validated against the same rules POST
            /policies/validate checks.
          additionalProperties: true
        reason:
          type: string
          description: Free-text justification. Required, non-empty.
      examples:
        - proposedContent:
            policyId: openapi-capture-demo
            policyVersion: 1.0.0
            schemaVersion: 1.0.0
            rules:
              - id: always-approve
                condition:
                  always: true
                outcome:
                  action: approve
                  reason: OpenAPI spec capture fixture
          reason: Capture a real Pending Policy Change for the OpenAPI spec
    pending-policy-change.schema:
      title: Pending Policy Change
      description: A proposed change to a policy's content, held in a durable pending
        state until a second, distinct human explicitly approves or rejects it
        (Policy Governance, maker-checker). Only ever moves from
        PENDING_APPROVAL to APPROVED or REJECTED, exactly once.
      type: object
      additionalProperties: true
      required:
        - pendingPolicyChangeId
        - policyName
        - policyVersion
        - proposedContent
        - proposedBy
        - proposedAt
        - status
        - reason
      properties:
        pendingPolicyChangeId:
          type: string
          description: Unique Pending Policy Change identifier.
        policyName:
          type: string
          description: The policy this proposal targets, same identifier as Policy.policyId.
        policyVersion:
          type: string
          description: "The existing version this proposal is a change against (\"the
            version being replaced\"). Not necessarily equal to
            proposedContent's own declared version: an in-place patch and a
            version bump are both legitimate."
        proposedContent:
          type: object
          description: The full proposed policy.json content, in its entirety, not a diff
            or patch.
          additionalProperties: true
        proposedBy:
          type: string
          description: Identity of the proposer (maker). Always a human-authenticated
            (credentialHolderType USER) caller.
        proposedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - PENDING_APPROVAL
            - APPROVED
            - REJECTED
        reason:
          type: string
          description: Free-text justification from the proposer, required at creation.
        resolvedBy:
          type: string
          description: Identity of the resolver (checker). Absent while PENDING_APPROVAL.
            Never equal to proposedBy.
        resolvedAt:
          type: string
          format: date-time
          description: Absent while PENDING_APPROVAL.
        rejectionReason:
          type: string
          description: Present only when status is REJECTED.
        coverageWarnings:
          type: array
          description: "Present only when non-empty: uncovered-fact warnings from
            PolicyValidator.findUncoveredFacts against proposedContent."
          items:
            type: string
        ruleConflicts:
          type: array
          description: "Present only when non-empty: advisory rule-conflict warnings from
            PolicyValidator.findRuleConflicts against proposedContent, never
            blocking."
          items:
            type: string
      examples:
        - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
          policyName: openapi-capture-demo
          policyVersion: 1.0.0
          proposedContent:
            policyId: openapi-capture-demo
            policyVersion: 1.0.0
            schemaVersion: 1.0.0
            rules:
              - id: always-approve
                condition:
                  always: true
                outcome:
                  action: approve
                  reason: OpenAPI spec capture fixture
          proposedBy: human-maker
          proposedAt: 2026-09-15T03:47:13.920Z
          status: APPROVED
          reason: Capture a real Pending Policy Change for the OpenAPI spec
          resolvedBy: human-checker
          resolvedAt: 2026-09-15T03:48:03.586Z
    pending-changes-list-response.schema:
      title: Pending Changes List Response
      description: "Response returned by GET /policies/pending-changes. Each entry is
        a Pending Policy Change plus a diff view: current (the live content at
        (policyName, policyVersion) today, or null if that version has never
        been published) and proposed (the change's own proposedContent)."
      type: object
      additionalProperties: false
      required:
        - changes
      properties:
        changes:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/pending-policy-change.schema"
              - type: object
                required:
                  - diff
                properties:
                  diff:
                    type: object
                    additionalProperties: false
                    required:
                      - current
                      - proposed
                    properties:
                      current:
                        description: The live policy.json content today, or null if this version has
                          never been published.
                      proposed:
                        description: The same value as this entry's own proposedContent.
      examples:
        - changes:
            - pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
              policyName: openapi-capture-demo
              policyVersion: 1.0.0
              proposedContent:
                policyId: openapi-capture-demo
                policyVersion: 1.0.0
                schemaVersion: 1.0.0
                rules:
                  - id: always-approve
                    condition:
                      always: true
                    outcome:
                      action: approve
                      reason: OpenAPI spec capture fixture
              proposedBy: human-maker
              proposedAt: 2026-09-15T03:47:13.920Z
              status: PENDING_APPROVAL
              reason: Capture a real Pending Policy Change for the OpenAPI spec
              diff:
                current: null
                proposed:
                  policyId: openapi-capture-demo
                  policyVersion: 1.0.0
                  schemaVersion: 1.0.0
                  rules:
                    - id: always-approve
                      condition:
                        always: true
                      outcome:
                        action: approve
                        reason: OpenAPI spec capture fixture
    policy-change-step-up-authorization.schema:
      title: Policy Change Step-Up Authorization
      description: "Signed envelope proving a checker's explicit, fresh intent to
        approve or reject one specific Pending Policy Change (Policy Governance,
        Layer 4). Produced by PolicyChangeStepUpAuthorizationSigner
        (@parmana/crypto) using the checker's own step-up private key, never the
        bearer API key. Verified server-side against: the checker's registered
        stepUpPublicKey, payload.pendingPolicyChangeId matching the URL's {id},
        payload.action matching the endpoint (approve vs reject),
        payload.expiresAt not yet passed, and payload.nonce not previously seen
        (single-use, replay-rejected on a second attempt with the same
        envelope)."
      type: object
      additionalProperties: true
      required:
        - payload
        - signature
        - keyId
        - algorithm
      properties:
        payload:
          type: object
          additionalProperties: true
          required:
            - version
            - nonce
            - pendingPolicyChangeId
            - action
            - authorizedAt
            - expiresAt
          properties:
            version:
              type: integer
            nonce:
              type: string
              description: Single-use value; a second request replaying the same envelope is
                rejected.
            pendingPolicyChangeId:
              type: string
            action:
              type: string
              enum:
                - approve
                - reject
            authorizedAt:
              type: string
              format: date-time
            expiresAt:
              type: string
              format: date-time
        signature:
          type: string
          description: Base64-encoded signature over the canonical payload, signed with
            the checker's step-up private key.
        keyId:
          type: string
        algorithm:
          type: string
          examples:
            - ed25519
      examples:
        - payload:
            version: 1
            nonce: 343ee454-92c6-4ef9-9cfe-e98329e51f53
            pendingPolicyChangeId: 6f4e4020-adf5-4449-938d-27aab58f66b7
            action: approve
            authorizedAt: 2026-09-15T03:47:51.939Z
            expiresAt: 2026-09-15T03:49:51.939Z
          signature: keOXnzUk8KcGrQTkpXC4Ki8ps3GTvMANwqq96b+toxba07gjkcmpyL/vaPZ7+pPZ1HAOJOOy3rj5XfhcwOTnAw==
          keyId: human-checker-step-up-key
          algorithm: ed25519
    approve-policy-change-request.schema:
      title: Approve Policy Change Request
      description: Request body for POST /policies/pending-changes/{id}/approve.
      type: object
      additionalProperties: false
      required:
        - stepUpAuthorization
