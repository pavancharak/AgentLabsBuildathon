name: Python SDK

# NOTE: python/.github/workflows/ci.yml exists but is NOT picked up by
# GitHub Actions in this monorepo -- GitHub only scans
# <repo-root>/.github/workflows/, and there was no such directory here
# before this file. That file is written as if python/ were the root of
# its own standalone repo (plain `pip install -e .`, no working-directory),
# which is what it becomes if python/ is ever split out on its own. This
# workflow is the one that actually runs against this monorepo today, and
# is the only place the model drift guard (which needs packages/shared
# and the workspace node_modules) can run.

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    paths:
      - "python/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"

jobs:
  python-sdk:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install workspace
        run: npm ci

      - name: Build workspace
        # python/tests/test_live_server_integration.py spawns the real
        # @parmana/api server, which imports @parmana/shared (and other
        # workspace packages) via their built dist/ output, not TS source
        # -- same as ci.yml's own Build step, needed here too since each
        # workflow gets a fresh checkout with no dist/ committed.
        run: npm run build

      - name: Check generated models are up to date
        # python/parmana/models/*.py is generated from
        # packages/shared/src/domain/*.ts (and CryptoAlgorithms.ts) by
        # python/scripts/generate_models.ts. This fails the build if
        # regenerating would change the committed output, so the SDK
        # cannot silently drift from @parmana/shared.
        run: npm run check:python-models

      - name: Install Python package
        run: |
          python -m pip install --upgrade pip
          pip install -e "./python[dev]"

      - name: Lint (ruff)
        run: ruff check .
        working-directory: python

      - name: Format check (black)
        run: black --check .
        working-directory: python

      - name: Type check (mypy)
        run: mypy
        working-directory: python

      - name: Run tests
        run: pytest -v
        working-directory: python
