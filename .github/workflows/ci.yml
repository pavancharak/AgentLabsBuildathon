name: CI

# Runs the TypeScript workspace's build and full vitest suite on every push
# and pull request. Deliberately does not depend on any .env file: every
# environment variable the app needs to start is provided explicitly below,
# so this workflow also proves the repo is buildable/testable from a fresh
# clone with no local secrets present.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      # Required at startup by packages/shared/src/config/Config.ts —
      # points at the repo's own committed reference policies, not a
      # separate fixtures directory.
      PARMANA_POLICY_DIR: ./policies
      # Explicit default; keeps Supabase-gated integration tests
      # (packages/api/tests/helpers/supabase-availability.ts) skipped
      # rather than silently reaching for SUPABASE_* vars that aren't set.
      PARMANA_STORAGE: memory
      KEY_PROVIDER: local
      PRIMARY_SIGNATURE_PROVIDER: ed25519

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Guard against retired terminology
        # Locked vocabulary is "execution authorization" / "AI Execution
        # Authorization". Every exclusion below falls into exactly one of
        # two legitimate categories — never "we didn't want to fix it":
        #
        # (1) Historical self-narration: this repo's own docs describing
        #     its own retired term and the sweep that replaced it. The
        #     phrase appears quoted, in the past tense, as a historical
        #     fact — never as live vocabulary a reader would adopt.
        #       - docs/ROADMAP-v1.md, docs/VERIFICATION-GAPS.md: narrate
        #         the terminology sweep itself.
        #       - docs/architecture/repository-certification.md,
        #         docs/architecture/phase2b-technical-debt-assessment.md,
        #         docs/architecture/phase2c-terminology-guard.md: each
        #         independently found and/or fixed this exact guard gap,
        #         and necessarily quotes the retired phrase to document
        #         what was found. Expect this category to keep gaining
        #         entries over time — that is normal, not a regression;
        #         see phase2c-terminology-guard.md for why a per-file list
        #         is the deliberate choice here, not a stopgap.
        #
        # (2) Third-party citation: docs/site's two "Related work" notes
        #     cite an unrelated third-party academic framework that is
        #     itself actually named "Execution Governance" (Ku, 2026) —
        #     not this repo's retired term, just a name collision.
        #       - docs/site/how-parmana-thinks.mdx
        #       - docs/site/concepts/execution-authorization.mdx
        #
        # docs/site/changelog.mdx is category (1): it's this repo's public
        # changelog narrating the same terminology history in past tense.
        #
        # ci.yml and tests/architecture/terminology-guard.test.ts (its
        # regression-test reimplementation) each exclude themselves because
        # their own comments/patterns/fixtures must name the retired phrase
        # to check for it.
        #
        # If you hit this guard on a new file: first check whether you've
        # actually typed "execution governance" as live, current
        # terminology (fix the doc, don't touch this list) — or whether,
        # like every entry below, you're citing history or an external
        # work by name (add the file here, in the matching category above,
        # with a one-line reason, exactly like its neighbors).
        run: |
          if grep -rIn \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude-dir=dist \
            --exclude-dir=coverage \
            --exclude='ROADMAP-v1.md' \
            --exclude='VERIFICATION-GAPS.md' \
            --exclude='how-parmana-thinks.mdx' \
            --exclude='execution-authorization.mdx' \
            --exclude='repository-certification.md' \
            --exclude='phase2b-technical-debt-assessment.md' \
            --exclude='phase2c-terminology-guard.md' \
            --exclude='changelog.mdx' \
            --exclude='ci.yml' \
            --exclude='terminology-guard.test.ts' \
            -i "execution governance" .; then
            echo "::error::Found retired term 'execution governance' — replace with 'execution authorization' / 'AI Execution Authorization'."
            exit 1
          fi

      - name: Test
        run: npm test

  verify-policy-approvals:
    # Preventive Policy Governance gate (maker-checker): fails the run if
    # any policies/{name}/{version}/policy.json touched by this push/PR
    # has no matching PolicyChangeApprovalRecord for its exact content --
    # i.e. a direct file edit that bypassed the maker-checker API. A
    # separate job (not a step in build-and-test above) deliberately: it
    # needs its own distinct pass/fail status, since this is the specific
    # check meant to become a required status check if/when this repo's
    # plan or visibility ever allows branch protection to be enabled (see
    # docs/VERIFICATION-GAPS.md D-6: advisory only today, not
    # enforced).
    #
    # Fail-CLOSED by design, the opposite discipline of
    # verifyPolicyGovernanceIntegrityAtStartup.ts's own fail-open startup
    # check: scripts/verify-policy-changes-approved.ts exits non-zero on
    # an unapproved file AND on any failure to complete the check at all
    # (Supabase unreachable, malformed response, ...) -- there is no
    # "couldn't check, let it pass" path here.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Need the base commit to diff against, not just the tip --
          # actions/checkout@v4 defaults to a depth-1 shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace
        run: npm ci

      - name: Build (needed for @parmana/crypto's compiled hashing code)
        run: npm run build

      - name: Determine changed policy files
        id: changed-policies
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
            echo "No usable base commit to diff against (e.g. a new branch's first push) -- nothing to check this run."
            echo "files=" >> "$GITHUB_OUTPUT"
          else
            CHANGED=$(git diff --name-only "$BASE_SHA" "${{ github.sha }}" -- 'policies/**/policy.json' | tr '\n' ' ')
            echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify changed policy files are approved
        if: steps.changed-policies.outputs.files != ''
        env:
          # Scoped, read-only credential -- see
          # supabase/migrations/20260818150000_add_ci_read_only_policy_for_approval_records.sql.
          # Deliberately not DATABASE_URL / SUPABASE_SERVICE_ROLE_KEY,
          # which bypass RLS and grant read+write on every table.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npx tsx scripts/verify-policy-changes-approved.ts ${{ steps.changed-policies.outputs.files }}
